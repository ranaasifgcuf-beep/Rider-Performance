  - # ====== Action: Execute JavaScript Code =====================
    id: 38206011438256229
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        if (document.referrer && document.referrer !== window.location.href) {
            window.history.back();
        } else {
            apex.navigation.redirect("f?p=&APP_ID.:101:&SESSION.::NO:::");
        }

    execution: 
      sequence: 10
      event: Close Dialog # 38205958865256228
      fire-when-event-result-is: True
      fire-on-initialization: false

