- # ====== Process: Change Active Status =======================
  id: 16637522947652202
  identification: 
    name: Change Active Status
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
      update hr_emp_insurance
         set is_current = 'N',
             updated_by = nvl(v('APP_USER'), user),
             updated_dt = cast(systimestamp at time zone 'Asia/Dubai' as date)
       where emp_id = :P115_EMP_ID
         and insurance_type = :P115_INSURANCE_TYPE
         and is_current = 'Y';
         end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

