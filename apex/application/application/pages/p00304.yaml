processes: 
- # ====== Process: Fetch Bike Details =========================
  id: 18143999697592763
  identification: 
    name: Fetch Bike Details
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      select v.plate_no,
             v.current_emp_id,
             v.current_assign_dt
        into :P304_plate_no,
             :P304_EMP_ID,
             :P304_ASSIGN_TS
        from vw_fleet_bike_current v
       where v.current_bike_assign_id = :P304_BIKE_ASSIGN_ID;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Retun Bike =================================
  id: 18144397259592763
  identification: 
    name: Retun Bike
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          fleet_pkg.return_bike(
              p_bike_assign_id   => :P304_BIKE_ASSIGN_ID,
              p_return_ts        => :P304_RETURN_TS,
              p_return_condition => :P304_RETURN_CONDITION,
              p_next_status      => :P304_NEXT_STATUS,
              p_next_custody     => :P304_NEXT_CUSTODY,
              p_next_location_id => :P304_NEXT_LOCATION_ID,
              p_remarks          => :P304_REMARKS
          );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

