- # ====== Region: Loan Overview ===============================
  id: 35005596247124541
  identification: 
    name: Loan Overview
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_html             clob;
      
          l_loan_no          hr_emp_loan_v.loan_no%type;
          l_emp_code         hr_emp_loan_v.emp_code%type;
          l_employee_name    hr_emp_loan_v.employee_name%type;
          l_loan_type        hr_emp_loan_v.loan_type%type;
          l_source_type      hr_emp_loan_v.source_type%type;
          l_loan_amount      number;
          l_emi_amount       number;
          l_paid_amount      number;
          l_waived_amount    number;
          l_adjustment_amount number;
          l_reversed_amount  number;
          l_bad_debt_amount  number;
          l_balance_amount   number;
          l_issue_dt         date;
          l_start_month      date;
          l_approval_status  hr_emp_loan_v.approval_status%type;
          l_status           hr_emp_loan_v.status%type;
          l_remarks          hr_emp_loan_v.remarks%type;
      
          function money(p_amount number) return varchar2 is
          begin
              return 'AED ' || to_char(nvl(p_amount,0), 'FM999G999G999G990D00');
          end;
      
          function clean_text(p_text varchar2) return varchar2 is
          begin
              return apex_escape.html(nvl(p_text, '-'));
          end;
      
          function loan_type_name(p_code varchar2) return varchar2 is
          begin
              return case p_code
                       when 'PRO_DEAL'        then 'PRO / Visa Deal Loan'
                       when 'LONG_TERM'       then 'Manual Long-Term Loan'
                       when 'OTHER_LONG_TERM' then 'Other Long-Term Loan'
                       when 'NEW_INSIDE'      then 'New Inside Deal Loan'
                       when 'NEW_OUTSIDE'     then 'New Outside Deal Loan'
                       when 'RENEWAL'         then 'Renewal Deal Loan'
                       else nvl(p_code, '-')
                     end;
          end;
      
          function source_type_name(p_code varchar2) return varchar2 is
          begin
              return case p_code
                       when 'PRO_DEAL' then 'PRO Deal'
                       when 'MANUAL'   then 'Manual Entry'
                       else nvl(p_code, '-')
                     end;
          end;
      
      begin
          select loan_no,
                 emp_code,
                 employee_name,
                 loan_type,
                 source_type,
                 loan_amount,
                 emi_amount,
                 paid_amount,
                 waived_amount,
                 adjustment_amount,
                 reversed_amount,
                 bad_debt_amount,
                 balance_amount,
                 issue_dt,
                 start_month,
                 approval_status,
                 status,
                 remarks
            into l_loan_no,
                 l_emp_code,
                 l_employee_name,
                 l_loan_type,
                 l_source_type,
                 l_loan_amount,
                 l_emi_amount,
                 l_paid_amount,
                 l_waived_amount,
                 l_adjustment_amount,
                 l_reversed_amount,
                 l_bad_debt_amount,
                 l_balance_amount,
                 l_issue_dt,
                 l_start_month,
                 l_approval_status,
                 l_status,
                 l_remarks
            from hr_emp_loan_v
           where loan_id = :P171_LOAN_ID;
      
          l_html := '
      <div class="loan-overview-card">
      
        <div class="loan-header">
          <div>
            <div class="loan-title">' || clean_text(l_loan_no) || '</div>
            <div class="loan-subtitle">' || clean_text(l_emp_code || ' - ' || l_employee_name) || '</div>
          </div>
      
          <div class="loan-badges">
            <span class="loan-badge loan-badge-blue">' || clean_text(l_approval_status) || '</span>
            <span class="loan-badge loan-badge-green">' || clean_text(l_status) || '</span>
          </div>
        </div>
      
        <div class="loan-meta">
          <div><span>Loan Type</span><b>' || clean_text(loan_type_name(l_loan_type)) || '</b></div>
          <div><span>Source</span><b>' || clean_text(source_type_name(l_source_type)) || '</b></div>
          <div><span>Issue Date</span><b>' || clean_text(to_char(l_issue_dt, 'DD-MON-YYYY')) || '</b></div>
          <div><span>Start Month</span><b>' || clean_text(to_char(l_start_month, 'MON-YYYY')) || '</b></div>
        </div>
      
        <div class="loan-kpi-grid">
          <div class="loan-kpi loan-kpi-main">
            <span>Loan Amount</span>
            <b>' || money(l_loan_amount) || '</b>
          </div>
      
          <div class="loan-kpi">
            <span>EMI Amount</span>
            <b>' || money(l_emi_amount) || '</b>
          </div>
      
          <div class="loan-kpi">
            <span>Paid Amount</span>
            <b>' || money(l_paid_amount) || '</b>
          </div>
      
          <div class="loan-kpi">
            <span>Waived Amount</span>
            <b>' || money(l_waived_amount) || '</b>
          </div>
      
          <div class="loan-kpi loan-kpi-danger">
            <span>Bad Debt / Write-off</span>
            <b>' || money(l_bad_debt_amount) || '</b>
          </div>
      
          <div class="loan-kpi loan-kpi-balance">
            <span>Balance Amount</span>
            <b>' || money(l_balance_amount) || '</b>
          </div>
        </div>
      
        <div class="loan-remarks">
          <span>Remarks</span>
          <b>' || clean_text(l_remarks) || '</b>
        </div>
      
      </div>';
      
          return l_html;
      
      exception
          when no_data_found then
              return '<div class="t-Alert t-Alert--warning">Loan record not found.</div>';
      
          when others then
              return '<div class="t-Alert t-Alert--danger">' ||
                     apex_escape.html(sqlerrm) ||
                     '</div>';
      end;
    page-items-to-submit: 
    - P171_LOAN_ID

  layout: 
    sequence: 40
    parent-region: No Parent
