- # ====== Region: Closed Requests =============================
  id: 40933883480733913
  identification: 
    name: Closed Requests
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select br.request_id,
             e.emp_code,
             e.full_employee_name,
      
             br.request_type,
             br.request_status,
             br.priority,
      
             ------------------------------------------------------------------
             -- Bike issued against this request
             -- Priority:
             -- 1. BR.ASSIGNED_BIKE_ID if stored
             -- 2. Assignment table bike_id if bike_assignment_id is stored
             ------------------------------------------------------------------
             nvl(ib.plate_no, to_char(ib.bike_id)) as issued_bike_no,
      
             ib.plate_no as issued_plate_no,
             ib.bike_id  as issued_bike_id,
      
             ------------------------------------------------------------------
             -- Old/current bike at the time request was created
             ------------------------------------------------------------------
             nvl(ob.plate_no, to_char(ob.bike_id)) as old_current_bike_no,
      
             br.rejection_reason,
             br.requested_by,
             to_char(br.requested_dt, 'DD-MON-YYYY HH24:MI') requested_dt,
             br.closed_by,
             to_char(br.closed_dt, 'DD-MON-YYYY HH24:MI') closed_dt
      
      from hr_bike_requests br
      
      join vw_hr_employee_list e
        on e.emp_id = br.emp_id
      
      left join fleet_bike_assignments ba
             on ba.bike_assign_id = br.bike_assignment_id
      
      left join fleet_bikes ib
             on ib.bike_id = nvl(br.assigned_bike_id, ba.bike_id)
      
      left join fleet_bikes ob
             on ob.bike_id = br.current_bike_id
      
      where br.request_status in (
              'REJECTED',
              'CANCELLED',
              'ASSIGNED',
              'CLOSED'
            )
      
      order by br.closed_dt desc nulls last,
               br.request_id desc;

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
