processes: 
- # ====== Process: Calculate Counts ===========================
  id: 16147926312477418
  identification: 
    name: Calculate Counts
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select
              count(case when upper(trim(insurance_bucket)) = 'VALID'
                         then 1 end),
              count(case when upper(trim(insurance_bucket)) = 'NEAR_EXPIRY'
                         then 1 end),
              count(case when upper(trim(insurance_bucket)) = 'EXPIRED'
                         then 1 end),
              count(case when upper(trim(insurance_bucket)) = 'PENDING'
                         then 1 end),
              count(case when upper(trim(insurance_bucket)) = 'CANCELLED'
                         then 1 end)
          into
              :P114_VALID_CNT,
              :P114_NEAR_EXPIRY_CNT,
              :P114_EXPIRED_CNT,
              :P114_PENDING_CNT,
              :P114_CANCELLED_CNT
          from vw_hr_emp_insurance_status
          where insurance_type = :P114_INS_TYPE;
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

