- # ====== Region: Legal Profile List ==========================
  id: 38613669591985411
  identification: 
    name: Legal Profile List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select legal_profile_id,
             emp_id,
             emp_code,
             employee_name,
             legal_worker_type,
             legal_party_name,
      
             case legal_status
                 when 'VALID' then '<span class="t-Badge t-Badge--success">Valid</span>'
                 when 'IN_PROCESS' then '<span class="t-Badge t-Badge--warning">In Process</span>'
                 when 'EXPIRED' then '<span class="t-Badge t-Badge--danger">Expired</span>'
                 when 'ABSCONDING' then '<span class="t-Badge t-Badge--danger">Absconding</span>'
                 when 'EMPLOYEE_COMPLAINT' then '<span class="t-Badge t-Badge--danger">Employee Complaint</span>'
                 when 'CANCELLED_MOHRE' then '<span class="t-Badge t-Badge--danger">Cancelled MOHRE</span>'
                 when 'CANCELLED_ICP' then '<span class="t-Badge t-Badge--danger">Cancelled ICP</span>'
                 when 'CANCELLED' then '<span class="t-Badge">Cancelled</span>'
                 when 'ON_HOLD' then '<span class="t-Badge t-Badge--warning">On Hold</span>'
                 when 'EXITED' then '<span class="t-Badge">Exited</span>'
                 else '<span class="t-Badge">' || apex_escape.html(legal_status) || '</span>'
             end legal_status,
      
             case default_wps_clearing_mode
                 when 'INTERNAL_WPS' then '<span class="t-Badge t-Badge--success">Inside WPS</span>'
                 when 'OUTSIDE_CLEARING' then '<span class="t-Badge t-Badge--warning">Outside Clearing</span>'
                 when 'SUPPLIER_WPS' then '<span class="t-Badge">Supplier WPS</span>'
                 when 'NOT_REQUIRED' then '<span class="t-Badge">Not Required</span>'
                 when 'BLOCKED' then '<span class="t-Badge t-Badge--danger">Blocked</span>'
                 when 'MANAGEMENT_EXCEPTION' then '<span class="t-Badge t-Badge--warning">Management Exception</span>'
                 else '<span class="t-Badge">' || apex_escape.html(default_wps_clearing_mode) || '</span>'
             end wps_mode,
      
             case wps_status
                 when 'ACTIVE' then '<span class="t-Badge t-Badge--success">Active</span>'
                 when 'SETUP_PENDING' then '<span class="t-Badge t-Badge--warning">Setup Pending</span>'
                 when 'BLOCKED' then '<span class="t-Badge t-Badge--danger">Blocked</span>'
                 when 'NOT_REQUIRED' then '<span class="t-Badge">Not Required</span>'
                 when 'EXCEPTION' then '<span class="t-Badge t-Badge--warning">Exception</span>'
                 else '<span class="t-Badge">' || apex_escape.html(wps_status) || '</span>'
             end wps_status,
      
             wps_contract_salary,
             wps_salary_amount,
      
             passport_expiry_days,
             eid_expiry_days,
             visa_expiry_days,
             labour_card_expiry_days,
      
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 183,
                 p_items       => 'P183_LEGAL_PROFILE_ID,P183_EMP_ID',
                 p_values      => legal_profile_id || ',' || emp_id,
                 p_clear_cache => '183'
             ) ||
             '" title="Open Legal Profile"><span class="fa fa-edit"></span></a>' open_profile,
      
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 105,
                 p_items       => 'P105_EMP_ID',
                 p_values      => emp_id,
                 p_clear_cache => '105'
             ) ||
             '" title="Open Documents"><span class="fa fa-folder-open"></span></a>' open_docs
      
      from hr_emp_legal_profile_v
      order by emp_id desc;

