- # ====== Region: SIM Inventory ===============================
  id: 43033348548318994
  identification: 
    name: SIM Inventory
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select sim_id,
             mobile_no,
             iccid_no,
      
             operator_name,
             sim_status_badge,
      
             ownership_type,
             owner_name,
      
             plan_name,
             data_package,
             monthly_cost,
             bill_account_no,
             contract_no,
      
             to_char(activation_dt, 'DD-MON-YYYY') as activation_dt,
             to_char(cancellation_dt, 'DD-MON-YYYY') as cancellation_dt,
      
             current_holder_badge,
             current_emp_code,
             current_employee_name,
             to_char(current_assign_dt, 'DD-MON-YYYY') as current_assign_dt,
      
             remarks,
      
             '<a href="' ||
             apex_util.prepare_url(
                 'f?p=' || :APP_ID || ':333:' || :APP_SESSION ||
                 '::NO::P333_SIM_ID:' || sim_id
             ) ||
             '" class="sim-action-btn" title="Edit SIM">' ||
             '<span class="fa fa-edit" aria-hidden="true"></span>' ||
             '</a>' as edit_action
      
      from vw_fleet_sim_inventory
      order by mobile_no;

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
