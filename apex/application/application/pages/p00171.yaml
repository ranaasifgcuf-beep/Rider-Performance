---
# ====== Page: Loan Detail ===================================
id: 171
identification: 
  name: Loan Detail
  alias: LOAN-DETAIL
  title: Loan Detail

appearance: 
  page-mode: Normal
  page-template: Theme Default
  template-options: 
  - '#DEFAULT#'

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

css: 
  inline: |
    .loan-actionbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    
    .loan-overview-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      margin-bottom: 18px;
    }
    
    .loan-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      padding-bottom: 14px;
      border-bottom: 1px solid #edf0f4;
      margin-bottom: 16px;
    }
    
    .loan-title {
      font-size: 26px;
      font-weight: 800;
      color: #111827;
      letter-spacing: .3px;
    }
    
    .loan-subtitle {
      margin-top: 4px;
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
    }
    
    .loan-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .loan-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .loan-badge-blue {
      background: #eff6ff;
      color: #075db3;
      border: 1px solid #bfdbfe;
    }
    
    .loan-badge-green {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #bbf7d0;
    }
    
    .loan-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .loan-meta div {
      background: #f8fafc;
      border: 1px solid #edf0f4;
      border-radius: 12px;
      padding: 12px;
    }
    
    .loan-meta span,
    .loan-kpi span,
    .loan-remarks span {
      display: block;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    
    .loan-meta b {
      color: #111827;
      font-size: 14px;
    }
    
    .loan-kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 12px;
    }
    
    .loan-kpi {
      background: #f8fafc;
      border: 1px solid #edf0f4;
      border-radius: 14px;
      padding: 14px;
      min-height: 92px;
    }
    
    .loan-kpi b {
      display: block;
      color: #111827;
      font-size: 18px;
      font-weight: 800;
    }
    
    .loan-kpi-main {
      background: #fff7ed;
      border-color: #fed7aa;
    }
    
    .loan-kpi-balance {
      background: #eff6ff;
      border-color: #bfdbfe;
    }
    
    .loan-kpi-danger {
      background: #fef2f2;
      border-color: #fecaca;
    }
    
    .loan-remarks {
      margin-top: 12px;
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      padding: 14px;
    }
    
    @media (max-width: 1100px) {
      .loan-kpi-grid {
        grid-template-columns: repeat(3, minmax(140px, 1fr));
      }
    
      .loan-meta {
        grid-template-columns: repeat(2, minmax(150px, 1fr));
      }
    }
    
    @media (max-width: 700px) {
      .loan-header {
        flex-direction: column;
      }
    
      .loan-kpi-grid,
      .loan-meta {
        grid-template-columns: 1fr;
      }
    }

