validations: 
- # ====== Validation: VAL_P322_INSTALLMENT_COUNT ==============
  id: 30112178014516048
  identification: 
    name: VAL_P322_INSTALLMENT_COUNT

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: 'return nvl(:P322_NO_OF_INSTALLMENTS,0) > 0;'
    always-execute: false

  error: 
    error-message: Number of installments must be greater than zero.
    display-location: Inline with Field and in Notification

processes: 
- # ====== Process: FETCH_P322_CHARGE_AMOUNT ===================
  id: 30112024751516047
  identification: 
    name: FETCH_P322_CHARGE_AMOUNT
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      select amount,
      hr_charges_pkg.get_charge_balance(:P322_EMP_CHARGE_ID)
        into :P322_TOTAL_AMOUNT,
        :P322_BALANCE
        from hr_emp_charges
       where emp_charge_id = :P322_EMP_CHARGE_ID;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: GENERATE_EQUAL_INSTALLMENTS ================
  id: 30149638967037206
  identification: 
    name: GENERATE_EQUAL_INSTALLMENTS
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          if :P322_ACTION_MODE = 'RESCHEDULE' then
              hr_charges_pkg.reschedule_remaining_installments(
                  p_emp_charge_id      => :P322_EMP_CHARGE_ID,
                  p_first_due_dt       => :P322_FIRST_DUE_DT,
                  p_no_of_installments => :P322_NO_OF_INSTALLMENTS,
                  p_remarks            => :P322_REMARKS
              );
          else
              hr_charges_pkg.create_equal_installments(
                  p_emp_charge_id      => :P322_EMP_CHARGE_ID,
                  p_first_due_dt       => :P322_FIRST_DUE_DT,
                  p_no_of_installments => :P322_NO_OF_INSTALLMENTS,
                  p_remarks            => :P322_REMARKS
              );
          end if;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: PB_SAVE # 30112277818516049

branches: 
