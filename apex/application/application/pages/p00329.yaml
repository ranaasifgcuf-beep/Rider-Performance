dynamic-actions: 
- # ====== Dynamic Action: Mark SIM Request In Progress ========
  id: 41409676527853046
  identification: 
    name: Mark SIM Request In Progress

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: jQuery Selector
    jquery-selector: .js-sim-inprogress

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 41409762930853047
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var reqId = $(this.triggeringElement).data("request-id");
        
        apex.message.confirm("Mark this SIM request as In Progress?", function(ok) {
            if (ok) {
                apex.item("P329_SELECTED_REQUEST_ID").setValue(reqId);
                apex.submit({ request: "SIM_IN_PROGRESS", showWait: true });
            }
        });

    execution: 
      sequence: 10
      event: Mark SIM Request In Progress # 41409676527853046
      fire-when-event-result-is: True
      fire-on-initialization: false

