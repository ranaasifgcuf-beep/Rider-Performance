- # ====== Region: Loan Workbench ==============================
  id: 35704960382664270
  identification: 
    name: Loan Workbench
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select v.loan_id,
             v.loan_no,
             v.emp_code,
             v.employee_name,
             v.loan_type,
             v.source_type,
             v.loan_amount,
             v.agreed_advance_amount,
             v.emi_amount,
             v.paid_amount,
             v.waived_amount,
             v.adjustment_amount,
             v.reversed_amount,
             v.bad_debt_amount,
             v.balance_amount,
             case v.approval_status
                 when 'DRAFT' then '<span class="t-Badge">Draft</span>'
                 when 'SUBMITTED' then '<span class="t-Badge t-Badge--warning">Submitted</span>'
                 when 'APPROVED' then '<span class="t-Badge t-Badge--success">Approved</span>'
                 when 'REJECTED' then '<span class="t-Badge t-Badge--danger">Rejected</span>'
                 when 'CANCELLED' then '<span class="t-Badge">Cancelled</span>'
                 else '<span class="t-Badge">' || apex_escape.html(v.approval_status) || '</span>'
             end approval_status,
      
             case v.status
                 when 'ACTIVE' then '<span class="t-Badge t-Badge--success">Active</span>'
                 when 'COMPLETED' then '<span class="t-Badge t-Badge--info">Completed</span>'
                 when 'CANCELLED' then '<span class="t-Badge t-Badge--danger">Cancelled</span>'
                 else '<span class="t-Badge">' || apex_escape.html(v.status) || '</span>'
             end loan_status,
      
             to_char(v.issue_dt, 'DD-MON-YYYY') issue_dt,
             to_char(v.start_month, 'MON-YYYY') start_month,
      
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 171,
                 p_items       => 'P171_LOAN_ID',
                 p_values      => v.loan_id,
                 p_clear_cache => '171'
             ) ||
             '" title="View Loan">' ||
             '<span class="fa fa-eye"></span></a>' view_link,
            case
          when v.source_type = 'MANUAL'
           and v.approval_status in ('DRAFT','REJECTED')
          then
              '<a href="' ||
              apex_page.get_url(
                  p_page        => 173,
                  p_items       => 'P173_LOAN_ID',
                  p_values      => v.loan_id,
                  p_clear_cache => '173'
              ) ||
              '" title="Edit / Submit Draft Loan">' ||
              '<span class="fa fa-edit"></span></a>'
          else
              null
      end Edit_link,
      
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 174,
                 p_items       => 'P174_LOAN_ID',
                 p_values      => v.loan_id,
                 p_clear_cache => '174'
             ) ||
             '" title="Print Statement">' ||
             '<span class="fa fa-print"></span></a>' print_link,
      
             '<div class="loan-actions">' ||
      
             /* Receive Payment */
             case
                 when v.approval_status = 'APPROVED'
                  and v.status = 'ACTIVE'
                  and nvl(v.balance_amount,0) > 0
                 then
                     '<a href="' ||
                     apex_page.get_url(
                         p_page        => 172,
                         p_items       => 'P172_LOAN_ID,P172_TXN_TYPE',
                         p_values      => v.loan_id || ',MANUAL_PAYMENT',
                         p_clear_cache => '172'
                     ) ||
                     '" class="t-Button t-Button--tiny t-Button--success t-Button--noLabel" title="Receive Payment">' ||
                     '<span class="fa fa-money"></span></a>'
                 else
                     '<span class="t-Button t-Button--tiny t-Button--noLabel is-disabled" title="Payment not allowed">' ||
                     '<span class="fa fa-money"></span></span>'
             end ||
      
             /* Waiver */
             case
                 when v.approval_status = 'APPROVED'
                  and v.status = 'ACTIVE'
                  and nvl(v.balance_amount,0) > 0
                 then
                     '<a href="' ||
                     apex_page.get_url(
                         p_page        => 172,
                         p_items       => 'P172_LOAN_ID,P172_TXN_TYPE',
                         p_values      => v.loan_id || ',WAIVER',
                         p_clear_cache => '172'
                     ) ||
                     '" class="t-Button t-Button--tiny t-Button--warning t-Button--noLabel" title="Request Waiver">' ||
                     '<span class="fa fa-gift"></span></a>'
                 else
                     '<span class="t-Button t-Button--tiny t-Button--noLabel is-disabled" title="Waiver not allowed">' ||
                     '<span class="fa fa-gift"></span></span>'
             end ||
      
             /* Adjustment */
             case
                 when v.approval_status = 'APPROVED'
                  and v.status = 'ACTIVE'
                 then
                     '<a href="' ||
                     apex_page.get_url(
                         p_page        => 172,
                         p_items       => 'P172_LOAN_ID,P172_TXN_TYPE',
                         p_values      => v.loan_id || ',ADJUSTMENT',
                         p_clear_cache => '172'
                     ) ||
                     '" class="t-Button t-Button--tiny t-Button--warning t-Button--noLabel" title="Request Adjustment">' ||
                     '<span class="fa fa-sliders"></span></a>'
                 else
                     '<span class="t-Button t-Button--tiny t-Button--noLabel is-disabled" title="Adjustment not allowed">' ||
                     '<span class="fa fa-sliders"></span></span>'
             end ||
      
             /* Reversal */
             case
                 when v.approval_status = 'APPROVED'
                  and v.status = 'ACTIVE'
                 then
                     '<a href="' ||
                     apex_page.get_url(
                         p_page        => 172,
                         p_items       => 'P172_LOAN_ID,P172_TXN_TYPE',
                         p_values      => v.loan_id || ',REVERSAL',
                         p_clear_cache => '172'
                     ) ||
                     '" class="t-Button t-Button--tiny t-Button--warning t-Button--noLabel" title="Request Reversal">' ||
                     '<span class="fa fa-undo"></span></a>'
                 else
                     '<span class="t-Button t-Button--tiny t-Button--noLabel is-disabled" title="Reversal not allowed">' ||
                     '<span class="fa fa-undo"></span></span>'
             end ||
      
             /* Bad Debt Write-off */
             case
                 when v.approval_status = 'APPROVED'
                  and v.status = 'ACTIVE'
                  and nvl(v.balance_amount,0) > 0
                 then
                     '<a href="' ||
                     apex_page.get_url(
                         p_page        => 172,
                         p_items       => 'P172_LOAN_ID,P172_TXN_TYPE',
                         p_values      => v.loan_id || ',BAD_DEBT_WRITE_OFF',
                         p_clear_cache => '172'
                     ) ||
                     '" class="t-Button t-Button--tiny t-Button--danger t-Button--noLabel" title="Request Bad Debt Write-off">' ||
                     '<span class="fa fa-warning"></span></a>'
                 else
                     '<span class="t-Button t-Button--tiny t-Button--noLabel is-disabled" title="Bad debt not allowed">' ||
                     '<span class="fa fa-warning"></span></span>'
             end ||
      
             '</div>' as quick_actions,
             '<a href="' ||
      apex_page.get_url(
          p_page        => 175,
          p_items       => 'P175_LOAN_ID,P175_LOAN_TXN_ID',
          p_values      => v.loan_id || ',',
          p_clear_cache => '175'
      ) ||
      '" title="Loan History">' ||
      '<span class="fa fa-history"></span></a>' history_link
      
      from hr_emp_loan_v v
      order by v.loan_id desc;

