- # ====== Region: PRO Deal Workbech ===========================
  id: 34378964252934010
  identification: 
    name: PRO Deal Workbech
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select d.deal_id,
             d.deal_no,
      
             e.emp_code,
             trim(e.first_name || ' ' || e.last_name) as employee_name,
      
             o.org_name as visa_company,
             t.deal_type_name,
             d.entry_status,
      
             d.deal_advance,
             d.deal_amount,
      
             case d.recoverable
                 when 'Y' then 'Yes'
                 when 'N' then 'No'
                 else '-'
             end as recoverable,
      
             d.emi_amount,
             to_char(d.recovery_start_month, 'MON-YYYY') as recovery_start_month,
      
             case d.approval_status
                 when 'DRAFT' then
                     '<span class="t-Badge">Draft</span>'
                 when 'SUBMITTED' then
                     '<span class="t-Badge t-Badge--warning">Submitted</span>'
                 when 'APPROVED' then
                     '<span class="t-Badge t-Badge--success">Approved</span>'
                 when 'REJECTED' then
                     '<span class="t-Badge t-Badge--danger">Rejected</span>'
                 else
                     '<span class="t-Badge">' || apex_escape.html(nvl(d.approval_status, '-')) || '</span>'
             end as approval_status,
      
             case d.loan_created
                 when 'Y' then 'Yes'
                 when 'N' then 'No'
                 else '-'
             end as loan_created,
      
             case d.agreement_signed
                 when 'Y' then 'Yes'
                 when 'N' then 'No'
                 else '-'
             end as agreement_signed,
      
             '<span class="fa fa-eye" title="Open"></span>' as open_link
      
      from hr_pro_deals d
      join hr_employees e
        on e.emp_id = d.emp_id
      left join hr_orgs o
        on o.org_id = d.org_id
      join hr_pro_deal_type_master t
        on t.deal_type_code = d.deal_type_code
      order by d.deal_id desc;

  layout: 
