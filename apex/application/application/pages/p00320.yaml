- # ====== Process: CREATE_HR_EMP_CHARGES ======================
  id: 30108852604516015
  identification: 
    name: CREATE_HR_EMP_CHARGES
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_emp_charge_id number;
      begin
          hr_charges_pkg.create_charge(
              p_emp_id                  => :P320_EMP_ID,
              p_charge_type             => :P320_CHARGE_TYPE,
              p_recurrence_type         => :P320_RECURRENCE_TYPE,
              p_charge_ts               => :P320_CHARGE_TS,
              p_amount                  => :P320_AMOUNT,
              p_source_start_dt         => :P320_SOURCE_START_DT,
              p_source_end_dt           => :P320_SOURCE_END_DT,
              p_source_table_name       => :P320_SOURCE_TABLE_NAME,
              p_source_row_id           => :P320_SOURCE_ROW_ID,
              p_bike_id                 => :P320_BIKE_ID,
              p_charge_to_employee_yn   => :P320_CHARGE_TO_EMPLOYEE_YN,
              p_approval_status         => :P320_APPROVAL_STATUS,
              p_payroll_deduction_code  => :P320_PAYROLL_DEDUCTION_CODE,
              p_remarks                 => :P320_REMARKS,
              p_emp_charge_id           => l_emp_charge_id
          );
      
          :P320_EMP_CHARGE_ID := l_emp_charge_id;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: PB_CREATE # 30107770586516004

