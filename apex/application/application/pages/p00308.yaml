validations: 
- # ====== Validation: Document Type Required ==================
  id: 18039334973024939
  identification: 
    name: Document Type Required

  execution: 
    sequence: 10

  validation: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: |
      :P308_EXPIRY_DT is null
      or :P308_ISSUE_DT is null
      or :P308_EXPIRY_DT > :P308_ISSUE_DT
    always-execute: false

  error: 
    error-message: Expiry Date cannot be earlier than Issue Date.
    display-location: Inline with Field and in Notification

- # ====== Validation: Date Overlapping ========================
  id: 18039509870024941
  identification: 
    name: Date Overlapping

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      declare
          l_cnt number;
      begin
          select count(*)
            into l_cnt
            from fleet_bike_docs d
           where d.bike_id   = :P308_BIKE_ID
             and d.doc_type  = :P308_DOC_TYPE
             and nvl(d.bike_doc_id, -1) <> nvl(:P308_BIKE_DOC_ID, -1)
             and :P308_ISSUE_DT <= nvl(d.expiry_dt, date '4712-12-31')
             and nvl(:P308_EXPIRY_DT, date '4712-12-31') >= d.issue_dt;
      
          return l_cnt = 0;
      end;
    always-execute: false

  error: 
    error-message: Overlapping document period exists for the same bike and document type
    display-location: Inline with Field and in Notification

processes: 
- # ====== Process: Mark Current Record ========================
  id: 18039402804024940
  identification: 
    name: Mark Current Record
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      IF :P308_BIKE_DOC_ID IS NULL THEN
      update fleet_bike_docs
                 set is_current = 'N'
               where bike_id      = :P308_BIKE_ID
                 and doc_type     = :P308_DOC_TYPE
                 and is_current   = 'Y';
                 --and bike_doc_id <> :P308_BIKE_DOC_ID;
                 END IF;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

