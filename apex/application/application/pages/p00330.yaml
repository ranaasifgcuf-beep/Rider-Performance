      fire-on-initialization: false

validations: 
- # ====== Validation: SIM Required ============================
  id: 43010742611045421
  identification: 
    name: SIM Required

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P330_SIM_ID is null then
              return 'Please select SIM to assign.';
          end if;
      
          if :P330_EMP_ID is null then
              return 'Employee is missing.';
          end if;
      
          if :P330_REQUEST_ID is null then
              return 'SIM request is missing.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

  server-side-condition: 
    when-button-pressed: ASSIGN_SIM # 43010292783045416

- # ====== Validation: Return Details Required =================
  id: 43010828653045422
  identification: 
    name: Return Details Required

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P330_CURRENT_SIM_ID is null then
              return 'Current SIM is missing for return.';
          end if;
      
          if :P330_RETURN_REASON is null then
              return 'Return reason is required.';
          end if;
      
          if :P330_RETURN_CONDITION is null then
              return 'Return condition is required.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

  server-side-condition: 
    when-button-pressed: RETURN_SIM # 43010323878045417

processes: 
- # ====== Process:  Default SIM Operation Values ==============
  id: 43009960233045413
  identification: 
    name: ' Default SIM Operation Values'
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          :P330_ASSIGN_DT := nvl(:P330_ASSIGN_DT, cast(systimestamp at time zone 'Asia/Dubai' as date));
          :P330_RETURN_DT := nvl(:P330_RETURN_DT, cast(systimestamp at time zone 'Asia/Dubai' as date));
      
          if :P330_ASSIGN_REASON is null then
              :P330_ASSIGN_REASON :=
                  case
                      when :P330_REQUEST_TYPE = 'ADDITIONAL_SIM' then 'ADDITIONAL_SIM'
                      when :P330_REQUEST_TYPE like 'REPLACEMENT%' then 'REPLACEMENT'
                      when :P330_REQUEST_TYPE = 'TEMPORARY_REPLACEMENT' then 'TEMPORARY'
                      else 'NEW_ISSUE'
                  end;
          end if;
      
          if :P330_RETURN_REASON is null then
              :P330_RETURN_REASON := 'NORMAL_RETURN';
          end if;
      
          if :P330_RETURN_CONDITION is null then
              :P330_RETURN_CONDITION := 'GOOD';
          end if;
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Assign SIM =================================
  id: 43010987596045423
  identification: 
    name: Assign SIM
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_sim_assign_id number;
      begin
          insert into hr_sim_assignments (
              sim_id,
              emp_id,
              assign_dt,
              assign_reason,
              assign_remarks
          )
          values (
              :P330_SIM_ID,
              :P330_EMP_ID,
              nvl(:P330_ASSIGN_DT, cast(systimestamp at time zone 'Asia/Dubai' as date)),
              :P330_ASSIGN_REASON,
              :P330_ASSIGN_REMARKS
          )
