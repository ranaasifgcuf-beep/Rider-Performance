processes: 
- # ====== Process: Fetch Bike Details =========================
  id: 18185975596289891
  identification: 
    name: Fetch Bike Details
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      select plate_no, custody_type_name
        into :P306_PLATE_NO, :P306_CURRENT_CUSTODY
        from vw_fleet_bike_current
       where bike_id = :P306_BIKE_ID;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Change Custody =============================
  id: 18186326724289890
  identification: 
    name: Change Custody
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          fleet_pkg.change_bike_custody(
              p_bike_id      => :P306_BIKE_ID,
              p_new_custody  => :P306_NEW_CUSTODY,
              p_location_id  => :P306_new_LOCATION_ID,
              p_effective_ts => :P306_EFFECTIVE_TS,
              p_reason_code  => :P306_REASON_CODE,
              p_remarks      => :P306_REMARKS
          );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

