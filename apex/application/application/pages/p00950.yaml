      sort: true
      control-break/aggregate: true

  - # ====== Column: PARENT_MENU_ID ==============================
    id: 9953769000188685
    identification: 
      column-name: PARENT_MENU_ID
      type: Select List

    heading: 
      heading: Parent Menu Id
      alignment: start

    layout: 
      sequence: 60
      column-alignment: start
      stretch: Use Report Setting

    accessibility: 
      value-identifies-row: false

    validation: 
      value-required: false

    list-of-values: 
      type: SQL Query
      sql-query: |
        select
          lpad(' ', (level-1)*3) || label as d,
          menu_id as r
        from sec_menu
        where is_active = 'Y'
        start with parent_menu_id is null
        connect by prior menu_id = parent_menu_id
        order siblings by display_order, label
        
      display-extra-values: true
      display-null-value: true

    source: 
      type: Database Column
      database-column: PARENT_MENU_ID
      data-type: NUMBER
      query-only: false
      primary-key: false

    default: 
      duplicate-copies-existing-value: true

    column-filter: 
      enabled: true
      performance-impacting-operators: 
      - Contains
      - Starts With
      - Case Insensitive
      - Regular Expression
      text-case: Mixed
      lov-type: Use List of Values
      exact-match: true

    export-/-printing: 
      include-in-export-/-print: true

    enable-users-to: 
      sort: true
      control-break/aggregate: true
      hide: true

