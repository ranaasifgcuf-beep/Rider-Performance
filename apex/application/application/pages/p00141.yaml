css: 
  inline: |
    /* Page background */
    .t-Dialog-body {
      background: #f6f7fb;
    }
    
    /* Main cards */
    #deal_detail_region,
    #approval_region,
    #agreement_region {
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    
    /* Region headers */
    #deal_detail_region .t-Region-header,
    #approval_region .t-Region-header,
    #agreement_region .t-Region-header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 16px;
    }
    
    /* Region title */
    #deal_detail_region .t-Region-title,
    #approval_region .t-Region-title,
    #agreement_region .t-Region-title {
      font-weight: 700;
      font-size: 15px;
      color: #1f2937;
    }
    
    /* Item labels */
    .t-Form-label {
      font-weight: 600;
      color: #374151;
      font-size: 12px;
    }
    
    /* Form item spacing */
    .t-Form-fieldContainer {
      margin-bottom: 12px;
    }
    
    /* Make remarks cleaner */
    textarea {
      min-height: 90px;
      border-radius: 10px !important;
    }
    
    /* Better switch spacing */
    #agreement_region .t-Form-fieldContainer {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 12px;
    }

