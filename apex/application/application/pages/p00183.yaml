- # ====== Validation: Validate Legal Profile Basic Rules ======
  id: 39251213558729108
  identification: 
    name: Validate Legal Profile Basic Rules

  execution: 
    sequence: 640

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P183_LEGAL_STATUS = 'VALID'
             and :P183_LEGAL_WORKER_TYPE in ('OWN_VISA','GROUP_COMPANY')
             and :P183_LEGAL_ORG_ID is null then
              return 'Legal company is required when legal status is Valid.';
          end if;
      
          if :P183_LEGAL_STATUS = 'VALID'
             and :P183_LEGAL_WORKER_TYPE in ('FREELANCE','FAMILY_SPONSORED','GOLDEN_VISA','OTHER')
             and :P183_EXTERNAL_SPONSOR_NAME is null then
              return 'External sponsor is required for this worker type.';
          end if;
      
          if :P183_WPS_STATUS = 'ACTIVE'
             and :P183_WPS_REQUIRED_YN = 'Y'
             and nvl(:P183_WPS_SALARY_AMOUNT,0) <= 0 then
              return 'WPS salary amount is required when WPS status is Active.';
          end if;
      
          return null;
      end;
    always-execute: true

  error: 
    display-location: Inline with Field and in Notification

- # ====== Validation: Dont Allow Cancellation if employee has a
  id: 40309545653675219
  identification: 
    name: Dont Allow Cancellation if employee has actie assignment

  execution: 
    sequence: 650

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      declare
          l_active_assignment number;
          l_legal_status      varchar2(50);
      begin
          l_legal_status := replace(upper(nvl(:P183_LEGAL_STATUS, 'X')), 'LEGAL_', '');
      
          if l_legal_status in (
              'CANCELLED',
              'CANCELLED_MOHRE',
              'CANCELLED_ICP'
          ) then
      
              select count(*)
                into l_active_assignment
                from hr_assignments
               where emp_id = :P183_EMP_ID
                 and end_dt is null;
      
              if l_active_assignment > 0 then
                  return 'Legal status cannot be changed to Cancelled because employee has an active assignment. Please unassign/offboard the employee first.';
              end if;
      
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

