processes: 
- # ====== Process: FETCH_ACCIDENT_INFO ========================
  id: 30645766628678295
  identification: 
    name: FETCH_ACCIDENT_INFO
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select A.EMP_ID,
                 b.plate_no,
                 a.accident_dt,
                 v.bike_status_name,
                 v.custody_type_name
            into :P315_EMP_ID,
                 :P315_PLATE_NO,
                 :P315_ACCIDENT_DT,
                 :P315_CURRENT_STATUS,
                 :P315_CURRENT_CUSTODY
            from fleet_bike_accidents a
            join fleet_bikes b
              on b.bike_id = a.bike_id
            left join vw_fleet_bike_current v
              on v.bike_id = a.bike_id
           where a.accident_id = :P315_ACCIDENT_ID;
      exception
          when no_data_found then
              raise_application_error(-20001, 'Accident case not found.');
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: START_BIKE_REPAIR ==========================
  id: 30646147340678295
  identification: 
    name: START_BIKE_REPAIR
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          fleet_pkg.start_bike_repair(
              p_accident_id        => :P315_ACCIDENT_ID,
              p_repair_start_dt    => :P315_REPAIR_START_DT,
              p_repair_custody     => :P315_REPAIR_CUSTODY_CODE,
              p_repair_location_id => :P315_REPAIR_LOCATION_ID,
              p_remarks            => :P315_REMARKS
          );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: BTN_SAVE # 30641774089678309

