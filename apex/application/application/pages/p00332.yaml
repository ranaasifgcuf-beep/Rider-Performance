- # ====== Validation: Rejection Reason Required ===============
  id: 43011732264045431
  identification: 
    name: Rejection Reason Required

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P332_REJECTION_REASON is null then
              return 'Rejection reason is required.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

  server-side-condition: 
    when-button-pressed: REJECT # 43012018835045434

processes: 
- # ====== Process:  Reject SIM Reques =========================
  id: 43012672227045440
  identification: 
    name: ' Reject SIM Reques'
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          hr_sim_req_pkg.reject_request(
              p_request_id => :P332_REQUEST_ID,
              p_reason     => :P332_REJECTION_REASON
          );
      
          apex_application.g_print_success_message :=
              'SIM request rejected successfully.';
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: REJECT # 43012018835045434

