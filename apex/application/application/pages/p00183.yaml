css: 
  inline: |
    .legal-header-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        min-height: 105px;
        padding: 20px 24px;
        border-left: 5px solid #2563eb;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    
    .legal-header-left {
        flex: 1;
    }
    
    .legal-title {
        font-size: 24px;
        font-weight: 800;
        color: #111827;
        letter-spacing: -0.3px;
    }
    
    .legal-sub {
        margin-top: 6px;
        font-size: 14px;
        color: #64748b;
        font-weight: 500;
    }
    
    .legal-header-right {
        display: flex;
        gap: 14px;
        align-items: center;
    }
    
    .legal-status-box {
        min-width: 170px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #f8fafc;
    }
    
    .legal-mini-label {
        margin-bottom: 7px;
        font-size: 11px;
        font-weight: 800;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }
    
    .legal-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        background: #eef2ff;
        color: #1e40af;
    }
    
    .legal-badge-success {
        background: #ecfdf5;
        color: #047857;
    }
    
    .legal-badge-warning {
        background: #fffbeb;
        color: #92400e;
    }
    
    .legal-badge-danger {
        background: #fef2f2;
        color: #991b1b;
    }
    
    @media (max-width: 900px) {
        .legal-header-card {
            flex-direction: column;
            align-items: flex-start;
        }
    
        .legal-header-right {
            width: 100%;
            flex-direction: column;
            align-items: stretch;
        }
    
        .legal-status-box {
            width: 100%;
        }
    }

