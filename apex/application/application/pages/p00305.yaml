processes: 
- # ====== Process: Fetch Bike Details =========================
  id: 18170819511376136
  identification: 
    name: Fetch Bike Details
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      select PLATE_NO, bike_status_name
        into :P305_PLATE_NO, :P305_CURRENT_STATUS
        from vw_fleet_bike_current
       where bike_id = :P305_BIKE_ID;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Change Status ==============================
  id: 18171296207376136
  identification: 
    name: Change Status
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          fleet_pkg.change_bike_status(
              p_bike_id      => :P305_BIKE_ID,
              p_new_status   => :P305_NEW_STATUS,
              p_effective_ts => :P305_EFFECTIVE_TS,
              p_reason_code  => :P305_REASON_CODE,
              p_remarks      => :P305_REMARKS
          );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

