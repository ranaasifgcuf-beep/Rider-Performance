validations: 
- # ====== Validation: New = Confirm ===========================
  id: 9738876230536805
  identification: 
    name: New = Confirm

  execution: 
    sequence: 10

  validation: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: ':P901_NEW_PASSWORD = :P901_CONFIRM_PASSWORD'
    always-execute: false

  error: 
    error-message: New password and confirm password do not match.
    display-location: Inline with Field and in Notification

- # ====== Validation: Password policy =========================
  id: 9738984793536806
  identification: 
    name: Password policy

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      return length(:P901_NEW_PASSWORD) >= 8
         and regexp_like(:P901_NEW_PASSWORD, '[A-Z]')
         and regexp_like(:P901_NEW_PASSWORD, '[a-z]')
         and regexp_like(:P901_NEW_PASSWORD, '[0-9]')
         and regexp_like(:P901_NEW_PASSWORD, '[^A-Za-z0-9]');
    always-execute: false

  error: 
    error-message: Password must be 8+ chars with upper, lower, number, and special character.
    display-location: Inline with Field and in Notification

processes: 
- # ====== Process: Update Password ============================
  id: 9739061339536807
  identification: 
    name: Update Password
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
        sec_user_ops_pkg.change_my_password(:P901_OLD_PASSWORD, :P901_NEW_PASSWORD);
      end;

  execution: 
    sequence: 10
    point: After Submit
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

