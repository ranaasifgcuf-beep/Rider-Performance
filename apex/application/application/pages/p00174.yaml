- # ====== Region: Loan Ledger / Statement =====================
  id: 37247089213914250
  identification: 
    name: Loan Ledger / Statement
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with base as (
          select l.loan_id,
                 l.issue_dt txn_date,
                 0 sort_seq,
                 0 loan_txn_id,
                 'LOAN_ISSUE' txn_type,
                 'Loan Issued' description,
                 l.loan_amount effect_amount,
                 null reference_no,
                 null remarks
            from hr_emp_loans l
           where l.loan_id = :P174_LOAN_ID
      
          union all
      
          select t.loan_id,
                 t.txn_date,
                 1 sort_seq,
                 t.loan_txn_id,
                 t.txn_type,
                 case t.txn_type
                     when 'MANUAL_PAYMENT' then 'Payment Received'
                     when 'PAYROLL_DEDUCTION' then 'Payroll Deduction'
                     when 'WAIVER' then 'Waiver'
                     when 'ADJUSTMENT' then 'Adjustment'
                     when 'REVERSAL' then 'Reversal'
                     when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                     else t.txn_type
                 end description,
      
                 case
                     when t.txn_type in ('MANUAL_PAYMENT','PAYROLL_DEDUCTION','WAIVER','BAD_DEBT_WRITE_OFF') then
                          -abs(nvl(t.amount,0))
      
                     when t.txn_type = 'ADJUSTMENT' then
                          nvl(t.amount,0)
      
                     when t.txn_type = 'REVERSAL' then
                          case
                              when ot.txn_type in ('MANUAL_PAYMENT','PAYROLL_DEDUCTION','WAIVER','BAD_DEBT_WRITE_OFF') then
                                  abs(nvl(ot.amount, t.amount))
                              when ot.txn_type = 'ADJUSTMENT' then
                                  -nvl(ot.amount, t.amount)
                              else
                                  nvl(t.amount,0)
                          end
                 end effect_amount,
      
                 t.reference_no,
                 t.remarks
            from hr_emp_loan_txns t
            left join hr_emp_loan_txns ot
              on ot.loan_txn_id = t.reversal_of_txn_id
           where t.loan_id = :P174_LOAN_ID
             and t.approval_status = 'APPROVED'
      )
      select to_char(txn_date, 'DD-MON-YYYY') txn_date,
             case txn_type
                 when 'LOAN_ISSUE' then 'Loan Issue'
                 when 'MANUAL_PAYMENT' then 'Payment'
                 when 'PAYROLL_DEDUCTION' then 'Payroll Deduction'
                 when 'WAIVER' then 'Waiver'
                 when 'ADJUSTMENT' then 'Adjustment'
                 when 'REVERSAL' then 'Reversal'
                 when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                 else txn_type
             end txn_type,
             description,
             reference_no,
      
             case
                 when effect_amount > 0 then
                     'AED ' || trim(to_char(effect_amount, '999G999G999G990D00'))
             end debit,
      
             case
                 when effect_amount < 0 then
                     'AED ' || trim(to_char(abs(effect_amount), '999G999G999G990D00'))
             end credit,
      
             'AED ' ||
             trim(to_char(
                 sum(effect_amount) over (
                     order by txn_date, sort_seq, loan_txn_id
                     rows between unbounded preceding and current row
                 ),
                 '999G999G999G990D00'
             )) running_balance,
      
             remarks
      from base
      order by txn_date, sort_seq, loan_txn_id;

  order-by: 
    type: None

  layout: 
    sequence: 40
