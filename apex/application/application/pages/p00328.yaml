- # ====== Validation: Employee Required =======================
  id: 41408436210853034
  identification: 
    name: Employee Required

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P328_EMP_ID is null then
              return 'Employee is required.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

- # ====== Validation: Current SIM required for replacement/retu
  id: 41408560821853035
  identification: 
    name: Current SIM required for replacement/return

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P328_REQUEST_TYPE in (
              'REPLACEMENT_LOST',
              'REPLACEMENT_DAMAGED',
              'REPLACEMENT_BLOCKED',
              'REPLACEMENT_PROJECT_CHANGE',
              'TEMPORARY_REPLACEMENT',
              'RETURN_REQUEST'
          )
          and :P328_CURRENT_SIM_ID is null then
              return 'Current SIM is required for replacement or return request.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

- # ====== Validation: Remarks required for Other ==============
  id: 41408615920853036
  identification: 
