- # ====== Process: SIM In Progress ============================
  id: 41409816009853048
  identification: 
    name: SIM In Progress
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          hr_sim_req_pkg.mark_in_progress(
              p_request_id => :P329_SELECTED_REQUEST_ID,
              p_remarks    => 'Marked In Progress from SIM request worklist'
          );
      
          apex_application.g_print_success_message :=
              'SIM request marked In Progress successfully.';
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Request = Value
    value: SIM_IN_PROGRESS

