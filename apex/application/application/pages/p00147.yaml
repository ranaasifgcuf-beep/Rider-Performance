- # ====== Region: Approval Monitor ============================
  id: 34631565088286471
  identification: 
    name: Approval Monitor
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select r.approval_id,
             r.workflow_id,
             r.module_code,
             r.record_pk,
             r.approval_subject,
             r.approval_amount,
             r.request_status,
             r.requested_by,
             r.requested_dt,
             s.step_seq,
             s.step_name,
             s.approver_users,
             s.step_status,
             s.action_by,
             s.action_dt,
             s.comments
      from hr_approval_requests r
      left join hr_approval_request_steps s
        on s.approval_id = r.approval_id
      order by r.approval_id desc, s.step_seq

