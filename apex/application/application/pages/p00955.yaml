validations:
- # ====== Validation: Expiry After Issue =======================
  id: 92000000000023
  identification:
    name: Expiry After Issue

  execution:
    sequence: 10

  validation:
    type: Expression
    language: PL/SQL
    pl/sql-expression: |
      :P955_EXPIRY_DT is null
      or :P955_ISSUE_DT is null
      or :P955_EXPIRY_DT > :P955_ISSUE_DT
    always-execute: false

  error:
    error-message: Expiry Date cannot be earlier than Issue Date.
    display-location: Inline with Field and in Notification

- # ====== Validation: Date Overlapping ========================
  id: 92000000000024
  identification:
    name: Date Overlapping

  execution:
    sequence: 20

  validation:
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      declare
          l_cnt number;
      begin
          select count(*)
            into l_cnt
            from hr_org_docs d
           where d.org_id       = :P955_ORG_ID
             and d.doc_type_code = :P955_DOC_TYPE_CODE
             and nvl(d.org_doc_id, -1) <> nvl(:P955_ORG_DOC_ID, -1)
             and nvl(:P955_ISSUE_DT, date '1900-01-01') <= nvl(d.expiry_dt, date '4712-12-31')
             and nvl(:P955_EXPIRY_DT, date '4712-12-31') >= nvl(d.issue_dt, date '1900-01-01');

          return l_cnt = 0;
      end;
    always-execute: false

  error:
    error-message: Overlapping document period exists for the same organization and document type
    display-location: Inline with Field and in Notification

