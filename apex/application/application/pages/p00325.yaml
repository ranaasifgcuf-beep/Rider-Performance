- # ====== Region: Open Requests ===============================
  id: 40912771207243621
  identification: 
    name: Open Requests
    title: Open Requests
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select br.request_id,
             br.emp_id,
             e.emp_code,
             e.full_employee_name,
             e.current_status_name,
             e.job_name,
             HP.PROJECT_NAME AS REQUESTED_PROJECT,
             RC.CITY_NAME AS REQUESTED_CITY,
      
             br.request_type,
             br.request_status,
             br.priority,
             br.reason_code,
             br.request_remarks,
             br.requested_by,
             to_char(br.requested_dt, 'DD-MON-YYYY HH24:MI') requested_dt,
             to_char(br.required_by_dt, 'DD-MON-YYYY') required_by_dt,
      
             cb.bike_display as current_bike,
      
             '<a href="' ||
             apex_util.prepare_url(
                 'f?p=' || :APP_ID || ':303:' || :APP_SESSION ||
                 '::NO::P303_EMP_ID,P303_REQUEST_ID,P303_CITY_ID:' ||
                 br.emp_id || ',' || br.request_id||','||BR.REQUESTED_CITY_ID
             ) ||
             '" title="Assign Bike">' ||
             '<span class="fa fa-motorcycle" aria-hidden="true"></span> Assign Bike' ||
             '</a>' as assign_bike_link,
             '<a href="' ||
      apex_util.prepare_url(
          'f?p=' || :APP_ID || ':326:' || :APP_SESSION ||
          '::NO::P326_REQUEST_ID:' || br.request_id
      ) ||
      '" title="Reject Bike Request">' ||
      '<span class="fa fa-times-circle text-danger" aria-hidden="true"></span> Reject' ||
      '</a>' as reject_request_link
      
      from hr_bike_requests br
      JOIN HR_PROJECTS HP
      ON HP.PROJECT_ID = BR.REQUESTED_PROJECT_ID
      JOIN REF_CITIES RC 
      ON RC.CITY_ID = BR.REQUESTED_CITY_ID
      
      join vw_hr_employee_list e
        on e.emp_id = br.emp_id
      
      left join vw_hr_emp_current_bike cb
             on cb.emp_id = br.emp_id
       
      
      where br.request_status in ('OPEN','IN_PROGRESS')
      
      order by case br.priority
                   when 'URGENT' then 1
                   when 'HIGH' then 2
                   when 'NORMAL' then 3
                   else 4
               end,
               br.requested_dt;

