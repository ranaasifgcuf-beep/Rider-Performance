- # ====== Region: Loan Statement Header =======================
  id: 37246420473914244
  identification: 
    name: Loan Statement Header
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_html clob;
      
          function esc(p_text varchar2) return varchar2 is
          begin
              return apex_escape.html(nvl(p_text, '-'));
          end;
      
          function money(p_amount number) return varchar2 is
          begin
              return 'AED ' || trim(to_char(nvl(p_amount,0), '999G999G999G990D00'));
          end;
      begin
          for r in (
              select loan_no,
                     emp_code,
                     employee_name,
                    -- loan_type,
                     --source_type,
                     loan_amount,
                     emi_amount,
                     paid_amount,
                     waived_amount,
                     adjustment_amount,
                     reversed_amount,
                     bad_debt_amount,
                     balance_amount,
                     approval_status,
                     status,
                     issue_dt,
                     start_month
                    -- remarks
                from hr_emp_loan_v
               where loan_id = :P174_LOAN_ID
          )
          loop
              l_html :=
              '<div class="stmt-wrap">' ||
      
              '<div class="stmt-header">' ||
              '  <div>' ||
              '    <div class="stmt-title">Loan Statement</div>' ||
              '    <div class="stmt-sub">' || esc(r.loan_no) || ' | ' ||
                   esc(r.emp_code || ' - ' || r.employee_name) || '</div>' ||
              '  </div>' ||
              '  <div class="stmt-balance">' ||
              '    <div class="stmt-balance-label">Outstanding Balance</div>' ||
              '    <div class="stmt-balance-value">' || money(r.balance_amount) || '</div>' ||
              '  </div>' ||
              '</div>' ||
      
              '<div class="stmt-grid">' ||
      
            --  '<div class="stmt-cell"><span>Loan Type</span><b>' || esc(r.loan_type) || '</b></div>' ||
           --   '<div class="stmt-cell"><span>Source</span><b>' || esc(r.source_type) || '</b></div>' ||
              '<div class="stmt-cell"><span>Issue Date</span><b>' || esc(to_char(r.issue_dt,'DD-MON-YYYY')) || '</b></div>' ||
              '<div class="stmt-cell"><span>Recovery Start</span><b>' || esc(to_char(r.start_month,'MON-YYYY')) || '</b></div>' ||
      
              '<div class="stmt-cell amount"><span>Loan Amount</span><b>' || money(r.loan_amount) || '</b></div>' ||
              '<div class="stmt-cell amount"><span>EMI Amount</span><b>' || money(r.emi_amount) || '</b></div>' ||
              '<div class="stmt-cell amount"><span>Paid</span><b>' || money(r.paid_amount) || '</b></div>' ||
              '<div class="stmt-cell amount"><span>Waived</span><b>' || money(r.waived_amount) || '</b></div>' ||
              '<div class="stmt-cell amount"><span>Adjustment</span><b>' || money(r.adjustment_amount) || '</b></div>' ||
              '<div class="stmt-cell amount"><span>Bad Debt</span><b>' || money(r.bad_debt_amount) || '</b></div>' ||
              '<div class="stmt-cell"><span>Approval Status</span><b>' || esc(r.approval_status) || '</b></div>' ||
              '<div class="stmt-cell"><span>Loan Status</span><b>' || esc(r.status) || '</b></div>' ||
      
              '</div>';
      
              /*if r.remarks is not null then
                  l_html := l_html ||
                  '<div class="stmt-remarks">' ||
                  '<span>Remarks</span>' ||
                  '<div>' || esc(r.remarks) || '</div>' ||
                  '</div>';
              end if;*/
      
              l_html := l_html || '</div>';
          end loop;
      
          htp.p(nvl(l_html, '<div class="stmt-wrap">Loan not found.</div>'));
      end;

  layout: 
