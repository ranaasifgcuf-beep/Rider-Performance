- # ====== Region: Accident List ===============================
  id: 30709525980380126
  identification: 
    name: Accident List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          a.accident_id,
      
          case
            when a.status_code = 'OPEN'
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 315,
                  p_items  => 'P315_ACCIDENT_ID',
                  p_values => a.accident_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-wrench" title="Start Repair"></span></a>'
              else '<span class="fa fa-wrench" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
          end as start_repair_link,
      
          case
            when a.status_code in ('OPEN','UNDER_REPAIR')
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 316,
                  p_items  => 'P316_ACCIDENT_ID',
                  p_values => a.accident_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-check" title="Close Accident"></span></a>'
              else
              '<span class="fa fa-check" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
          end as close_accident_link,
      
          case
            when a.emp_charge_id is not null
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 320,
                  p_items  => 'P320_EMP_CHARGE_ID,P320_MODE',
                  p_values => a.emp_charge_id|| ',READ'
                   ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-money" title="View Charge"></span></a>'
              else
              '<span class="fa fa-money" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
          end as charge_link,
      
          a.bike_id,
          b.bike_code,
          b.plate_no,
      
          a.emp_id,
          a.accident_dt,
          a.repair_start_dt,
          a.repair_end_dt,
      
          a.accident_location,
          a.police_report_no,
      
          case a.fault_type
            when 'EMPLOYEE' then '<span class="t-Badge t-Badge--danger">EMPLOYEE</span>'
            when 'COMPANY' then '<span class="t-Badge t-Badge--info">COMPANY</span>'
            when 'THIRD_PARTY' then '<span class="t-Badge t-Badge--warning">THIRD PARTY</span>'
            else '<span class="t-Badge t-Badge--default">N/A</span>'
          end as fault_badge,
      
          case a.accident_severity
            when 'MINOR' then '<span class="t-Badge t-Badge--info">MINOR</span>'
            when 'MAJOR' then '<span class="t-Badge t-Badge--warning">MAJOR</span>'
            when 'TOTAL_LOSS' then '<span class="t-Badge t-Badge--danger">TOTAL LOSS</span>'
            else '<span class="t-Badge t-Badge--default">N/A</span>'
          end as severity_badge,
      
          a.estimated_cost,
          a.actual_cost,
      
          case
            when a.emp_charge_id is null then
              '<span class="t-Badge t-Badge--default">NO CHARGE</span>'
            when hr_charges_pkg.get_charge_balance(a.emp_charge_id) = 0 then
              '<span class="t-Badge t-Badge--success">RECOVERED/CLOSED</span>'
            else
              '<span class="t-Badge t-Badge--warning">RECOVERY PENDING</span>'
          end as recovery_badge,
      
          case a.status_code
            when 'OPEN' then '<span class="t-Badge t-Badge--danger">OPEN</span>'
            when 'UNDER_REPAIR' then '<span class="t-Badge t-Badge--warning">UNDER REPAIR</span>'
            when 'CLOSED' then '<span class="t-Badge t-Badge--success">CLOSED</span>'
          end as status_badge,
      
          case
            when a.repair_end_dt is not null then a.repair_end_dt - a.accident_dt
            else trunc(sysdate) - a.accident_dt
          end as accident_days,
      
          case
            when a.repair_start_dt is not null and a.repair_end_dt is not null
            then a.repair_end_dt - a.repair_start_dt
            when a.repair_start_dt is not null
            then trunc(sysdate) - a.repair_start_dt
          end as repair_days,
      
          a.emp_charge_id,
          a.remarks,
          a.created_by,
          a.created_dt
      
      from fleet_bike_accidents a
      join fleet_bikes b
        on b.bike_id = a.bike_id
      order by a.accident_dt desc, a.accident_id desc

