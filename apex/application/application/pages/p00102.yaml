- # ====== Validation: Duplicate Person Detail Verification ====
  id: 39252606038729122
  identification: 
    name: Duplicate Person Detail Verification

  execution: 
    sequence: 350

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P102_FIRST_NAME is null
             or :P102_DOB is null then
              return null;
          end if;
      
          for r in (
              select emp_code,
                     trim(first_name || ' ' || last_name) employee_name
              from hr_employees
              where emp_id <> nvl(:P102_EMP_ID, -1)
      
                and upper(trim(first_name)) =
                    upper(trim(:P102_FIRST_NAME))
      
                and nvl(upper(trim(last_name)), '#') =
                    nvl(upper(trim(:P102_LAST_NAME)), '#')
      
                and nvl(upper(trim(father_name)), '#') =
                    nvl(upper(trim(:P102_FATHER_NAME)), '#')
      
                and dob = :P102_DOB
      
              fetch first 1 row only
          )
          loop
              return 'Possible duplicate employee found: '
                     || r.emp_code || ' - ' || r.employee_name
                     || '. The same name, father name, date of birth '
                     || 'and nationality already exist.';
          end loop;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

