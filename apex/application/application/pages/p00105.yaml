- # ====== Region: Employees Documents of Record ===============
  id: 16005963097176511
  identification: 
    name: Employees Documents of Record
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select doc_id,
             emp_id,
      
             doc_type,
             doc_type_name as document,
      
             doc_no as document_number,
      
             case is_current_record
                 when 'Y' then '<span class="t-Badge t-Badge--success">Yes</span>'
                 else '<span class="t-Badge">No</span>'
             end as is_current_record,
      
             issue_dt,
             expiry_dt,
      
             remarks,
             expiry_in_days,
      
             case expiry_status
                 when 'NO_EXPIRY' then
                     '<span class="t-Badge">No Expiry</span>'
                 when 'EXPIRED' then
                     '<span class="t-Badge t-Badge--danger">Expired</span>'
                 when 'EXPIRING_SOON' then
                     '<span class="t-Badge t-Badge--warning">Near Expiry</span>'
                 when 'VALID' then
                     '<span class="t-Badge t-Badge--success">Active</span>'
                 else
                     '<span class="t-Badge">' || apex_escape.html(expiry_status) || '</span>'
             end as expiry_status,
      
             case
                 when file_name is not null then
                     '<span class="fa fa-paperclip" title="' ||
                     apex_escape.html_attribute(file_name) ||
                     '"></span> ' ||
                     apex_escape.html(file_name)
                 when file_ref is not null then
                     '<span class="fa fa-link" title="External File Reference"></span>'
                 else
                     null
             end as file_info,
      
             file_ref,
             file_name,
             mime_type,
             file_size,
      
             created_by,
             created_dt,
             updated_by,
             updated_dt,
             case
          when file_name is not null then
              '<a href="' ||
              apex_page.get_url(
                  p_page    => 105,
                  p_request => 'APPLICATION_PROCESS=DOWNLOAD_EMP_DOC',
                  p_items   => 'P105_DOWNLOAD_DOC_ID',
                  p_values  => doc_id
              ) ||
              '" title="Download Document">' ||
              '<span class="fa fa-download"></span></a>'
          when file_ref is not null then
              '<a href="' || apex_escape.html_attribute(file_ref) || '" target="_blank" title="Open File Reference">' ||
              '<span class="fa fa-external-link"></span></a>'
          else
              null
      end as download_link
      
      from hr_emp_docs_v
      where emp_id = :P105_EMP_ID
      order by 
             case is_current_record when 'Y' then 1 else 2 end,
             case expiry_status
                 when 'EXPIRED' then 1
                 when 'EXPIRING_SOON' then 2
                 when 'VALID' then 3
                 else 4
             end,
             doc_id desc;

