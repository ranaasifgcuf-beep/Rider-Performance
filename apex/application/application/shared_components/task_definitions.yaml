  actions: 
  - # ====== Action: Email Current Approver ======================
    id: 35594814268352656
    identification: 
      name: Email Current Approver
      type: Execute Code

    source: 
      location: Local Database
      language: PL/SQL
      pl/sql-code: |
        declare
            l_step_id  number := to_number(:APEX$TASK_PK);
            l_task_id  number;
            l_html     clob;
            l_body     clob;
            l_subject  varchar2(500);
            l_mail_id  number;
        begin
            select max(task_id)
              into l_task_id
              from apex_tasks
             where detail_pk = to_char(l_step_id);
        
            l_html := hr_approval_ui_pkg.render_approval_email(
                          p_approval_step_id => l_step_id,
                          p_task_id          => l_task_id
                      );
        
            l_body := to_clob('Approval required. Please open HRMS to review and take action.');
        
            for r in (
                select ar.approval_subject,
                       u.email
                  from hr_approval_request_steps s
                  join hr_approval_requests ar
                    on ar.approval_id = s.approval_id
                  join sec_users u
                    on instr(',' || upper(s.approver_users) || ',',
                             ',' || upper(u.username) || ',') > 0
                 where s.approval_step_id = l_step_id
                   and u.email is not null
            )
            loop
                l_subject := 'Approval Required: ' || r.approval_subject;
        
                l_mail_id := apex_mail.send(
                    p_to        => r.email,
                    p_from      => 'no-reply@najahalsareea.com',
                    p_subj      => l_subject,
                    p_body      => l_body,
                    p_body_html => l_html
                );
            end loop;
        
            apex_mail.push_queue;
        end;

    error-handling: 
      log-message-type: None

    execution: 
      on-event: Create
      sequence: 10

    error: 
      stop-execution-on-error: true

