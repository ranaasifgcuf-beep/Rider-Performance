- # ====== Page Item: P912_ROLE_IDS ============================
  id: 9840330787147139
  identification: 
    name: P912_ROLE_IDS
    type: Shuttle

  label: 
    label: Role Assignmnet
    alignment: Left

  settings: 
    show-controls: All

  multiple-values: 
    type: Delimited List
    separator: ':'

  layout: 
    sequence: 10
    region: Roles # 9840042472147136
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 15

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      select role_name d, role_id r
      from sec_roles
      where is_active='Y'
      order by role_name
      
    display-extra-values: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      declare l_list varchar2(32767);
      begin
        select listagg(role_id, ':') within group (order by role_id)
          into l_list
          from sec_user_roles
         where user_id = :P912_USER_ID;
      
        return nvl(l_list,'');
      end;
    used: Always, replacing any existing value in session state

  session-state: 
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

