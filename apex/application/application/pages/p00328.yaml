processes: 
- # ====== Process: Default Project / City =====================
  id: 41408116752853031
  identification: 
    name: Default Project / City
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          if :P328_EMP_ID is not null then
      
              if :P328_REQUESTED_PROJECT_ID is null
                 or :P328_REQUESTED_CITY_ID is null then
      
                  begin
                      select project_id,
                             city_id
                        into :P328_REQUESTED_PROJECT_ID,
                             :P328_REQUESTED_CITY_ID
                        from (
                              select project_id,
                                     city_id
                                from hr_emp_status_hist
                               where emp_id = :P328_EMP_ID
                                 and effective_to is null
                               order by effective_from desc, status_id desc
                             )
                       where rownum = 1;
                  exception
                      when no_data_found then
                          null;
                  end;
      
              end if;
      
          end if;
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Create SIM Request =========================
  id: 41409134339853041
  identification: 
    name: Create SIM Request
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_request_id number;
      begin
          l_request_id := hr_sim_req_pkg.create_request(
              p_emp_id               => :P328_EMP_ID,
              p_request_type         => :P328_REQUEST_TYPE,
              p_priority             => :P328_PRIORITY,
              p_required_by_dt       => :P328_REQUIRED_BY_DT,
              p_requested_project_id => :P328_REQUESTED_PROJECT_ID,
              p_requested_city_id    => :P328_REQUESTED_CITY_ID,
              p_current_sim_id       => :P328_CURRENT_SIM_ID,
              p_reason_code          => :P328_REASON_CODE,
              p_remarks              => :P328_REQUEST_REMARKS
          );
      
          apex_application.g_print_success_message :=
              'SIM request created successfully. Request ID: ' || l_request_id;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: PB_CREATE_REQUEST # 41408704519853037

