- # ====== Region: Accident Queue ==============================
  id: 17470838830113836
  identification: 
    name: Accident Queue
    title: Accident Queue <span class="t-Badge t-Badge--warning t-Badge--large">&P108_ACCIDENT_CNT.</span>
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select e.emp_id,
             e.emp_code,
             e.first_name || ' ' || e.last_name as full_name,
             e.agreed_project,
             e.agreed_city,
      
             e.current_status_code as current_status,
             e.current_status_name,
             e.status_badge_text,
      
             e.current_legal_code,
             e.current_legal_name,
      
             case
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') = 'VALID' then
                     '<span class="t-Badge t-Badge--success">Valid</span>'
      
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                     'IN_PROCESS',
                     'ON_HOLD',
                     'UNKNOWN'
                 ) then
                     '<span class="t-Badge t-Badge--warning">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Not Set')) ||
                     '</span>'
      
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                     'ABSCONDING',
                     'ABSCONDER',
                     'EXPIRED',
                     'EMPLOYEE_COMPLAINT',
                     'CANCELLED_MOHRE',
                     'CANCELLED_ICP',
                     'CANCELLED'
                 ) then
                     '<span class="t-Badge t-Badge--danger">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Risk')) ||
                     '</span>'
      
                 else
                     '<span class="t-Badge t-Badge--warning">Not Set</span>'
             end as legal_status_badge,
      
             e.worker_type,
             e.supplier_name,
             e.last_project,
             e.last_city,
      
             null as assign_link,
      
             '<span class="fa fa-check-circle text-success" aria-hidden="true"></span>' as ready_link,
             '<span class="fa fa-plane text-info" aria-hidden="true"></span>' as vacation_link,
      
             e.job_name,
      
             case
                 when exists (
                      select 1
                        from hr_emp_docs d
                       where d.emp_id = e.emp_id
                         and upper(d.doc_type) = 'PASSPORT'
                         and nvl(d.is_current_record,'Y') = 'Y'
                         and d.doc_no is not null
                 )
                 then '<span class="fa fa-check-circle u-success-text" title="Passport Available"></span>'
                 else '<span class="fa fa-times-circle u-danger-text" title="Passport Missing"></span>'
             end as passport_doc,
      
             case
                 when exists (
                      select 1
                        from hr_emp_docs d
                       where d.emp_id = e.emp_id
                         and upper(d.doc_type) in ('EID','EMIRATES_ID')
                         and nvl(d.is_current_record,'Y') = 'Y'
                         and d.doc_no is not null
                 )
                 then '<span class="fa fa-check-circle u-success-text" title="EID Available"></span>'
                 else '<span class="fa fa-times-circle u-danger-text" title="EID Missing"></span>'
             end as eid_doc,
      
             case
                 when exists (
                      select 1
                        from hr_emp_docs d
                       where d.emp_id = e.emp_id
                         and upper(d.doc_type) in ('DL','DRIVING LICENSE','DRIVING_LICENSE')
                         and nvl(d.is_current_record,'Y') = 'Y'
                         and d.doc_no is not null
                 )
                 then '<span class="fa fa-check-circle u-success-text" title="Driving License Available"></span>'
                 else '<span class="fa fa-times-circle u-danger-text" title="Driving License Missing"></span>'
             end as dl_doc,
               ac.current_bike_badge as current_bike,
             ac.asset_risk_badge   as asset_risk
      
      from vw_hr_employee_list e
      join vw_hr_emp_asset_control ac
        on ac.emp_id = e.emp_id
      
      where not exists (
              select 1
                from hr_assignments a
               where a.emp_id = e.emp_id
                 and a.end_dt is null
            )
      
        and upper(nvl(e.current_status_code,'PIPELINE')) = 'ACCIDENT'
      
        and replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') not in (
              'ABSCONDING',
              'ABSCONDER'
            )
      
      order by e.emp_code;

