- # ====== Region: Ready To Onboard ============================
  id: 15332603181284944
  identification: 
    name: Ready To Onboard
    title: Ready To Onboard <span class="t-Badge t-Badge--info t-Badge--large">&P108_READY_CNT.</span>
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select e.emp_id,
             e.emp_code,
             e.full_employee_name as employee_name,
             e.job_name,
             e.worker_type,
             e.supplier_name,
      
             e.last_project,
             e.last_city,
      
             e.status_city_name    as planned_city,
             e.status_project_name as planned_project,
      
             e.current_status_name,
             e.current_legal_name,
      
             ------------------------------------------------------------------
             -- Current Bike Number
             ------------------------------------------------------------------
             ac.current_bike_badge as current_bike,
      
             ------------------------------------------------------------------
             -- Asset Risk
             ------------------------------------------------------------------
             ac.asset_risk_badge as asset_risk,
      
             ------------------------------------------------------------------
             -- Bike Status - existing logic unchanged
             ------------------------------------------------------------------
             case
                 when ac.bike_required_yn = 'N' then
                     '<span class="t-Badge t-Badge--normal">Bike Not Required</span>'
      
                 when ac.current_bike_id is not null then
                     '<span class="t-Badge t-Badge--success">Bike Assigned</span>'
      
                 when ac.open_bike_request_id is not null then
                     '<span class="t-Badge t-Badge--warning">Bike Request Open</span>'
      
                 else
                     '<span class="t-Badge t-Badge--danger">Bike Required</span>'
             end as bike_status,
      
             ------------------------------------------------------------------
             -- SIM No / SIM Display
             ------------------------------------------------------------------
             case
                 when nvl(j.sim_required_yn, 'N') = 'N' then
                     '<span class="t-Badge t-Badge--normal">SIM Not Required</span>'
      
                 when nvl(ss.active_sim_count, 0) > 0 then
                     ss.sim_summary_badge
      
                 when sr.request_id is not null then
                     '<span class="t-Badge t-Badge--warning">SIM Request #' ||
                     sr.request_id || ' Open</span>'
      
                 else
                     '<span class="t-Badge t-Badge--danger">No SIM</span>'
             end as sim_no,
      
             ------------------------------------------------------------------
             -- SIM Status / SIM Request Action
             ------------------------------------------------------------------
             case
                 when nvl(j.sim_required_yn, 'N') = 'N' then
                     '<span class="t-Badge t-Badge--normal">SIM Not Required</span>'
      
                 when nvl(ss.active_sim_count, 0) > 0 then
                     '<span class="t-Badge t-Badge--success">SIM Assigned</span>'
      
                 when sr.request_id is not null then
                     '<span class="t-Badge t-Badge--warning">SIM Request Open</span>'
      
                 else
                     '<a href="' ||
                     apex_util.prepare_url(
                         'f?p=' || :APP_ID || ':328:' || :APP_SESSION ||
                         '::NO::P328_EMP_ID,P328_REQUEST_TYPE,P328_REQUESTED_PROJECT_ID,P328_REQUESTED_CITY_ID,P328_FROM_PAGE:' ||
                         e.emp_id ||
                         ',NEW_ONBOARDING,' ||
                         e.status_project_id ||
                         ',' ||
                         e.status_city_id ||
                         ',108'
                     ) ||
                     '" title="Raise SIM Request">' ||
                     '<span class="fa fa-sim-card" aria-hidden="true"></span> Request SIM' ||
                     '</a>'
             end as sim_status,
      
             ------------------------------------------------------------------
             -- Next Action
             -- Existing bike behavior preserved.
             -- Pending Active now only after Bike + SIM readiness.
             ------------------------------------------------------------------
             case
                 ------------------------------------------------------------------
                 -- Bike ready + SIM ready = Pending Active
                 ------------------------------------------------------------------
                 when ac.can_pending_active_yn = 'Y'
                  and (
                          nvl(j.sim_required_yn, 'N') = 'N'
                          or nvl(ss.active_sim_count, 0) > 0
                      )
                 then
                     '<a href="javascript:void(0);" ' ||
                     'class="js-pending-active" ' ||
                     'data-emp-id="' || e.emp_id || '" ' ||
                     'title="Move to Pending Active">' ||
                     '<span class="fa fa-hourglass-half" aria-hidden="true"></span> Pending Active' ||
                     '</a>'
      
                 ------------------------------------------------------------------
                 -- Existing bike request already open
                 ------------------------------------------------------------------
                 when ac.open_bike_request_id is not null then
                     '<span class="t-Badge t-Badge--warning">Request Already Open</span>'
      
                 ------------------------------------------------------------------
                 -- Existing bike required but no bike/request
                 ------------------------------------------------------------------
                 when ac.bike_required_yn = 'Y'
                  and ac.current_bike_id is null
                  and ac.open_bike_request_id is null then
                     '<a href="' ||
                     apex_util.prepare_url(
                         'f?p=' || :APP_ID || ':324:' || :APP_SESSION ||
                         '::NO::P324_EMP_ID,P324_REQUEST_TYPE,P324_REQUESTED_PROJECT_ID,P324_REQUESTED_CITY_ID:' ||
                         e.emp_id ||
                         ',NEW_ONBOARDING,' ||
                         e.status_project_id ||
                         ',' ||
                         e.status_city_id
                     ) ||
                     '" title="Open Bike Request">' ||
                     '<span class="fa fa-motorcycle" aria-hidden="true"></span> Open Request' ||
                     '</a>'
      
                 ------------------------------------------------------------------
                 -- Bike ready but SIM request already open
                 ------------------------------------------------------------------
                 when nvl(j.sim_required_yn, 'N') = 'Y'
                  and nvl(ss.active_sim_count, 0) = 0
                  and sr.request_id is not null then
                     '<span class="t-Badge t-Badge--warning">Waiting SIM Request</span>'
      
                 ------------------------------------------------------------------
                 -- Bike ready but SIM missing
                 ------------------------------------------------------------------
                 when nvl(j.sim_required_yn, 'N') = 'Y'
                  and nvl(ss.active_sim_count, 0) = 0
                  and sr.request_id is null then
                     '<a href="' ||
                     apex_util.prepare_url(
                         'f?p=' || :APP_ID || ':328:' || :APP_SESSION ||
                         '::NO::P328_EMP_ID,P328_REQUEST_TYPE,P328_REQUESTED_PROJECT_ID,P328_REQUESTED_CITY_ID,P328_FROM_PAGE:' ||
                         e.emp_id ||
                         ',NEW_ONBOARDING,' ||
                         e.status_project_id ||
                         ',' ||
                         e.status_city_id ||
                         ',108'
                     ) ||
                     '" title="Raise SIM Request">' ||
                     '<span class="fa fa-sim-card" aria-hidden="true"></span> Request SIM' ||
                     '</a>'
      
                 else
                     '<span class="t-Badge t-Badge--warning">Review</span>'
             end as next_action,
      
             ------------------------------------------------------------------
             -- Correction: Move back to Pipeline
             ------------------------------------------------------------------
             case
                 when ac.can_back_pipeline_yn = 'Y' then
                     '<a href="javascript:void(0);" ' ||
                     'class="js-back-pipeline" ' ||
                     'data-emp-id="' || e.emp_id || '" ' ||
                     'title="Move Back to Pipeline">' ||
                     '<span class="fa fa-undo" aria-hidden="true"></span>' ||
                     '</a>'
                 else
                     null
             end as back_to_pipeline,
      
             ------------------------------------------------------------------
             -- Existing actions unchanged
             ------------------------------------------------------------------
             '<span class="fa fa-plane text-info" aria-hidden="true"></span>' as mark_vacation,
             '<span class="fa fa-exclamation-triangle" aria-hidden="true"></span>' as mark_accident
      
      from vw_hr_employee_list e
      
      join vw_hr_emp_asset_control ac
        on ac.emp_id = e.emp_id
      
      left join ref_jobs j
        on j.job_id = e.job_id
      
      left join vw_hr_emp_sim_summary ss
        on ss.emp_id = e.emp_id
      
      left join vw_hr_emp_open_sim_req sr
        on sr.emp_id = e.emp_id
      
      where upper(nvl(e.current_status_code, 'PIPELINE')) in (
              'READY_TO_ONBOARD',
              'ONBOARDING'
            )
      /*
        and replace(upper(nvl(e.current_legal_code, 'NOT_SET')), 'LEGAL_', '') not in (
              'ABSCONDING',
              'ABSCONDER'
            )
      */
      
      order by e.emp_code;

