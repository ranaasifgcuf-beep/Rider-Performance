- # ====== Region: Pending Financial Requests ==================
  id: 35718250108737523
  identification: 
    name: Pending Financial Requests
    title: Pending Financial Requests
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select t.loan_txn_id,
             to_char(t.txn_date, 'DD-MON-YYYY') as txn_date,
      
             case t.txn_type
                 when 'MANUAL_PAYMENT' then 'Manual Payment'
                 when 'WAIVER' then 'Waiver'
                 when 'ADJUSTMENT' then 'Adjustment'
                 when 'REVERSAL' then 'Reversal'
                 when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                 else t.txn_type
             end as txn_type,
      
             t.amount,
             t.pay_mode,
             t.reference_no,
      
             case t.approval_status
                 when 'DRAFT' then
                     '<span class="t-Badge">Draft</span>'
                 when 'SUBMITTED' then
                     '<span class="t-Badge t-Badge--warning">Submitted</span>'
                 when 'REJECTED' then
                     '<span class="t-Badge t-Badge--danger">Rejected</span>'
                 when 'CANCELLED' then
                     '<span class="t-Badge">Cancelled</span>'
                 else
                     '<span class="t-Badge">' || apex_escape.html(t.approval_status) || '</span>'
             end as approval_status,
      
             t.remarks,
             t.created_by,
             to_char(t.created_dt, 'DD-MON-YYYY HH24:MI') as created_dt,
      
             '<span class="fa fa-edit" title="Edit"></span>' as edit_link,
             '<a href="' ||
      apex_page.get_url(
          p_page        => 175,
          p_items       => 'P175_LOAN_ID,P175_LOAN_TXN_ID',
          p_values      => t.loan_id || ',' || t.loan_txn_id,
          p_clear_cache => '175'
      ) ||
      '" title="Transaction History">' ||
      '<span class="fa fa-history"></span></a>' history_link
      
      from hr_emp_loan_txns t
      where t.loan_id = :P171_LOAN_ID
        and t.approval_status in ('DRAFT','SUBMITTED','REJECTED','CANCELLED')
      order by t.loan_txn_id desc;
    page-items-to-submit: 
    - P171_LOAN_ID

  layout: 
    sequence: 70
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

