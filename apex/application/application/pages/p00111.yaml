    name: Validate Expiry

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P111_ISSUE_DT
    - P111_EXPIRY_DT

  actions: 
  - # ====== Action: Execute Server-side Code ====================
    id: 16015608438164913
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        if :P111_ISSUE_DT is not null
           and :P111_EXPIRY_DT is not null
           and :P111_EXPIRY_DT <= :P111_ISSUE_DT then
           raise_application_error(-20001, 'Expiry Date must be greater than Issue Date.');
        end if;
      items-to-submit: 
      - P111_ISSUE_DT
      - P111_EXPIRY_DT

    execution: 
      sequence: 10
      event: Validate Expiry # 16015582653164912
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

