- # ====== Region: Summary =====================================
  id: 37591353977478621
  identification: 
    name: Summary
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_expired        number := 0;
          l_expiring_soon  number := 0;
          l_missing        number := 0;
          l_current_docs   number := 0;
          l_total_emp      number := 0;
          l_no_file        number := 0;
          l_days           number := nvl(to_number(:P181_DAYS),30);
          l_html           clob;
      begin
          select count(*)
            into l_expired
            from hr_emp_docs_v
           where is_current_record = 'Y'
             and expiry_status = 'EXPIRED'
             and (:P181_DOC_GROUP is null or doc_group = :P181_DOC_GROUP)
             and (:P181_DOC_TYPE is null or doc_type = :P181_DOC_TYPE);
      
          select count(*)
            into l_expiring_soon
            from hr_emp_docs_v
           where is_current_record = 'Y'
             and expiry_dt is not null
             and trunc(expiry_dt) >= trunc(cast(systimestamp at time zone 'Asia/Dubai' as date))
             and trunc(expiry_dt) <= trunc(cast(systimestamp at time zone 'Asia/Dubai' as date)) + l_days
             and (:P181_DOC_GROUP is null or doc_group = :P181_DOC_GROUP)
             and (:P181_DOC_TYPE is null or doc_type = :P181_DOC_TYPE);
      
          select count(*)
            into l_current_docs
            from hr_emp_docs_v
           where is_current_record = 'Y'
             and (:P181_DOC_GROUP is null or doc_group = :P181_DOC_GROUP)
             and (:P181_DOC_TYPE is null or doc_type = :P181_DOC_TYPE);
      
          select count(*)
            into l_no_file
            from hr_emp_docs_v
           where is_current_record = 'Y'
             and file_name is null
             and file_ref is null
             and (:P181_DOC_GROUP is null or doc_group = :P181_DOC_GROUP)
             and (:P181_DOC_TYPE is null or doc_type = :P181_DOC_TYPE);
      
          select count(*)
            into l_total_emp
            from hr_employees;
      
          select count(*)
            into l_missing
            from (
                  select e.emp_id,
                         t.doc_type_code
                    from hr_employees e
                    join hr_doc_type_master t
                      on nvl(t.is_active,'Y') = 'Y'
                     and nvl(t.is_mandatory,'N') = 'Y'
                   where (:P181_DOC_GROUP is null or t.doc_group = :P181_DOC_GROUP)
                     and (:P181_DOC_TYPE is null or t.doc_type_code = :P181_DOC_TYPE)
                     and not exists (
                          select 1
                            from hr_emp_docs d
                           where d.emp_id = e.emp_id
                             and d.doc_type = t.doc_type_code
                             and d.is_current_record = 'Y'
                     )
                 );
      
          l_html :=
          '<div class="doc-kpi-grid">' ||
      
          '<div class="doc-kpi-card danger">' ||
          '<div class="doc-kpi-label">Expired Documents</div>' ||
          '<div class="doc-kpi-value">' || l_expired || '</div>' ||
          '<div class="doc-kpi-sub">Current records expired</div>' ||
          '</div>' ||
      
          '<div class="doc-kpi-card warning">' ||
          '<div class="doc-kpi-label">Expiring Soon</div>' ||
          '<div class="doc-kpi-value">' || l_expiring_soon || '</div>' ||
          '<div class="doc-kpi-sub">Within ' || l_days || ' days</div>' ||
          '</div>' ||
      
          '<div class="doc-kpi-card danger">' ||
          '<div class="doc-kpi-label">Missing Mandatory</div>' ||
          '<div class="doc-kpi-value">' || l_missing || '</div>' ||
          '<div class="doc-kpi-sub">Required docs missing</div>' ||
          '</div>' ||
      
          '<div class="doc-kpi-card success">' ||
          '<div class="doc-kpi-label">Current Documents</div>' ||
          '<div class="doc-kpi-value">' || l_current_docs || '</div>' ||
          '<div class="doc-kpi-sub">Current active records</div>' ||
          '</div>' ||
      
          '<div class="doc-kpi-card">' ||
          '<div class="doc-kpi-label">Employee Base</div>' ||
          '<div class="doc-kpi-value">' || l_total_emp || '</div>' ||
          '<div class="doc-kpi-sub">Total employees</div>' ||
          '</div>' ||
      
          '<div class="doc-kpi-card warning">' ||
          '<div class="doc-kpi-label">No File</div>' ||
          '<div class="doc-kpi-value">' || l_no_file || '</div>' ||
          '<div class="doc-kpi-sub">Current docs without file</div>' ||
          '</div>' ||
      
          '</div>';
      
          return l_html;
      end;

  layout: 
