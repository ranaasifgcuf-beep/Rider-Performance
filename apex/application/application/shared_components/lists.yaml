- # ====== List: Custom Menu ===================================
  id: 9973498614382754
  identification: 
    name: Custom Menu

  subscription: 
    version-number: 39912187191457

  source: 
    type: SQL Query
    sql-query: |
      with permitted as (
        select m.*,
               case
                 when sec_pkg.has_perm(m.perm_code) = 1 then 1
                 else 0
               end as is_allowed
          from sec_menu m
         where m.is_active = 'Y'
      ),
      menu_scope as (
        -- allowed nodes + all ancestors (so parent shows if any child allowed)
        select distinct menu_id
          from permitted
         start with menu_id in (select menu_id from permitted where is_allowed = 1)
       connect by prior parent_menu_id = menu_id
      ),
      tree_nodes as (
        select p.*
          from permitted p
          join menu_scope s on s.menu_id = p.menu_id
      )
      select
      level,
        t.label as label,
        case
          when t.target_url is not null then t.target_url
          when t.page_id is not null then
            'f?p='||nvl(t.app_id, :APP_ID)||':'||t.page_id||':'||v('APP_SESSION')
          else
            null
        end as target,
        t.parent_menu_id as parent_id,
        t.icon_css as icon,
        t.menu_id as id,
        null as is_current,
        nvl(t.display_order, 9999) as display_sequence
      from tree_nodes t
      start with t.parent_menu_id is null
      connect by prior t.menu_id = t.parent_menu_id
      order siblings by nvl(t.display_order, 9999), upper(t.label);
      

