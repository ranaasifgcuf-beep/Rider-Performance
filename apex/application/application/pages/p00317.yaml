- # ====== Region: Utilization =================================
  id: 30945093179657120
  identification: 
    name: Utilization
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with p as (
          select 
                 cast(:P317_FROM_DT as timestamp) as from_ts,
                 cast(:P317_TO_DT as timestamp) + interval '1' day as to_ts,
                 cast(:P317_TO_DT as date) - cast(:P317_FROM_DT as date) + 1 as total_days
            from dual
      ),
      x as (
          select
              s.bike_id,
              s.bike_status_code,
              greatest(s.from_dt, p.from_ts) as eff_from,
              least(nvl(s.to_dt, p.to_ts), p.to_ts) as eff_to,
              p.total_days
          from fleet_bike_status_txns s
          cross join p
          where s.from_dt < p.to_ts
            and nvl(s.to_dt, p.to_ts) > p.from_ts
      )
      select
          b.bike_code,
          b.plate_no,
      
          round(sum(
              case when x.bike_status_code = 'ASSIGNED'
              then cast(x.eff_to as date) - cast(x.eff_from as date)
              else 0 end
          ),2) assigned_days,
      
          round(sum(
              case when x.bike_status_code = 'AVAILABLE'
              then cast(x.eff_to as date) - cast(x.eff_from as date)
              else 0 end
          ),2) available_days,
      
          round(sum(
              case when x.bike_status_code = 'IMPOUND'
              then cast(x.eff_to as date) - cast(x.eff_from as date)
              else 0 end
          ),2) impound_days,
      
          round(sum(
              case when x.bike_status_code = 'ACCIDENT'
              then cast(x.eff_to as date) - cast(x.eff_from as date)
              else 0 end
          ),2) accident_days,
      
          round(sum(
              case when x.bike_status_code = 'MAINTENANCE'
              then cast(x.eff_to as date) - cast(x.eff_from as date)
              else 0 end
          ),2) repair_days,
      
          round(
              sum(
                  case when x.bike_status_code = 'ASSIGNED'
                  then cast(x.eff_to as date) - cast(x.eff_from as date)
                  else 0 end
              ) / nullif(max(x.total_days),0) * 100,
              2
          ) as utilization_pct,
      
          case
            when round(
              sum(
                  case when x.bike_status_code = 'ASSIGNED'
                  then cast(x.eff_to as date) - cast(x.eff_from as date)
                  else 0 end
              ) / nullif(max(x.total_days),0) * 100,
              2
            ) >= 80 then '<span class="t-Badge t-Badge--success">GOOD</span>'
      
            when round(
              sum(
                  case when x.bike_status_code = 'ASSIGNED'
                  then cast(x.eff_to as date) - cast(x.eff_from as date)
                  else 0 end
              ) / nullif(max(x.total_days),0) * 100,
              2
            ) >= 60 then '<span class="t-Badge t-Badge--warning">AVERAGE</span>'
      
            else '<span class="t-Badge t-Badge--danger">LOW</span>'
          end as utilization_badge
      
      from x
      join fleet_bikes b
        on b.bike_id = x.bike_id
      group by b.bike_code, b.plate_no
      order by utilization_pct desc nulls last;

