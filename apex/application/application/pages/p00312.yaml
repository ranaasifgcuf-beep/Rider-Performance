processes: 
- # ====== Process: FETCH_P312_IMPOUND_DETAILS =================
  id: 30527528117275277
  identification: 
    name: FETCH_P312_IMPOUND_DETAILS
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select 
                 b.bike_id,
                 i.emp_id,
                 i.impound_start_ts,
                 i.expected_release_ts,
                 v.bike_status_name,
                 v.custody_type_name
            into :P312_BIKE_ID,
            :P312_EMP_ID,
                 :P312_IMPOUND_START_TS,
                 :P312_EXPECTED_RELEASE_TS,
                 :P312_CURRENT_STATUS,
                 :P312_CURRENT_CUSTODY
            from fleet_bike_impounds i
            join fleet_bikes b
              on b.bike_id = i.bike_id
            left join vw_fleet_bike_current v
              on v.bike_id = i.bike_id
           where i.impound_id = :P312_IMPOUND_ID;
      exception
          when no_data_found then
              raise_application_error(-20001, 'Impound case not found.');
      end;

  execution: 
