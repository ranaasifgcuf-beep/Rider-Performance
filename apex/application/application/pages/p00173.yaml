    always-execute: false

  error: 
    error-message: Agreed advance cannot be greater than loan amount.
    display-location: Inline with Field and in Notification

processes: 
- # ====== Process: Save Manual Loan ===========================
  id: 35844844763830033
  identification: 
    name: Save Manual Loan
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          if :P173_LOAN_ID is null then
      
              insert into hr_emp_loans (
                  emp_id,
                  loan_type,
                  loan_amount,
                  emi_amount,
                  issue_dt,
                  start_month,
                  source_type,
                  source_id,
                  approval_status,
                  status,
                  remarks,
                  created_by,
                  created_dt,
                  AGREED_ADVANCE_AMOUNT
              )
              values (
                  :P173_EMP_ID,
                  'LONG_TERM_LOAN',
                  :P173_LOAN_AMOUNT,
                  :P173_EMI_AMOUNT,
                  nvl(:P173_ISSUE_DT, trunc(cast(systimestamp at time zone 'Asia/Dubai' as date))),
                  :P173_START_MONTH,
                  'MANUAL',
                  null,
                  'DRAFT',
                  'ACTIVE',
                  :P173_REMARKS,
                  nvl(sys_context('APEX$SESSION','APP_USER'), user),
                  cast(systimestamp at time zone 'Asia/Dubai' as timestamp),
                  :P173_AGREED_ADVANCE_AMOUNT
              )
              returning loan_id into :P173_LOAN_ID;
      
          else
      
              update hr_emp_loans
                 set emp_id      = :P173_EMP_ID,
                     loan_type   = 'LONG_TERM_LOAN',
                     loan_amount = :P173_LOAN_AMOUNT,
                     emi_amount  = :P173_EMI_AMOUNT,
                     issue_dt    = :P173_ISSUE_DT,
                     AGREED_ADVANCE_AMOUNT=:P173_AGREED_ADVANCE_AMOUNT,
                     start_month = :P173_START_MONTH,
                     remarks     = :P173_REMARKS,
                     updated_by  = nvl(sys_context('APEX$SESSION','APP_USER'), user),
                     updated_dt  = cast(systimestamp at time zone 'Asia/Dubai' as timestamp)
               where loan_id = :P173_LOAN_ID
                 and approval_status in ('DRAFT','REJECTED');
      
              if sql%rowcount = 0 then
                  raise_application_error(
                      -20910,
                      'Only Draft or Rejected loan can be modified.'
                  );
              end if;
      
          end if;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Request is contained in Value
    value: SAVE_DRAFT,SUBMIT_APPROVAL

