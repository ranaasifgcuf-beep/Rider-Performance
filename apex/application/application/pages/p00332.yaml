    warn-on-unsaved-changes: Page Default

  source: 
    type: SQL Query (return single value)
    sql-query: |
      select 'Request #' || sr.request_id ||
             ' | ' || e.emp_code ||
             ' - ' || e.full_employee_name ||
             ' | Type: ' || sr.request_type ||
             ' | Status: ' || sr.request_status
        from hr_sim_requests sr
        join vw_hr_employee_list e
          on e.emp_id = sr.emp_id
       where sr.request_id = :P332_REQUEST_ID
