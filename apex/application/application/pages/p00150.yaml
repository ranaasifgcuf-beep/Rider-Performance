- # ====== Dynamic Action: Terminate ===========================
  id: 34733581832330553
  identification: 
    name: Terminate

  execution: 
    sequence: 30
    event-scope: Dynamic
    static-container-(jquery-selector): body
    type: Immediate

  when: 
    event: Click
    selection-type: jQuery Selector
    jquery-selector: a.terminate

  actions: 
  - # ====== Action: Set Value ===================================
    id: 34733975146330554
    identification: 
      action: Set Value

    settings: 
      set-type: JavaScript Expression
      javascript-expression: this.triggeringElement.dataset.id
      suppress-change-event: false

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P150_WORKFLOW_ID

    execution: 
      sequence: 10
      event: Terminate # 34733581832330553
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Execute Server-side Code ====================
    id: 34734452509330554
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        apex_workflow.terminate (
            p_instance_id => :P150_WORKFLOW_ID );
      items-to-submit: 
      - P150_WORKFLOW_ID

    execution: 
      sequence: 20
      event: Terminate # 34733581832330553
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Execute JavaScript Code =====================
