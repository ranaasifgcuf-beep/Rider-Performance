- # ====== Region: SIM Request Worklist ========================
  id: 42942717692609424
  identification: 
    name: SIM Request Worklist
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select sr.request_id,
             sr.emp_id,
      
             e.emp_code,
             e.full_employee_name as employee_name,
             e.job_name,
             e.worker_type,
             e.supplier_name,
      
             p.project_name as requested_project,
             c.city_name    as requested_city,
      
             sr.request_type,
             sr.request_status,
             sr.priority,
      
             case sr.priority
                 when 'URGENT' then
                     '<span class="t-Badge t-Badge--danger">Urgent</span>'
                 when 'HIGH' then
                     '<span class="t-Badge t-Badge--warning">High</span>'
                 when 'NORMAL' then
                     '<span class="t-Badge t-Badge--success">Normal</span>'
                 else
                     '<span class="t-Badge t-Badge--normal">Low</span>'
             end as priority_badge,
      
             case sr.request_status
                 when 'OPEN' then
                     '<span class="t-Badge t-Badge--warning">Open</span>'
                 when 'IN_PROGRESS' then
                     '<span class="t-Badge t-Badge--normal">In Progress</span>'
                 else
                     '<span class="t-Badge t-Badge--success">' || sr.request_status || '</span>'
             end as status_badge,
      
             to_char(sr.requested_dt, 'DD-MON-YYYY HH24:MI') as requested_dt,
             sr.requested_by,
             to_char(sr.required_by_dt, 'DD-MON-YYYY') as required_by_dt,
      
             case
                 when sr.current_sim_id is not null then
                     cs.mobile_no
                 else
                     null
             end as current_sim_no,
      
             sr.reason_code,
             sr.request_remarks,
      
             ------------------------------------------------------------------
             -- Action: Mark In Progress
             ------------------------------------------------------------------
             case
                 when sr.request_status = 'OPEN' then
                     '<a href="javascript:void(0);" ' ||
                     'class="sim-action-btn js-sim-inprogress" ' ||
                     'data-request-id="' || sr.request_id || '" ' ||
                     'title="Mark In Progress">' ||
                     '<span class="fa fa-play" aria-hidden="true"></span>' ||
                     '</a>'
                 else
                     null
             end as in_progress_action,
      
             ------------------------------------------------------------------
             -- Action: Assign SIM
             ------------------------------------------------------------------
             case
                 when sr.request_status in ('OPEN','IN_PROGRESS')
                  and sr.request_type <> 'RETURN_REQUEST' then
                     '<a href="' ||
                     apex_util.prepare_url(
                         'f?p=' || :APP_ID || ':330:' || :APP_SESSION ||
                         '::NO::P330_REQUEST_ID,P330_EMP_ID,P330_REQUEST_TYPE,P330_RETURN_PAGE:' ||
                         sr.request_id || ',' || sr.emp_id || ',' || sr.request_type || ',329'
                     ) ||
                     '" class="sim-action-btn" title="Assign SIM">' ||
                     '<span class="fa fa-mobile" aria-hidden="true"></span>' ||
                     '</a>'
                 else
                     null
             end as assign_action,
      
             ------------------------------------------------------------------
             -- Action: Return SIM
             ------------------------------------------------------------------
             case
                 when sr.request_status in ('OPEN','IN_PROGRESS')
                  and sr.request_type = 'RETURN_REQUEST' then
                     '<a href="' ||
                     apex_util.prepare_url(
                         'f?p=' || :APP_ID || ':330:' || :APP_SESSION ||
                         '::NO::P330_REQUEST_ID,P330_EMP_ID,P330_REQUEST_TYPE,P330_CURRENT_SIM_ID,P330_RETURN_PAGE:' ||
                         sr.request_id || ',' || sr.emp_id || ',' || sr.request_type || ',' || sr.current_sim_id || ',329'
                     ) ||
                     '" class="sim-action-btn" title="Return SIM">' ||
                     '<span class="fa fa-undo" aria-hidden="true"></span>' ||
                     '</a>'
                 else
                     null
             end as return_action,
      
             ------------------------------------------------------------------
             -- Action: Reject
             ------------------------------------------------------------------
             case
                 when sr.request_status in ('OPEN','IN_PROGRESS') then
                     '<a href="' ||
                     apex_util.prepare_url(
                         'f?p=' || :APP_ID || ':332:' || :APP_SESSION ||
                         '::NO::P332_REQUEST_ID:' || sr.request_id
                     ) ||
                     '" class="sim-action-btn sim-action-danger" title="Reject Request">' ||
                     '<span class="fa fa-times" aria-hidden="true"></span>' ||
                     '</a>'
                 else
                     null
             end as reject_action
      
      from hr_sim_requests sr
      
      join vw_hr_employee_list e
        on e.emp_id = sr.emp_id
      
      left join hr_projects p
        on p.project_id = sr.requested_project_id
      
      left join ref_cities c
        on c.city_id = sr.requested_city_id
      
      left join fleet_sims cs
        on cs.sim_id = sr.current_sim_id
      
      where sr.request_status in ('OPEN','IN_PROGRESS')
      
      order by case sr.priority
                   when 'URGENT' then 1
                   when 'HIGH' then 2
                   when 'NORMAL' then 3
                   else 4
               end,
               sr.requested_dt;

