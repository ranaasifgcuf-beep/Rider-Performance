  - '#DEFAULT#'

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

css: 
  inline: |
    /* Employee report */
    #employee_report .a-IRR-table {
        border-collapse: separate;
        border-spacing: 0;
    }
    
    #employee_report .a-IRR-table th {
        background: #f7f8fa;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        vertical-align: middle;
        height: 42px;
    }
    
    #employee_report .a-IRR-table td {
        font-size: 12px;
        white-space: nowrap;
        vertical-align: middle;
        height: 42px;
    }
    
    #employee_report .a-IRR-table tbody tr:hover td {
        background: #f7faff;
    }
    
    #employee_report .emp-name {
        font-weight: 600;
    }
    
    #employee_report .emp-code-link {
        font-weight: 600;
        text-decoration: none;
    }
    
    #employee_report .emp-code-link:hover {
        text-decoration: underline;
    }
    
    #employee_report .t-Badge {
        min-width: 62px;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
    }
    
    // filter ::cue-region
    
    #employee_filters .t-Region-title {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
    }
    
    #employee_filters .t-Region-header {
        padding: 10px 16px;
    }
    
    #employee_filters .t-Region-body {
        padding: 14px 16px 16px;
    }
    
    #employee_filters .filter-btn {
        min-height: 40px;
        margin-top: 22px;
        border-radius: 5px;
        white-space: nowrap;
    }
    
    /* =====================================================
       FREEZE EMPLOYEE CODE - FIRST COLUMN
       ===================================================== */
    #employee_report .a-IRR-table th:nth-child(1),
    #employee_report .a-IRR-table td:nth-child(1) {
        position: sticky;
        left: 0;
        min-width: 85px;
        width: 85px;
        max-width: 85px;
        background: #ffffff;
        z-index: 3;
    }
    

