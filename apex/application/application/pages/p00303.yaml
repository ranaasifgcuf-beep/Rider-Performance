processes: 
- # ====== Process: Assign Bike ================================
  id: 18036670439024912
  identification: 
    name: Assign Bike
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          fleet_pkg.assign_bike(
              p_bike_id            => :P303_BIKE_ID,
              p_emp_id             => :P303_EMP_ID,
              p_assign_ts          => :P303_ASSIGN_TS,
              p_issue_condition    => :P303_ISSUE_CONDITION,
              p_remarks            => :P303_REMARKS,
              p_location_id        => :P303_LOCATION_ID,
              p_request_id => :P303_REQUEST_ID
          );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

- # ====== Process: Close Request ==============================
  id: 40338610419681350
  identification: 
    name: Close Request
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_assignment_id number;
      begin
          begin
              select BIKE_ASSIGN_ID
                into l_assignment_id
                from (
                      select BIKE_ASSIGN_ID
                        from FLEET_bike_assignments
                       where emp_id = :P303_EMP_ID
                         and bike_id = :P303_BIKE_ID
                         and return_dt is null
                       order by assign_dt desc, BIKE_ASSIGN_ID desc
                     )
               where rownum = 1;
          exception
              when no_data_found then
                  l_assignment_id := null;
          end;
      
          hr_bike_req_pkg.close_after_assignment(
              p_emp_id             => :P303_EMP_ID,
              p_bike_id            => :P303_BIKE_ID,
              p_bike_assignment_id => l_assignment_id,
              p_request_id         => :P303_REQUEST_ID
          );
      end;

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

