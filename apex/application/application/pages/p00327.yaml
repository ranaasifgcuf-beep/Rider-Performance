- # ====== Region: Employees Having Bike But Not Working =======
  id: 41430693084189819
  identification: 
    name: Employees Having Bike But Not Working
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ac.emp_id,
             ac.emp_code,
             ac.full_employee_name as employee_name,
      
             ac.current_status_name,
             ac.current_legal_name,
      
             ac.job_name,
             ac.worker_type,
             ac.supplier_name,
      
             ac.current_bike_badge as bike_no,
      
             to_char(ac.current_bike_assign_dt, 'DD-MON-YYYY') as bike_assign_date,
      
             case
                 when ac.current_bike_assign_dt is not null then
                     trunc(sysdate) - trunc(ac.current_bike_assign_dt)
             end as bike_with_days,
      
             ac.active_assignment_yn,
             ac.actually_working_yn,
      
             ac.asset_risk_badge as asset_risk,
      
             case ac.asset_risk_code
                 when 'BIKE_WITH_PENDING_ACTIVE' then
                     '<span class="t-Badge t-Badge--warning">Start duty or return bike</span>'
      
                 when 'BIKE_ASSIGNED_BEFORE_ACTIVE' then
                     '<span class="t-Badge t-Badge--warning">Move Pending Active or return bike</span>'
      
                 when 'BIKE_RETURN_REQUIRED' then
                     '<span class="t-Badge t-Badge--danger">Return bike before vacation</span>'
      
                 when 'BIKE_CLEARANCE_PENDING' then
                     '<span class="t-Badge t-Badge--danger">Bike clearance required</span>'
      
                 when 'BIKE_RECOVERY_REQUIRED' then
                     '<span class="t-Badge t-Badge--danger">Accident recovery follow-up</span>'
      
                 when 'BIKE_RECOVERY_PENDING' then
                     '<span class="t-Badge t-Badge--danger">Recovery / legal follow-up</span>'
      
                 else
                     '<span class="t-Badge t-Badge--danger">Bike with non-working employee</span>'
             end as action_required,
      
             case
                 when ac.open_bike_request_id is not null then
                     '<span class="t-Badge t-Badge--warning">Bike Request Open</span>'
                 else
                     '<span class="t-Badge t-Badge--normal">No Open Request</span>'
             end as request_status,
      
             case
                 when ac.active_assignment_yn = 'Y'
                  and ac.actually_working_yn = 'N' then
                     '<span class="t-Badge t-Badge--warning">Assignment Exists But Not Active</span>'
      
                 when ac.active_assignment_yn = 'Y' then
                     '<span class="t-Badge t-Badge--success">Assignment Exists</span>'
      
                 else
                     '<span class="t-Badge t-Badge--normal">No Active Assignment</span>'
             end as assignment_status,
      
             case
                 when ac.asset_risk_code in (
                          'BIKE_RECOVERY_PENDING',
                          'BIKE_RECOVERY_REQUIRED',
                          'BIKE_CLEARANCE_PENDING',
                          'BIKE_RETURN_REQUIRED'
                      )
                 then
                     '<span class="t-Badge t-Badge--danger">High</span>'
      
                 when ac.asset_risk_code in (
                          'BIKE_ASSIGNED_BEFORE_ACTIVE',
                          'BIKE_WITH_PENDING_ACTIVE'
                      )
                 then
                     '<span class="t-Badge t-Badge--warning">Medium</span>'
      
                 else
                     '<span class="t-Badge t-Badge--normal">Review</span>'
             end as risk_level,
      /*
             '<a href="' ||
             apex_util.prepare_url(
                 'f?p=' || :APP_ID || ':107:' || :APP_SESSION ||
                 '::NO::P107_EMP_ID,P107_FROM_PAGE:' ||
                 ac.emp_id || ',327'
             ) ||
             '" title="Open Status Change">' ||
             '<span class="fa fa-edit" aria-hidden="true"></span>' ||
             '</a>' as status_action,*/
      
             '<a href="' ||
             apex_util.prepare_url(
                 'f?p=' || :APP_ID || ':309:' || :APP_SESSION ||
                 '::NO::P309_EMP_ID:' || ac.emp_id
             ) ||
             '" title="Open Bike Assignment / Return">' ||
             '<span class="fa fa-motorcycle" aria-hidden="true"></span>' ||
             '</a>' as bike_action
      
      from vw_hr_emp_asset_control ac
      
      where ac.has_bike_yn = 'Y'
        and ac.actually_working_yn = 'N'
      
      order by case ac.asset_risk_code
                   when 'BIKE_RECOVERY_PENDING' then 1
                   when 'BIKE_RECOVERY_REQUIRED' then 2
                   when 'BIKE_CLEARANCE_PENDING' then 3
                   when 'BIKE_RETURN_REQUIRED' then 4
                   when 'BIKE_ASSIGNED_BEFORE_ACTIVE' then 5
                   when 'BIKE_WITH_PENDING_ACTIVE' then 6
                   else 9
               end,
               ac.current_bike_assign_dt;

