css: 
  inline: |
    /* Base icon button */
    .sec-actions .sec-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-right: 6px;
      border-radius: 50%;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    
    /* Hover animation */
    .sec-actions .sec-icon:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }
    
    /* Edit = Blue */
    .sec-actions .sec-edit {
      background: linear-gradient(135deg, #4f8cff, #2f6bff);
    }
    .sec-actions .sec-edit:hover {
      background: linear-gradient(135deg, #2f6bff, #1e55d6);
    }
    
    /* Reset Password = Orange */
    .sec-actions .sec-reset {
      background: linear-gradient(135deg, #ff9f43, #ff7a18);
    }
    .sec-actions .sec-reset:hover {
      background: linear-gradient(135deg, #ff7a18, #e65c00);
    }
    
    /* Manage Access = Purple */
    .sec-actions .sec-access {
      background: linear-gradient(135deg, #9b59b6, #7d3c98);
    }
    .sec-actions .sec-access:hover {
      background: linear-gradient(135deg, #7d3c98, #5e3370);
    }
    

