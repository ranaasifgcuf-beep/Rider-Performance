- # ====== Region: Legal Status History ========================
  id: 39252763077729123
  identification: 
    name: Legal Status History
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select h.old_legal_status,
             nvl(osm.status_name,
                 replace(initcap(lower(replace(h.old_legal_status, 'LEGAL_', ''))), '_', ' ')
             ) old_legal_status_name,
      
             h.new_legal_status,
             nvl(nsm.status_name,
                 replace(initcap(lower(replace(h.new_legal_status, 'LEGAL_', ''))), '_', ' ')
             ) new_legal_status_name,
      
             to_char(h.effective_from_dt, 'DD-MON-YYYY HH24:MI') effective_from,
             to_char(h.effective_to_dt, 'DD-MON-YYYY HH24:MI') effective_to,
      
             case h.is_current_record
                 when 'Y' then '<span class="t-Badge t-Badge--success">Current</span>'
                 else '<span class="t-Badge">Closed</span>'
             end current_flag,
      
             h.legal_status_reason,
             h.legal_case_ref,
             h.remarks,
             h.created_by,
             to_char(h.created_dt, 'DD-MON-YYYY HH24:MI') created_dt
      
      from hr_emp_legal_status_hist h
      
      left join hr_status_master osm
             on osm.status_code =
                case
                    when h.old_legal_status like 'LEGAL_%' then h.old_legal_status
                    else 'LEGAL_' || h.old_legal_status
                end
            and osm.status_nature = 'LEGAL'
      
      left join hr_status_master nsm
             on nsm.status_code =
                case
                    when h.new_legal_status like 'LEGAL_%' then h.new_legal_status
                    else 'LEGAL_' || h.new_legal_status
                end
            and nsm.status_nature = 'LEGAL'
      
      where h.emp_id = :P100_EMP_ID
      order by h.effective_from_dt desc,
               h.legal_status_hist_id desc;

  layout: 
    sequence: 80
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

