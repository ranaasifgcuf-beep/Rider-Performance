    title: Policy Valid  <span class="t-Badge t-Badge--success">&P114_VALID_CNT.</span>
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select 
      INSURANCE_ID,
      emp_id,
             emp_code,
             employee_name,
             provider_name,
             policy_no,
             member_card_no,
             plan_name,
             class_name,
             start_dt,
             expiry_dt,
             days_left,
             '<span class="fa fa-edit"></span>' as edit_icon,
             '<span class="fa fa-times"></span>' as cancel_icon,
             STATUS_BADGE_TEXT,
             CURRENT_PROJECT
      from vw_hr_emp_insurance_status
      where insurance_type = :P114_INS_TYPE
        and insurance_bucket = 'VALID'
      order by expiry_dt, emp_code

