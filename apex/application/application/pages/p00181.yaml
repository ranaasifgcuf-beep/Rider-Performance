- # ====== Region: All Documents ===============================
  id: 38203657948256205
  identification: 
    name: All Documents
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select emp_code,
             employee_name,
             doc_type_name document,
             doc_no document_number,
             to_char(issue_dt, 'DD-MON-YYYY') issue_date,
             to_char(expiry_dt, 'DD-MON-YYYY') expiry_date,
             expiry_in_days,
             case expiry_status
                 when 'NO_EXPIRY' then '<span class="t-Badge">No Expiry</span>'
                 when 'EXPIRED' then '<span class="t-Badge t-Badge--danger">Expired</span>'
                 when 'EXPIRING_SOON' then '<span class="t-Badge t-Badge--warning">Near Expiry</span>'
                 when 'VALID' then '<span class="t-Badge t-Badge--success">Active</span>'
                 else '<span class="t-Badge">' || apex_escape.html(expiry_status) || '</span>'
             end expiry_status,
             case
                 when file_name is not null or file_ref is not null then
                     '<span class="t-Badge t-Badge--success">Attached</span>'
                 else
                     '<span class="t-Badge t-Badge--warning">No File</span>'
             end file_status,
             case is_current_record
                 when 'Y' then '<span class="t-Badge t-Badge--success">Yes</span>'
                 else '<span class="t-Badge">No</span>'
             end current_record,
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 105,
                 p_items       => 'P105_EMP_ID',
                 p_values      => emp_id,
                 p_clear_cache => '105'
             ) ||
             '" title="Open Employee Documents"><span class="fa fa-folder-open"></span></a>' open_docs
      from hr_emp_docs_v
      where is_current_record = 'Y'
        and (:P181_DOC_GROUP is null or doc_group = :P181_DOC_GROUP)
        and (:P181_DOC_TYPE is null or doc_type = :P181_DOC_TYPE)
      order by
             case expiry_status
                 when 'EXPIRED' then 1
                 when 'EXPIRING_SOON' then 2
                 when 'VALID' then 3
                 else 4
             end,
             expiry_dt nulls last,
             emp_code
    page-items-to-submit: 
    - P181_DAYS
    - P181_DOC_GROUP
    - P181_DOC_TYPE

  layout: 
    sequence: 40
    parent-region: Document Monitor # 37591436998478622
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

