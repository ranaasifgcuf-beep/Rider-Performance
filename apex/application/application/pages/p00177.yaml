- # ====== Region: Recent Transactions =========================
  id: 37297413074639631
  identification: 
    name: Recent Transactions
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select to_char(t.txn_date, 'DD-MON-YYYY') txn_date,
             v.loan_no,
             v.emp_code,
             v.employee_name,
             case t.txn_type
                 when 'MANUAL_PAYMENT' then 'Payment'
                 when 'PAYROLL_DEDUCTION' then 'Payroll Deduction'
                 when 'WAIVER' then 'Waiver'
                 when 'ADJUSTMENT' then 'Adjustment'
                 when 'REVERSAL' then 'Reversal'
                 when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                 else t.txn_type
             end txn_type,
             'AED ' || trim(to_char(nvl(t.amount,0), '999G999G999G990D00')) amount,
             t.pay_mode,
             t.reference_no,
             t.created_by,
             to_char(t.created_dt, 'DD-MON-YYYY HH24:MI') created_dt
      from hr_emp_loan_txns t
      join hr_emp_loan_v v
        on v.loan_id = t.loan_id
      where t.approval_status = 'APPROVED'
      order by t.created_dt desc
      fetch first 10 rows only;

