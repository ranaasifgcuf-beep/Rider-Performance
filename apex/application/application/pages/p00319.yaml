- # ====== Region: Employee Charge List ========================
  id: 29746291125627208
  identification: 
    name: Employee Charge List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          c.emp_charge_id,
      
          '<a href="' ||
          apex_page.get_url(
              p_page   => 320,
              p_items  => 'P320_EMP_CHARGE_ID',
              p_values => c.emp_charge_id
          ) || '">' ||
          '<span class="fa fa-edit" title="Edit Charge"></span></a>' as edit_link,
      
          '<a href="' ||
          apex_page.get_url(
              p_page   => 321,
              p_items  => 'P321_EMP_CHARGE_ID',
              p_values => c.emp_charge_id
          ) || '">' ||
          '<span class="fa fa-list" title="Installments"></span></a>' as installments_link,
      
          c.emp_id,
      
          c.charge_type,
          case c.charge_type
            when 'FOOD_PERMIT' then '<span class="t-Badge t-Badge--info">FOOD PERMIT</span>'
            when 'IMPOUND' then '<span class="t-Badge t-Badge--danger">IMPOUND</span>'
            when 'ACCIDENT_RECOVERY' then '<span class="t-Badge t-Badge--warning">ACCIDENT</span>'
            when 'MAINTENANCE_RECOVERY' then '<span class="t-Badge t-Badge--warning">MAINTENANCE</span>'
            when 'DAMAGE' then '<span class="t-Badge t-Badge--danger">DAMAGE</span>'
            when 'OVER_MILEAGE' then '<span class="t-Badge t-Badge--warning">OVER MILEAGE</span>'
            else '<span class="t-Badge t-Badge--default">OTHER</span>'
          end as charge_type_badge,
      
          c.recurrence_type,
          case c.recurrence_type
            when 'ONE_TIME' then '<span class="t-Badge t-Badge--default">ONE TIME</span>'
            when 'YEARLY' then '<span class="t-Badge t-Badge--info">YEARLY</span>'
            when 'MONTHLY' then '<span class="t-Badge t-Badge--warning">MONTHLY</span>'
          end as recurrence_badge,
      
          c.charge_ts,
          c.amount,
          c.source_start_dt,
          c.source_end_dt,
          c.bike_id,
      
          case c.charge_to_employee_yn
            when 'Y' then '<span class="t-Badge t-Badge--success">CHARGEABLE</span>'
            else '<span class="t-Badge t-Badge--default">NO</span>'
          end as charge_to_emp_badge,
      
          case c.excluded_from_charge_yn
            when 'Y' then '<span class="t-Badge t-Badge--warning">EXCLUDED</span>'
            else '<span class="t-Badge t-Badge--success">NOT EXCLUDED</span>'
          end as excluded_badge,
      
          case c.approval_status
            when 'DRAFT' then '<span class="t-Badge t-Badge--warning">DRAFT</span>'
            when 'APPROVED' then '<span class="t-Badge t-Badge--success">APPROVED</span>'
            when 'CANCELLED' then '<span class="t-Badge t-Badge--danger">CANCELLED</span>'
            when 'CLOSED' then '<span class="t-Badge t-Badge--info">CLOSED</span>'
            when 'BAD_DEBT' then '<span class="t-Badge t-Badge--danger">BAD DEBT</span>'
            else '<span class="t-Badge t-Badge--default">' || c.approval_status || '</span>'
          end as approval_badge,
      
          case c.payroll_processed_yn
            when 'Y' then '<span class="t-Badge t-Badge--success">PROCESSED</span>'
            else '<span class="t-Badge t-Badge--warning">PENDING</span>'
          end as payroll_badge,
      
          c.remarks,
          c.created_by,
          c.created_dt
      from hr_emp_charges c
      order by c.charge_ts desc, c.emp_charge_id desc

