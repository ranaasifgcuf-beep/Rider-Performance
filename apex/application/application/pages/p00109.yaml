validations: 
- # ====== Validation: Validation Date Overlap =================
  id: 15893115835110429
  identification: 
    name: Validation Date Overlap

  execution: 
    sequence: 100

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      declare
        l_cnt number;
      begin
        select count(*)
          into l_cnt
          from hr_assignments a
         where a.emp_id = :P109_EMP_ID
           and :P109_START_DT <= nvl(a.end_dt, date '4712-12-31')
           and a.asg_id <> nVL(:P109_ASG_ID,0)
           and date '4712-12-31' >= a.start_dt;
      
        if l_cnt > 0 then
          return 'This employee already has overlapping assignment period.';
        end if;
      
        return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification
    associated-item: P109_START_DT # 15928138864946010

- # ====== Validation: End Date > Start Date ===================
  id: 15894037422110438
  identification: 
    name: End Date > Start Date

  execution: 
    sequence: 110

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      declare
          l_start_dt  date;
          l_end_dt date;
      begin
          l_start_dt  := :P109_START_DT;
          l_end_dt := :P109_END_DT;
      
      
          if  l_end_dt is not null
             and l_end_dt <= l_start_dt then
              return 'End Date must be greater than Issue Date.';
          end if;
      
         
      
          return null;
      end;
    always-execute: false

  error: 
