- # ====== Region: Summary =====================================
  id: 37295478525639611
  identification: 
    name: Summary
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_active_loans       number := 0;
          l_total_loan_amount  number := 0;
          l_total_balance      number := 0;
          l_paid_this_month    number := 0;
          l_pending_loans      number := 0;
          l_pending_txns       number := 0;
          l_bad_debt_amount    number := 0;
          l_waived_amount      number := 0;
      
          function money(p_amount number) return varchar2 is
          begin
              return 'AED ' || trim(to_char(nvl(p_amount,0), '999G999G999G990D00'));
          end;
      begin
          select count(*),
                 nvl(sum(loan_amount),0),
                 nvl(sum(balance_amount),0),
                 nvl(sum(bad_debt_amount),0),
                 nvl(sum(waived_amount),0)
            into l_active_loans,
                 l_total_loan_amount,
                 l_total_balance,
                 l_bad_debt_amount,
                 l_waived_amount
            from hr_emp_loan_v
           where approval_status = 'APPROVED'
             and status = 'ACTIVE';
      
          select nvl(sum(amount),0)
            into l_paid_this_month
            from hr_emp_loan_txns
           where approval_status = 'APPROVED'
             and txn_type in ('MANUAL_PAYMENT','PAYROLL_DEDUCTION')
             and txn_date >= trunc(cast(systimestamp at time zone 'Asia/Dubai' as date), 'MM')
             and txn_date <  add_months(trunc(cast(systimestamp at time zone 'Asia/Dubai' as date), 'MM'), 1);
      
          select count(*)
            into l_pending_loans
            from hr_emp_loans
           where approval_status = 'SUBMITTED';
      
          select count(*)
            into l_pending_txns
            from hr_emp_loan_txns
           where approval_status = 'SUBMITTED';
      
          htp.p(
          '<div class="loan-kpi-grid">' ||
      
          '<div class="loan-kpi-card">' ||
          '<div class="loan-kpi-label">Active Loans</div>' ||
          '<div class="loan-kpi-value">' || l_active_loans || '</div>' ||
          '<div class="loan-kpi-sub">Approved and active</div>' ||
          '</div>' ||
      
          '<div class="loan-kpi-card amount">' ||
          '<div class="loan-kpi-label">Total Loan Amount</div>' ||
          '<div class="loan-kpi-value">' || money(l_total_loan_amount) || '</div>' ||
          '<div class="loan-kpi-sub">Approved active loans</div>' ||
          '</div>' ||
      
          '<div class="loan-kpi-card danger">' ||
          '<div class="loan-kpi-label">Outstanding Balance</div>' ||
          '<div class="loan-kpi-value">' || money(l_total_balance) || '</div>' ||
          '<div class="loan-kpi-sub">Amount still recoverable</div>' ||
          '</div>' ||
      
          '<div class="loan-kpi-card success">' ||
          '<div class="loan-kpi-label">Paid This Month</div>' ||
          '<div class="loan-kpi-value">' || money(l_paid_this_month) || '</div>' ||
          '<div class="loan-kpi-sub">Manual + payroll payments</div>' ||
          '</div>' ||
      
          '<div class="loan-kpi-card warning">' ||
          '<div class="loan-kpi-label">Pending Loan Approvals</div>' ||
          '<div class="loan-kpi-value">' || l_pending_loans || '</div>' ||
          '<div class="loan-kpi-sub">Manual loan requests</div>' ||
          '</div>' ||
      
          '<div class="loan-kpi-card warning">' ||
          '<div class="loan-kpi-label">Pending Txn Approvals</div>' ||
          '<div class="loan-kpi-value">' || l_pending_txns || '</div>' ||
          '<div class="loan-kpi-sub">Payment / waiver / adjustment</div>' ||
          '</div>' ||
      
          '<div class="loan-kpi-card">' ||
          '<div class="loan-kpi-label">Waived Amount</div>' ||
          '<div class="loan-kpi-value">' || money(l_waived_amount) || '</div>' ||
          '<div class="loan-kpi-sub">Approved active loans</div>' ||
          '</div>' ||
      
          '<div class="loan-kpi-card danger">' ||
          '<div class="loan-kpi-label">Bad Debt Write-off</div>' ||
          '<div class="loan-kpi-value">' || money(l_bad_debt_amount) || '</div>' ||
          '<div class="loan-kpi-sub">Management write-off</div>' ||
          '</div>' ||
      
          '</div>'
          );
      end;

  layout: 
