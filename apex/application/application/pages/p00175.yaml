- # ====== Region: Approval Request ============================
  id: 37242609146914206
  identification: 
    name: Approval Request
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select r.approval_id,
             case r.module_code
                 when 'LOAN_MASTER' then 'Loan Creation'
                 when 'LOAN_TXN' then 'Loan Transaction'
                 else r.module_code
             end approval_type,
             r.txn_type_code,
             r.approval_subject,
             'AED ' || trim(to_char(nvl(r.approval_amount,0), '999G999G999G990D00')) amount,
            case r.request_status
          when 'APPROVED' then '<span class="t-Badge t-Badge--success">Approved</span>'
          when 'SUBMITTED' then '<span class="t-Badge t-Badge--warning">Submitted</span>'
          when 'REJECTED' then '<span class="t-Badge t-Badge--danger">Rejected</span>'
          else '<span class="t-Badge">' || apex_escape.html(r.request_status) || '</span>'
      end request_status,
             r.requested_by,
             to_char(r.requested_dt, 'DD-MON-YYYY HH24:MI') requested_dt,
             r.final_action_done
      from hr_approval_requests r
      where (
              :P175_LOAN_TXN_ID is null
              and r.module_code = 'LOAN_MASTER'
              and r.record_pk = :P175_LOAN_ID
            )
         or (
              r.module_code = 'LOAN_TXN'
              and exists (
                  select 1
                    from hr_emp_loan_txns t
                   where t.loan_txn_id = r.record_pk
                     and t.loan_id = :P175_LOAN_ID
                     and (
                          :P175_LOAN_TXN_ID is null
                          or t.loan_txn_id = :P175_LOAN_TXN_ID
                     )
              )
            )
      order by r.approval_id desc;

