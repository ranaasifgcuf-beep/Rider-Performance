dynamic-actions: 
- # ====== Dynamic Action: Show Hide Pay Mode ==================
  id: 35771782009306914
  identification: 
    name: Show Hide Pay Mode

  execution: 
    sequence: 10
    event-scope: Static

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 35771800705306915
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        if ($v("P172_TXN_TYPE") === "MANUAL_PAYMENT") {
            apex.item("P172_PAY_MODE").show();
            apex.item("P172_REFERENCE_NO").show();
        } else {
            apex.item("P172_PAY_MODE").hide();
            apex.item("P172_REFERENCE_NO").hide();
        }

    execution: 
      sequence: 10
      event: Show Hide Pay Mode # 35771782009306914
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Show / Hide Pay Mode ================
  id: 35771927496306916
  identification: 
    name: Show / Hide Pay Mode

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P172_TXN_TYPE

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 35772036368306917
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        function toggleLoanTxnFields() {
            var txnType = $v("P172_TXN_TYPE");
        
            // Default: hide special fields
            apex.item("P172_PAY_MODE").hide();
            apex.item("P172_REFERENCE_NO").hide();
            apex.item("P172_REVERSAL_OF_TXN_ID").hide();
        
            // Default: show amount
            apex.item("P172_AMOUNT").show();
        
            if (txnType === "MANUAL_PAYMENT") {
        
                // Payment needs amount + pay mode + reference
                apex.item("P172_AMOUNT").show();
                apex.item("P172_PAY_MODE").show();
                apex.item("P172_REFERENCE_NO").show();
        
            } else if (txnType === "REVERSAL") {
        
                // Reversal needs original transaction only
                // Amount should not be entered by user
                apex.item("P172_AMOUNT").hide();
                apex.item("P172_PAY_MODE").hide();
                apex.item("P172_REFERENCE_NO").hide();
                apex.item("P172_REVERSAL_OF_TXN_ID").show();
        
            } else if (
                txnType === "WAIVER" ||
                txnType === "ADJUSTMENT" ||
                txnType === "BAD_DEBT_WRITE_OFF"
            ) {
        
                // These need amount and remarks
                apex.item("P172_AMOUNT").show();
                apex.item("P172_PAY_MODE").hide();
                apex.item("P172_REFERENCE_NO").hide();
                apex.item("P172_REVERSAL_OF_TXN_ID").hide();
        
            }
        }
        
        toggleLoanTxnFields();

    execution: 
      sequence: 10
      event: Show / Hide Pay Mode # 35771927496306916
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Show Hide Reversal Item =============
  id: 35772381938306920
  identification: 
    name: Show Hide Reversal Item

