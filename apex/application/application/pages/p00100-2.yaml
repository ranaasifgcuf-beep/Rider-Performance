- # ====== Region: Employee Hero ===============================
  id: 34488390390636944
  identification: 
    name: Employee Hero
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          '<div class="emp-hero">'
      
       ||   '<div class="emp-hero__name">' || full_name || '</div>'
      
       ||   '<div class="emp-hero__chips">'
       ||     '<span class="emp-chip"><span class="emp-chip__label">Code</span><span class="emp-chip__value">' || nvl(emp_code,'-') || '</span></span>'
       ||     '<span class="emp-chip"><span class="emp-chip__label">Nationality</span><span class="emp-chip__value">' || nvl(nationality_name,'-') || '</span></span>'
       ||     '<span class="emp-chip"><span class="emp-chip__label">Type</span><span class="emp-chip__value">' || nvl(worker_type,'-') || '</span></span>'
       ||     '<span class="emp-chip"><span class="emp-chip__label">Project</span><span class="emp-chip__value">' || nvl(agreed_project,'-') || '</span></span>'
       ||     '<span class="emp-chip"><span class="emp-chip__label">City</span><span class="emp-chip__value">' || nvl(agreed_city,'-') || '</span></span>'
       ||     status_chip
       ||   '</div>'
      
       ||   '<div class="emp-hero__info">'
       ||     '<div class="emp-info"><span class="emp-info__label">Mobile:</span><span class="emp-info__value">' || nvl(mobile,'-') || '</span></div>'
       ||     '<div class="emp-info"><span class="emp-info__label">Email:</span><span class="emp-info__value">' || nvl(email,'-') || '</span></div>'
       ||     '<div class="emp-info"><span class="emp-info__label">Join Date:</span><span class="emp-info__value">' || nvl(join_date,'-') || '</span></div>'
       ||   '</div>'
      
       ||   '<div class="emp-hero__docs">'
       ||     passport_badge || ' '
       ||     eid_badge || ' '
       ||     dl_badge
       ||   '</div>'
      
       || '</div>' as profile_html
      
      from (
          select e.emp_id,
                 e.emp_code,
                 trim(e.first_name || ' ' || nvl(e.last_name,'')) as full_name,
                 e.mobile,
                 e.email,
                 to_char(e.join_date,'DD-MON-YYYY') as join_date,
                 e.worker_type,
                 e.agreed_project,
                 e.agreed_city,
                 e.nationality as nationality_name,
                 e.status_badge_text,
      
                 case
                   when upper(nvl(e.status_badge_text,'X')) = 'ACTIVE' then
                     '<span class="emp-chip emp-chip--success"><span class="emp-chip__label">Status</span><span class="emp-chip__value">' || e.status_badge_text || '</span></span>'
                   when upper(nvl(e.status_badge_text,'X')) in ('PIPELINE','VACATION') then
                     '<span class="emp-chip emp-chip--warning"><span class="emp-chip__label">Status</span><span class="emp-chip__value">' || e.status_badge_text || '</span></span>'
                   else
                     '<span class="emp-chip emp-chip--danger"><span class="emp-chip__label">Status</span><span class="emp-chip__value">' || nvl(e.status_badge_text,'-') || '</span></span>'
                 end as status_chip,
      
                 case
                   when exists (
                        select 1
                          from hr_emp_docs d
                         where d.emp_id = e.emp_id
                           and upper(d.doc_type) = 'PASSPORT'
                           and nvl(d.is_current_record,'Y') = 'Y'
                           and d.doc_no is not null
                   )
                   then '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> Passport</span>'
                   else '<span class="doc-ind no"><span class="fa fa-times-circle"></span> Passport</span>'
                 end as passport_badge,
      
                 case
                   when exists (
                        select 1
                          from hr_emp_docs d
                         where d.emp_id = e.emp_id
                           and upper(d.doc_type) = 'EID'
                           and nvl(d.is_current_record,'Y') = 'Y'
                           and d.doc_no is not null
                   )
                   then '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> EID</span>'
                   else '<span class="doc-ind no"><span class="fa fa-times-circle"></span> EID</span>'
                 end as eid_badge,
      
                 case
                   when exists (
                        select 1
                          from hr_emp_docs d
                         where d.emp_id = e.emp_id
                           and upper(d.doc_type) in ('DL','DRIVING LICENSE','DRIVING_LICENSE')
                           and nvl(d.is_current_record,'Y') = 'Y'
                           and d.doc_no is not null
                   )
                   then '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> Driving License</span>'
                   else '<span class="doc-ind no"><span class="fa fa-times-circle"></span> Driving License</span>'
                 end as dl_badge
      
            from vw_hr_employee_list e
           where e.emp_id = :P100.1_EMP_ID
      )

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
