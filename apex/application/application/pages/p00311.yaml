processes: 
- # ====== Process: FETCH_P311_BIKE_INFO =======================
  id: 30212538138810124
  identification: 
    name: FETCH_P311_BIKE_INFO
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select 
                 bike_status_name,
                 custody_type_name,
                 current_emp_id
            into 
                 :P311_CURRENT_STATUS,
                 :P311_CURRENT_CUSTODY,
                 :P311_EMP_ID
            from vw_fleet_bike_current
           where bike_id = :P311_BIKE_ID;
      exception
          when no_data_found then
              raise_application_error(-20001, 'Bike information not found.');
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

  server-side-condition: 
    type: Item is NOT NULL
    item: P311_BIKE_ID

- # ====== Process: OPEN_BIKE_IMPOUND ==========================
  id: 30213615288810135
  identification: 
    name: OPEN_BIKE_IMPOUND
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_impound_id number;
      begin
          fleet_pkg.open_bike_impound(
              p_bike_id                 => :P311_BIKE_ID,
              p_emp_id                  => :P311_EMP_ID,
              p_impound_start_ts        => :P311_IMPOUND_START_TS,
              p_expected_release_ts     => :P311_EXPECTED_RELEASE_TS,
              p_impound_custody_code    => :P311_IMPOUND_CUSTODY_CODE,
              p_impound_location_id     => :P311_IMPOUND_LOCATION_ID,
              p_impound_location_text   => :P311_IMPOUND_LOCATION_TEXT,
              p_impound_reason          => :P311_IMPOUND_REASON,
              p_impound_cost            => :P311_IMPOUND_COST,
              p_charge_to_employee_yn   => :P311_CHARGE_TO_EMPLOYEE_YN,
              p_excluded_from_charge_yn => :P311_EXCLUDED_FROM_CHARGE_YN,
              p_create_charge_yn        => :P311_CREATE_CHARGE_YN,
              p_charge_due_dt           => :P311_CHARGE_DUE_DT,
              p_remarks                 => :P311_REMARKS,
              p_impound_id              => l_impound_id
          );
      
          :P311_IMPOUND_ID := l_impound_id;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: PBN_SAVE # 30213428885810133

