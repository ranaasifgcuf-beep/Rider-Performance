    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select loan_no,
             emp_code,
             employee_name,
             loan_type,
             source_type,
             'AED ' || trim(to_char(nvl(loan_amount,0), '999G999G999G990D00')) loan_amount,
             'AED ' || trim(to_char(nvl(paid_amount,0), '999G999G999G990D00')) paid_amount,
             'AED ' || trim(to_char(nvl(balance_amount,0), '999G999G999G990D00')) balance_amount,
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 171,
                 p_items       => 'P171_LOAN_ID',
                 p_values      => loan_id,
                 p_clear_cache => '171'
             ) ||
             '" title="Open Loan"><span class="fa fa-eye"></span></a>' view_link
      from hr_emp_loan_v
      where approval_status = 'APPROVED'
        and status = 'ACTIVE'
        and nvl(balance_amount,0) > 0
      order by balance_amount desc
      fetch first 10 rows only;

