- # ====== Region: Previous Comments / Information Requests ====
  id: 34968946436792819
  identification: 
    name: Previous Comments / Information Requests
    title: Previous Comments / Information Requests
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select s.step_seq,
             s.step_name,
             t.subject,
             c.created_by,
               to_char(
                 cast(c.created_on at time zone 'Asia/Dubai' as timestamp),
                 'DD-MON-YYYY HH24:MI'
             ) as comment_dt,
             c.TEXT
       as comment_text
      from hr_approval_request_steps s
      join apex_tasks t
        on t.detail_pk = to_char(s.approval_step_id)
      join apex_task_comments c
        on c.task_id = t.task_id
      where s.approval_id = :P25_APPROVAL_ID
      order by c.created_on

