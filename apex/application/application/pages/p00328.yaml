dynamic-actions: 
- # ====== Dynamic Action: Show/Hide Current SIM ===============
  id: 41408241202853032
  identification: 
    name: Show/Hide Current SIM

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P328_REQUEST_TYPE

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 41408394941853033
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var t = apex.item("P328_REQUEST_TYPE").getValue();
        
        var needCurrentSim = [
            "REPLACEMENT_LOST",
            "REPLACEMENT_DAMAGED",
            "REPLACEMENT_BLOCKED",
            "REPLACEMENT_PROJECT_CHANGE",
            "TEMPORARY_REPLACEMENT",
            "RETURN_REQUEST"
        ].indexOf(t) >= 0;
        
        if (needCurrentSim) {
            apex.item("P328_CURRENT_SIM_ID").show();
        } else {
            apex.item("P328_CURRENT_SIM_ID").setValue("");
            apex.item("P328_CURRENT_SIM_ID").hide();
        }

    execution: 
      sequence: 10
      event: Show/Hide Current SIM # 41408241202853032
      fire-when-event-result-is: True
      fire-on-initialization: true

