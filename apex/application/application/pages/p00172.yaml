- # ====== Process: Load on Transaction Page ===================
  id: 35771414828306911
  identification: 
    name: Load on Transaction Page
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_txn_type varchar2(40);
      begin
          -- If editing existing transaction request
          if :P172_LOAN_TXN_ID is not null then
      
              select t.loan_id,
                     t.txn_type,
                     t.txn_date,
                     t.amount,
                     t.pay_mode,
                     t.reference_no,
                     t.reversal_of_txn_id,
                     t.remarks,
                     t.approval_status
                into :P172_LOAN_ID,
                     :P172_TXN_TYPE,
                     :P172_TXN_DATE,
                     :P172_AMOUNT,
                     :P172_PAY_MODE,
                     :P172_REFERENCE_NO,
                     :P172_REVERSAL_OF_TXN_ID,
                     :P172_REMARKS,
                     :P172_APPROVAL_STATUS
                from hr_emp_loan_txns t
               where t.loan_txn_id = :P172_LOAN_TXN_ID;
      
          end if;
      
          -- Load loan summary
          select loan_no,
                 emp_code || ' - ' || employee_name,
                 balance_amount
            into :P172_LOAN_NO,
                 :P172_EMPLOYEE,
                 :P172_CURRENT_BALANCE
            from hr_emp_loan_v
           where loan_id = :P172_LOAN_ID;
      
          -- Default date
          if :P172_TXN_DATE is null then
              :P172_TXN_DATE := trunc(cast(systimestamp at time zone 'Asia/Dubai' as date));
          end if;
      
          -- Default approval status
          if :P172_APPROVAL_STATUS is null then
              :P172_APPROVAL_STATUS := 'DRAFT';
          end if;
      
          l_txn_type := :P172_TXN_TYPE;
      
          :P172_TXN_TYPE_NAME :=
              case l_txn_type
                  when 'MANUAL_PAYMENT' then 'Manual Payment'
                  when 'WAIVER' then 'Waiver'
                  when 'ADJUSTMENT' then 'Adjustment'
                  when 'REVERSAL' then 'Reversal'
                  when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                  else nvl(l_txn_type, '-')
              end;
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Save Loan Transaction Request ==============
  id: 35773070250306927
  identification: 
    name: Save Loan Transaction Request
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_emp_id          number;
          l_balance         number;
          l_status          varchar2(20);
          l_old_status      varchar2(20);
          l_reverse_amount  number;
      begin
          select emp_id,
                 balance_amount
            into l_emp_id,
                 l_balance
            from hr_emp_loan_v
           where loan_id = :P172_LOAN_ID;
      
             -- Reversal validation
          if :P172_TXN_TYPE = 'REVERSAL' then
              if :P172_REVERSAL_OF_TXN_ID is null then
                  raise_application_error(-20006, 'Please select transaction to reverse.');
              end if;
      
              select amount
                into l_reverse_amount
                from hr_emp_loan_txns
               where loan_txn_id = :P172_REVERSAL_OF_TXN_ID
                 and loan_id = :P172_LOAN_ID
                 and approval_status = 'APPROVED';
      
              -- For now reversal is full reversal
              :P172_AMOUNT := l_reverse_amount;
          end if;
      
          -- Basic validations
          if :P172_LOAN_ID is null then
              raise_application_error(-20001, 'Loan ID is required.');
          end if;
      
          if :P172_TXN_TYPE is null then
              raise_application_error(-20002, 'Transaction type is required.');
          end if;
      
      if :P172_TXN_TYPE in ('MANUAL_PAYMENT', 'WAIVER', 'BAD_DEBT_WRITE_OFF','REVERSAL') then
          if nvl(:P172_AMOUNT, 0) <= 0 then
              raise_application_error(-20003, 'Amount must be greater than zero.');
          end if;
          END IF;
      
          -- Pay mode required for manual payment
          if :P172_TXN_TYPE = 'MANUAL_PAYMENT'
             and :P172_PAY_MODE is null then
              raise_application_error(-20004, 'Pay mode is required for manual payment.');
          end if;
      
          -- Remarks required for sensitive actions
          if :P172_TXN_TYPE in ('WAIVER','ADJUSTMENT','REVERSAL','BAD_DEBT_WRITE_OFF')
             and :P172_REMARKS is null then
              raise_application_error(-20005, 'Remarks / reason is required for this request.');
          end if;
      
        
      
          -- Amount cannot exceed current balance for balance-reducing requests
          if :P172_TXN_TYPE in ('MANUAL_PAYMENT','WAIVER','ADJUSTMENT','BAD_DEBT_WRITE_OFF')
             and :P172_AMOUNT > l_balance then
              raise_application_error(-20007, 'Amount cannot be greater than current loan balance.');
          end if;
      
          if :REQUEST = 'PB_SAVE_DRAFT' then
              l_status := 'DRAFT';
          else
              l_status := 'SUBMITTED';
          end if;
      
          -- Insert new request
          if :P172_LOAN_TXN_ID is null then
      
              insert into hr_emp_loan_txns (
                  loan_id,
                  emp_id,
                  txn_date,
                  txn_type,
                  amount,
                  pay_mode,
                  reference_no,
                  reversal_of_txn_id,
                  approval_status,
                  remarks,
                  source_type,
                  source_id
              )
              values (
                  :P172_LOAN_ID,
                  l_emp_id,
                  nvl(:P172_TXN_DATE, trunc(cast(systimestamp at time zone 'Asia/Dubai' as date))),
                  :P172_TXN_TYPE,
                  :P172_AMOUNT,
                  case when :P172_TXN_TYPE = 'MANUAL_PAYMENT' then :P172_PAY_MODE end,
                  case when :P172_TXN_TYPE = 'MANUAL_PAYMENT' then :P172_REFERENCE_NO end,
                  :P172_REVERSAL_OF_TXN_ID,
                  l_status,
                  :P172_REMARKS,
                  'MANUAL',
                  null
              )
              returning loan_txn_id into :P172_LOAN_TXN_ID;
      
          else
      
              select approval_status
                into l_old_status
                from hr_emp_loan_txns
               where loan_txn_id = :P172_LOAN_TXN_ID;
      
              if l_old_status not in ('DRAFT','REJECTED') then
                  raise_application_error(-20008, 'Only Draft or Rejected requests can be edited.');
              end if;
      
              update hr_emp_loan_txns
                 set txn_date             = nvl(:P172_TXN_DATE, txn_date),
                     txn_type             = :P172_TXN_TYPE,
                     amount               = :P172_AMOUNT,
                     pay_mode             = case when :P172_TXN_TYPE = 'MANUAL_PAYMENT' then :P172_PAY_MODE end,
                     reference_no          = case when :P172_TXN_TYPE = 'MANUAL_PAYMENT' then :P172_REFERENCE_NO end,
                     reversal_of_txn_id   = :P172_REVERSAL_OF_TXN_ID,
                     approval_status      = l_status,
                     remarks              = :P172_REMARKS
               where loan_txn_id = :P172_LOAN_TXN_ID;
      
          end if;
      
          /*
            Later approval wiring:
            if l_status = 'SUBMITTED' then
                call generic approval engine:
                module_code = 'LOAN_TXN'
                record_pk   = :P172_LOAN_TXN_ID
            end if;
          */
      
              if l_status = 'SUBMITTED' then
          hr_loan_app_pkg.submit_for_approval(:P172_LOAN_TXN_ID);
      end if;
      
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Loan transaction request saved successfully.

  error: 
    display-location: Inline in Notification

