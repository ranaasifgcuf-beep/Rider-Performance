validations: 
- # ====== Validation: VAL_P320_REQUIRED_PERIOD_FOR_RECURRING ==
  id: 30108618658516013
  identification: 
    name: VAL_P320_REQUIRED_PERIOD_FOR_RECURRING

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      if :P320_RECURRENCE_TYPE in ('YEARLY','MONTHLY') then
          return :P320_SOURCE_START_DT is not null
             and :P320_SOURCE_END_DT is not null;
      end if;
      
      return true;
    always-execute: false

  error: 
    error-message: Source Start Date and Source End Date are required for recurring charges.
    display-location: Inline with Field and in Notification

- # ====== Validation: VAL_P320_PERIOD_DATE ====================
  id: 30108746356516014
  identification: 
    name: VAL_P320_PERIOD_DATE

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      return :P320_SOURCE_END_DT is null
          or :P320_SOURCE_START_DT is null
          or :P320_SOURCE_END_DT >= :P320_SOURCE_START_DT;
    always-execute: false

  error: 
    error-message: Source End Date cannot be earlier than Source Start Date.
    display-location: Inline with Field and in Notification

- # ====== Validation: VAL_BLOCK_UPDATE_IF_INSTALLMENTS_EXIST ==
  id: 30152860290037238
  identification: 
    name: VAL_BLOCK_UPDATE_IF_INSTALLMENTS_EXIST

  execution: 
    sequence: 30

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      declare
          l_cnt number;
      begin
          select count(*)
            into l_cnt
            from hr_emp_charge_installments
           where emp_charge_id = :P320_EMP_CHARGE_ID;
      
          if l_cnt > 0 then
              return false;
          end if;
      
          return true;
      end;
    always-execute: false

  error: 
    error-message: Charge cannot be updated because installments are already created. Cancel/delete installments first, then update the charge.
    display-location: Inline with Field and in Notification

  server-side-condition: 
    when-button-pressed: PB_SAVE # 30107938166516006

processes: 
- # ====== Process: 10. Set Form Mode ==========================
  id: 18040450116024950
  identification: 
    name: 10. Set Form Mode
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      if :P320_MODE is null then 
      :P320_MODE := case when :P320_EMP_CHARGE_ID is null then 'CREATE' else 'EDIT' end;
      end if;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: 20. Fetch HR EMP Record ====================
  id: 30107519343516002
  identification: 
    name: 20. Fetch HR EMP Record
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      IF :P320_EMP_CHARGE_ID IS NOT NULL THEN
      select emp_id,
             charge_type,
             recurrence_type,
             charge_ts,
             amount,
             source_start_dt,
             source_end_dt,
             source_table_name,
             source_row_id,
             bike_id,
             charge_to_employee_yn,
             approval_status,
             payroll_deduction_code,
             remarks
        into :P320_EMP_ID,
             :P320_CHARGE_TYPE,
             :P320_RECURRENCE_TYPE,
             :P320_CHARGE_TS,
             :P320_AMOUNT,
             :P320_SOURCE_START_DT,
             :P320_SOURCE_END_DT,
             :P320_SOURCE_TABLE_NAME,
             :P320_SOURCE_ROW_ID,
             :P320_BIKE_ID,
             :P320_CHARGE_TO_EMPLOYEE_YN,
             :P320_APPROVAL_STATUS,
             :P320_PAYROLL_DEDUCTION_CODE,
             :P320_REMARKS
        from hr_emp_charges
       where emp_charge_id = :P320_EMP_CHARGE_ID;
       END IF;

  execution: 
    sequence: 20
    point: Before Header
    run-process: Once Per Page Visit (default)

