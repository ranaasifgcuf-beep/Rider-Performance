# ====== Page: Loan Dashboard ================================
id: 177
identification: 
  name: Loan Dashboard
  alias: LOAN-DASHBOARD
  title: Loan Dashboard

appearance: 
  page-mode: Normal
  page-template: Theme Default
  template-options: 
  - '#DEFAULT#'

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

css: 
  inline: |
    .loan-kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
    }
    
    .loan-kpi-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-left: 4px solid #2563eb;
        border-radius: 12px;
        padding: 14px 16px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    
    .loan-kpi-card.amount {
        border-left-color: #9a3412;
    }
    
    .loan-kpi-card.success {
        border-left-color: #15803d;
    }
    
    .loan-kpi-card.warning {
        border-left-color: #d97706;
    }
    
    .loan-kpi-card.danger {
        border-left-color: #dc2626;
    }
    
    .loan-kpi-label {
        font-size: 11px;
        text-transform: uppercase;
        color: #64748b;
        font-weight: 800;
    }
    
    .loan-kpi-value {
        font-size: 22px;
        font-weight: 800;
        color: #0f172a;
        margin-top: 6px;
    }
    
    .loan-kpi-card.amount .loan-kpi-value,
    .loan-kpi-card.danger .loan-kpi-value {
        color: #9a3412;
    }
    
    .loan-kpi-card.success .loan-kpi-value {
        color: #15803d;
    }
    
    .loan-kpi-card.warning .loan-kpi-value {
        color: #d97706;
    }
    
    .loan-kpi-sub {
        font-size: 11px;
        color: #64748b;
        margin-top: 4px;
    }
    
    @media (max-width: 1100px) {
        .loan-kpi-grid {
            grid-template-columns: repeat(2, minmax(180px, 1fr));
        }
    }

security: 
  authentication: Page Requires Authentication
  deep-linking: Application Default
  page-access-protection: Arguments Must Have Checksum
  form-auto-complete: Off
  browser-cache: Application Default

session-management: 
