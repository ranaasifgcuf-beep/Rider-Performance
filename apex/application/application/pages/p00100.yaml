---
# ====== Page: Employee Profile ==============================
id: 100
identification: 
  name: Employee Profile
  alias: EMPLOYEE-PROFILE
  title: Employee Profile

appearance: 
  page-mode: Normal
  page-template: Standard
  template-options: 
  - '#DEFAULT#'

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

css: 
  inline: |
    #emp_avatar .t-Avatar img {
        border-radius: 50%;         
        /*border: 3px solid #2c7be5;*/
        padding: 20px 20px;
        background: #fff;
    }
    
    .emp-hero{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:20px 24px;
      box-shadow:0 4px 14px rgba(0,0,0,.05);
    }
    
    .emp-hero__name{
      font-size:26px;
      font-weight:800;
      color:#0f172a;
      margin-bottom:12px;
    }
    
    .emp-hero__chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
    }
    
    .emp-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:999px;
      padding:6px 12px;
      font-size:12px;
    }
    
    .emp-chip__label{
      color:#6b7280;
      font-weight:600;
    }
    
    .emp-chip__value{
      color:#111827;
      font-weight:700;
    }
    
    /* STATUS COLORS */
    .emp-chip--success{
      background:#ecfdf5;
      border:1px solid #bbf7d0;
      color:#065f46;
    }
    
    .emp-chip--warning{
      background:#fffbeb;
      border:1px solid #fde68a;
      color:#92400e;
    }
    
    .emp-chip--danger{
      background:#fef2f2;
      border:1px solid #fecaca;
      color:#991b1b;
    }
    
    .emp-hero__info{
      display:flex;
      flex-wrap:wrap;
      gap:24px;
      margin-bottom:12px;
    }
    
    .emp-info{
      display:flex;
      gap:6px;
      font-size:14px;
    }
    
    .emp-info__label{
      color:#6b7280;
      font-weight:600;
    }
    
    .emp-info__value{
      color:#111827;
      font-weight:700;
    }
    
    .emp-hero__docs{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-top:6px;
    }
    
    /* DOCUMENT ICON COLORS */
    .doc-ind{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:14px;
      font-weight:600;
    }
    
    .doc-ind.ok{
      color:#15803d;
    }
    
    .doc-ind.no{
      color:#b91c1c;
    }
    
    .doc-ind .fa{
      font-size:16px;
    }
    
    .emp-hero__layout{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap:18px;
      align-items:stretch;
    }
    
    .emp-hero__left{
      min-width:0;
    }
    
    .emp-hero__right{
      min-width:260px;
    }
    
    .emp-sidebox{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:16px 18px;
      height:100%;
    }
    
    .emp-sidebox__title{
      font-size:12px;
      font-weight:700;
      color:#64748b;
      text-transform:uppercase;
      letter-spacing:.5px;
      margin-bottom:14px;
    }
    
    .emp-sidebox__row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:10px 0;
      border-bottom:1px solid #e5e7eb;
      font-size:13px;
    }
    
    .emp-sidebox__row:last-child{
      border-bottom:none;
    }
    
    .emp-sidebox__row > span:first-child{
      color:#64748b;
      font-weight:600;
    }
    
    .emp-sidebox__row > span:last-child{
      color:#0f172a;
      font-weight:700;
      text-align:right;
    }
    
    @media (max-width: 1000px){
      .emp-hero__layout{
        grid-template-columns:1fr;
      }
    
      .emp-hero__right{
        min-width:0;
      }
    }
    .snapshot-board-region .t-Region-header{
      display:none !important;
    }
    
    .snapshot-board-region .t-Region-bodyWrap,
    .snapshot-board-region .t-Region-body{
      padding:0 !important;
    }
    
    .snapshot-board{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:14px;
      align-items:stretch;
      margin-top:12px;
    }
    
    .snap-card{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:18px 18px;
      box-shadow:0 4px 14px rgba(0,0,0,.05);
      min-height:220px;
      display:flex;
      flex-direction:column;
    }
    
    .snap-card__title{
      font-size:12px;
      font-weight:700;
      color:#64748b;
      text-transform:uppercase;
      letter-spacing:.5px;
      margin-bottom:18px;
    }
    
    .snap-card__main{
      font-size:20px;
      font-weight:800;
      color:#0f172a;
      margin-bottom:12px;
      line-height:1.2;
    }
    
    .snap-card__sub{
      font-size:13px;
      color:#334155;
      margin-bottom:10px;
      line-height:1.45;
    }
    
    .snap-card__foot{
      font-size:12px;
      color:#64748b;
      margin-top:auto;
      padding-top:10px;
    }
    
    .snap-card__sub .t-Badge{
      margin-left:6px;
    }
    
    .snap-card--assignment{
      border-top:4px solid #2563eb;
    }
    
    .snap-card--pay{
      border-top:4px solid #16a34a;
    }
    
    .snap-card--insurance{
      border-top:4px solid #f59e0b;
    }
    
    .snap-card--custody{
      border-top:4px solid #dc2626;
    }
    
    @media (max-width: 1200px){
      .snapshot-board{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
    }
    
    @media (max-width: 700px){
      .snapshot-board{
        grid-template-columns:1fr;
      }
    }

security: 
  authentication: Page Requires Authentication
  deep-linking: Application Default
  page-access-protection: Arguments Must Have Checksum
  form-auto-complete: Off
  browser-cache: Application Default

session-management: 
  rejoin-sessions: Application Default

advanced: 
  enable-duplicate-page-submissions: Yes - Enable page to be re-posted
  reload-on-submit: Only for Success

server-cache: 
  caching: Disabled

regions: 
- # ====== Region: Profile Picture =============================
  id: 16925831814220646
  identification: 
    name: Profile Picture
    type: Avatar

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select EMP_ID,
             PHOTO_BLOB,
             PHOTO_FILENAME,
             PHOTO_MIME_TYPE,
             PHOTO_CHARSET,
             PHOTO_LASTUPD
        from HR_EMPLOYEES
      WHERE EMP_ID = :P100_EMP_ID

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: 2

  appearance: 
    template: None
    render-components: Above Content

  advanced: 
    static-id: emp_avatar
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    appearance: 
      display: Single (Partial)

    settings: 
      type: Image
      image: 
        blob-column: PHOTO_BLOB
        filename-column: PHOTO_FILENAME
        mime-type-column: PHOTO_MIME_TYPE
        last-updated-column: PHOTO_LASTUPD

      shape: Circular
      size: Extra Extra Large
      css-classes: emp_avatar

    performance: 
      lazy-loading: false

  columns: 
