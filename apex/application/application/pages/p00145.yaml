- # ====== Region: Approval Rule Workbench =====================
  id: 34578410968033143
  identification: 
    name: Approval Rule Workbench
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select r.rule_id,
             r.module_code,
             m.module_name,
             r.txn_type_code,
             o.org_name,
             r.min_amount,
             r.max_amount,
             r.rule_name,
             r.is_active,
             case 
                 when r.is_active = 'Y' then
                      '<span class="t-Badge t-Badge--success">Active</span>'
                 else
                      '<span class="t-Badge t-Badge--danger">Inactive</span>'
             end as active_badge,
             r.seq_no,
             '<span class="fa fa-edit" title="Edit Rule"></span>' edit_link
      from hr_approval_rules r
      join hr_approval_modules m
        on m.module_code = r.module_code
      left join hr_orgs o
        on o.org_id = r.org_id
      order by r.module_code, r.seq_no

