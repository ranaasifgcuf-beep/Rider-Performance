css: 
  inline: |
    /* Page background */
    .t-Body-content,
    .t-Body-main,
    .t-Region,
    .apex-page-context {
      background: #f5f7fb;
    }
    
    /* Main content wrapper */
    .t-Body-contentInner {
      padding: 16px;
    }
    
    /* Card style for all regions */
    .t-Region {
      background: #ffffff;
      border: 1px solid #e6ebf2;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(31, 45, 61, 0.06);
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    /* Region header */
    .t-Region-header {
      background: #ffffff;
      border-bottom: 1px solid #edf1f7;
      padding: 10px 12px;
    }
    
    /* Region title */
    .t-Region-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2d3d;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .t-Region-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 14px;
      border-radius: 10px;
      background: #2d7ff9;
    }
    
    /* Region body spacing */
    .t-Region-body {
      padding: 8px 10px !important;
    }
    
    /* Item containers */
    .t-Form-fieldContainer {
      margin-bottom: 14px;
    }
    
    /* Labels */
    .t-Form-label {
      font-size: 12px;
      font-weight: 600;
      color: #5b6b7f;
      margin-bottom: 6px;
    }
    
    /* Inputs */
    .t-Form-inputContainer input,
    .t-Form-inputContainer select,
    .t-Form-inputContainer textarea,
    .apex-item-text,
    .apex-item-select,
    .apex-item-textarea {
      border-radius: 10px !important;
      border: 1px solid #dbe3ee !important;
      background: #fbfcfe !important;
      min-height: 38px;
      box-shadow: none !important;
      transition: all 0.2s ease;
    }
    
    /* Focus state */
    .t-Form-inputContainer input:focus,
    .t-Form-inputContainer select:focus,
    .t-Form-inputContainer textarea:focus,
    .apex-item-text:focus,
    .apex-item-select:focus,
    .apex-item-textarea:focus {
      border-color: #2d7ff9 !important;
      background: #ffffff !important;
      box-shadow: 0 0 0 3px rgba(45, 127, 249, 0.10) !important;
    }
    
    /* Date picker / LOV buttons */
    .a-Button--popupLOV,
    .ui-datepicker-trigger,
    .t-Form-itemText--postButton button {
      border-radius: 10px !important;
      height: 38px !important;
    }
    
    /* Toolbar buttons top right */
    .t-Button,
    button.t-Button {
      border-radius: 10px !important;
      font-weight: 600;
      min-height: 38px;
      padding: 0 14px;
      box-shadow: none;
    }
    
    /* Primary button */
    .t-Button--hot {
      background: linear-gradient(135deg, #2d7ff9, #1f6fe5) !important;
      border: none !important;
    }
    
    /* Secondary button */
    .t-Button--simple {
      border: 1px solid #d7dfeb !important;
      background: #ffffff !important;
      color: #304050 !important;
    }
    
    /* Danger button */
    .t-Button--danger {
      background: #fff1f1 !important;
      border: 1px solid #f3c7c7 !important;
      color: #c62828 !important;
    }
    
    /* Profile picture region special styling */
    .profile-card .t-Region-body {
      text-align: center;
      padding-top: 24px;
    }
    
    /* Circular avatar */
    .profile-card img,
    .profile-card .emp-photo-preview img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      display: inline-block;
    }
    
    /* Employee code display area */
    .emp-code-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 14px;
      background: #f3f7ff;
      color: #1f5fbf;
      border: 1px solid #d7e5ff;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    
    /* Rich text editor area */
    .ck-editor__editable,
    .a-RichText-editor {
      min-height: 140px !important;
      border-radius: 10px !important;
    }
    
    /* Remove overly flat grey feeling */
    .t-Region.no-border,
    .t-Region--noBorder {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }
    
    .apex-col {
      padding-left: 2px !important;
      padding-right: 2px !important;
    }
    
    .apex-row {
      margin-left: -2px !important;
      margin-right: -2px !important;
    }
    
    .t-Region {
      margin-bottom: 6px !important;
    }
    
    .t-Region-header {
      padding: 8px 10px !important;
    }
    
    .t-Region-body {
      padding: 6px 8px !important;
    }
    
    .t-Form-fieldContainer {
      margin-bottom: 8px !important;
    }
    
    /* Reduce switch size */
    .t-Switch {
      transform: scale(0.75);
      transform-origin: left center;
    }
    
    /* Optional: reduce spacing */
    .t-Form-fieldContainer {
      margin-bottom: 6px !important;
    }

