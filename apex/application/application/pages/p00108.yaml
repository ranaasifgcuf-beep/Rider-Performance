- # ====== Region: Exception Queue =============================
  id: 17484776572097904
  identification: 
    name: Exception Queue
    title: Exception Queue <span class="t-Badge t-Badge--danger t-Badge--large">&P108_ABSCONDER_CNT.</span>
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select e.emp_id,
             e.emp_code,
             e.first_name || ' ' || e.last_name as full_name,
             e.agreed_project,
             e.agreed_city,
      
             e.current_status_code as current_status,
             e.current_status_name,
             e.status_badge_text,
      
             e.current_legal_code,
             e.current_legal_name,
      
             e.worker_type,
             e.supplier_name,
             e.last_project,
             e.last_city,
               '<span class="fa fa-check-circle text-success" aria-hidden="true"></span>' as ready_link,
             e.job_name,
               ac.current_bike_badge as current_bike,
             ac.asset_risk_badge   as asset_risk
      
      from vw_hr_employee_list e
      join vw_hr_emp_asset_control ac
        on ac.emp_id = e.emp_id
      
      where not exists (
              select 1
                from hr_assignments a
               where a.emp_id = e.emp_id
                 and a.end_dt is null
            )
      
        and upper(nvl(e.current_status_code,'PIPELINE')) in ('PIPELINE','OFFBOARD')
      
        and replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
              'ABSCONDING',
              'ABSCONDER'
            )
      
      order by e.emp_code;

