processes: 
- # ====== Process: FETCH_ACCIDENT_INFO ========================
  id: 30668482827737473
  identification: 
    name: FETCH_ACCIDENT_INFO
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select A.EMP_ID,
                 b.plate_no,
                 a.accident_dt,
                  a.repair_start_dt,
                 v.bike_status_name,
                 v.custody_type_name
            into :P316_EMP_ID,
                 :P316_PLATE_NO,
                 :P316_ACCIDENT_DT,
                 :P316_REPAIR_START_DT,
                 :P316_CURRENT_STATUS,
                 :P316_CURRENT_CUSTODY
            from fleet_bike_accidents a
            join fleet_bikes b
              on b.bike_id = a.bike_id
            left join vw_fleet_bike_current v
              on v.bike_id = a.bike_id
           where a.accident_id = :P316_ACCIDENT_ID;
