- # ====== Region: Change Status ACL List ======================
  id: 16089952623885419
  identification: 
    name: Change Status ACL List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ACL_ID,
             STATUS_CODE,
             ROLE_CODE,
             CAN_SET,
             IS_ACTIVE,
             case
        when is_active = 'Y' then
          '<span class="t-Badge t-Badge--success t-Badge--icon">
             <span class="fa fa-check-circle" aria-hidden="true"></span> Active
           </span>'
        else
          '<span class="t-Badge t-Badge--danger t-Badge--icon">
             <span class="fa fa-times-circle" aria-hidden="true"></span> Inactive
           </span>'
      end as is_active_display,
      case
        when can_set = 'Y' then
          '<span class="t-Badge t-Badge--info t-Badge--icon">
             <span class="fa fa-exchange" aria-hidden="true"></span> Allowed
           </span>'
        else
          '<span class="t-Badge t-Badge--warning t-Badge--icon">
             <span class="fa fa-lock" aria-hidden="true"></span> Locked
           </span>'
      end as can_change_display
        from HR_STATUS_ACL

