validations:
- # ====== Validation: Trade License Expiry After Issue ========
  id: 93000000000044
  identification:
    name: Trade License Expiry After Issue

  execution:
    sequence: 10

  validation:
    type: Expression
    language: PL/SQL
    pl/sql-expression: |
      :P954_TRADE_LIC_EXPIRY_DT is null
      or :P954_TRADE_LIC_ISSUE_DT is null
      or :P954_TRADE_LIC_EXPIRY_DT > :P954_TRADE_LIC_ISSUE_DT
    always-execute: false

  error:
    error-message: Trade License Expiry Date cannot be earlier than Issue Date.
    display-location: Inline with Field and in Notification

- # ====== Validation: Org Code Unique ==========================
  id: 93000000000045
  identification:
    name: Org Code Unique

  execution:
    sequence: 20

  validation:
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      declare
          l_cnt number;
      begin
          select count(*)
            into l_cnt
            from hr_orgs o
           where upper(o.org_code) = upper(:P954_ORG_CODE)
             and nvl(o.org_id, -1) <> nvl(:P954_ORG_ID, -1);

          return l_cnt = 0;
      end;
    always-execute: false

  error:
    error-message: Org Code already exists.
    display-location: Inline with Field and in Notification

