regions:
- # ====== Region: Groups =======================================
  id: 94000000000001
  identification:
    name: Groups
    title: <span class="fa fa-sitemap"></span> Groups (select one to see its Organizations) -- <a href="f?p=&APP_ID.:951:&SESSION.::&DEBUG.:::">Manage Groups</a>
    type: Interactive Report

  source:
    location: Local Database
    type: SQL Query
    sql-query: |
      select
        '<a href="' ||
        apex_page.get_url(
            p_items  => 'P953_GROUP_ID',
            p_values => g.group_id,
            p_reset_pagination => 'Yes'
        ) || '">' ||
        case when g.group_id = :P953_GROUP_ID
             then '<strong>' || g.group_name || '</strong>'
             else g.group_name
        end ||
        '</a>' as group_name,

        g.group_code,
        g.owner_name,

        case g.is_active
          when 'Y' then '<span class="t-Badge t-Badge--success">Active</span>'
          else '<span class="t-Badge t-Badge--danger">Inactive</span>'
        end as is_active,

        (select count(*) from hr_orgs o where o.group_id = g.group_id) as org_count

      from hr_groups g
      order by g.group_name;

  layout:
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance:
    template: Interactive Report
    template-options:
    - '#DEFAULT#'
    render-components: Above Content

  accessibility:
    use-landmark: true
    landmark-type: Template Default

  advanced:
    region-display-selector: true
    exclude-title-from-translation: false

  server-cache:
    caching: Disabled

  customization:
    customizable: Not Customizable By End Users

  attributes:
    id: 94000000000005
    link:
      link-column: Exclude Link Column

    pagination:
      type: Row Ranges X to Y
      display-position: Bottom - Right

    search-bar:
      include-search-bar: true
      search-field: true
      finder-drop-down: true
      reports-select-list: true
      rows-per-page-selector: false

    actions-menu:
      include-actions-menu: true

    download:
      formats:
      - CSV

- # ====== Region: Organizations =================================
  id: 94000000000002
  identification:
    name: Organizations
    title: <span class="fa fa-building"></span> Organizations
    type: Interactive Report

  source:
    location: Local Database
    type: SQL Query
    sql-query: |
      select
        '<a href="' ||
        apex_page.get_url(
            p_items  => 'P953_ORG_ID',
            p_values => o.org_id,
            p_reset_pagination => 'Yes'
        ) || '">' ||
        case when o.org_id = :P953_ORG_ID
             then '<strong>' || o.org_name || '</strong>'
             else o.org_name
        end ||
        '</a>' as org_name,

        o.org_code,
        o.org_type,
        p.org_name as parent_org_name,

        o.trade_lic_no,
        o.trade_lic_expiry_dt,
        case
          when o.trade_lic_expiry_dt is null then
            '<span class="t-Badge">No Date</span>'
          when o.trade_lic_expiry_dt < trunc(sysdate) then
            '<span class="t-Badge t-Badge--danger">Expired</span>'
          when o.trade_lic_expiry_dt <= trunc(sysdate) + 30 then
            '<span class="t-Badge t-Badge--warning">Near Expiry</span>'
          else
            '<span class="t-Badge t-Badge--success">Valid</span>'
        end as trade_lic_status,

        case o.is_main_unit
          when 'Y' then '<span class="t-Badge t-Badge--info">Main Unit</span>'
          else null
        end as main_unit_flag,

        case o.is_active
          when 'Y' then '<span class="t-Badge t-Badge--success">Active</span>'
          else '<span class="t-Badge t-Badge--danger">Inactive</span>'
        end as is_active,

        '<a href="' ||
        apex_page.get_url(
            p_page   => 954,
            p_items  => 'P954_ORG_ID',
            p_values => o.org_id,
            p_request => 'EDIT'
        ) || '"><span class="fa fa-pencil" title="Edit Organization"></span></a>' as edit_link,

        (select count(*) from hr_org_docs d where d.org_id = o.org_id) as doc_count

      from hr_orgs o
      left join hr_orgs p
        on p.org_id = o.parent_org_id
      where o.group_id = :P953_GROUP_ID
      order by o.org_name;

  layout:
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance:
    template: Interactive Report
    template-options:
    - '#DEFAULT#'
    render-components: Above Content

  accessibility:
    use-landmark: true
    landmark-type: Template Default

  advanced:
    region-display-selector: true
    exclude-title-from-translation: false

  server-cache:
    caching: Disabled

  customization:
    customizable: Not Customizable By End Users

  server-side-condition:
    type: Item is NOT NULL
    item: P953_GROUP_ID

  attributes:
    id: 94000000000006
    link:
      link-column: Exclude Link Column

    pagination:
      type: Row Ranges X to Y
      display-position: Bottom - Right

    search-bar:
      include-search-bar: true
      search-field: true
      finder-drop-down: true
      reports-select-list: true
      rows-per-page-selector: false

    actions-menu:
      include-actions-menu: true

    download:
      formats:
      - CSV

- # ====== Region: Documents ======================================
  id: 94000000000003
  identification:
    name: Documents
    title: <span class="fa fa-file-text"></span> Organization Documents
    type: Interactive Report

  source:
    location: Local Database
    type: SQL Query
    sql-query: |
      select org_doc_id,
             org_id,

             org_code,
             org_name,

             doc_type_code,
             doc_type_name as document,

             doc_no as document_number,

             issue_dt,
             expiry_dt,
             expiry_in_days,

             case expiry_status
                 when 'NO_EXPIRY' then
                     '<span class="t-Badge">No Expiry</span>'
                 when 'EXPIRED' then
                     '<span class="t-Badge t-Badge--danger">Expired</span>'
                 when 'EXPIRING_SOON' then
                     '<span class="t-Badge t-Badge--warning">Near Expiry</span>'
                 when 'VALID' then
                     '<span class="t-Badge t-Badge--success">Active</span>'
                 else
                     '<span class="t-Badge">' || apex_escape.html(expiry_status) || '</span>'
             end as expiry_status,

             case is_current
                 when 'Y' then '<span class="t-Badge t-Badge--success">Yes</span>'
                 else '<span class="t-Badge">No</span>'
             end as is_current,

             case is_active
                 when 'Y' then '<span class="t-Badge t-Badge--success">Active</span>'
                 else '<span class="t-Badge t-Badge--danger">Inactive</span>'
             end as is_active,

             remarks,

             '<a href="' ||
             apex_page.get_url(
                 p_page   => 955,
                 p_items  => 'P955_ORG_DOC_ID',
                 p_values => org_doc_id,
                 p_request => 'EDIT'
             ) || '"><span class="fa fa-pencil" title="Edit Document"></span></a>' as edit_link

        from vw_hr_org_docs
       where (:P953_ORG_ID is null or org_id = :P953_ORG_ID)
       order by org_name, doc_type_name, issue_dt desc;

  layout:
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance:
    template: Interactive Report
    template-options:
    - '#DEFAULT#'
    render-components: Above Content

  accessibility:
