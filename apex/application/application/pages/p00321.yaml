- # ====== Region: Charge Installment List =====================
  id: 30109949428516026
  identification: 
    name: Charge Installment List
    title: Charge Installment List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          i.installment_id,
      
          case
            when i.status_code in ('PENDING','ON_HOLD')
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 323,
                  p_items  => 'P323_INSTALLMENT_ID',
                  p_values => i.installment_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-cog" title="Installment Actions"></span></a>'
            else null
          end as action_link,
      
          i.installment_no,
          i.due_dt,
          i.amount,
      
          case i.status_code
            when 'PENDING' then '<span class="t-Badge t-Badge--warning">PENDING</span>'
            when 'PROCESSED' then '<span class="t-Badge t-Badge--success">PROCESSED</span>'
            when 'ON_HOLD' then '<span class="t-Badge t-Badge--info">ON HOLD</span>'
            when 'WAIVED' then '<span class="t-Badge t-Badge--default">WAIVED</span>'
            when 'BAD_DEBT' then '<span class="t-Badge t-Badge--danger">BAD DEBT</span>'
            when 'CANCELLED' then '<span class="t-Badge t-Badge--danger">CANCELLED</span>'
            else '<span class="t-Badge t-Badge--default">' || i.status_code || '</span>'
          end as status_badge,
      
          i.status_code,
          i.hold_from_dt,
          i.hold_to_dt,
          i.payroll_run_ref,
          i.processed_ts,
          i.remarks,
          i.created_by,
          i.created_dt
      from hr_emp_charge_installments i
      where i.emp_charge_id = :P321_EMP_CHARGE_ID
      order by i.installment_no

