    pl/sql-code: |
      begin
          update hr_sim_assignments
             set return_dt        = nvl(:P330_RETURN_DT, cast(systimestamp at time zone 'Asia/Dubai' as date)),
                 return_reason    = :P330_RETURN_REASON,
                 return_condition = :P330_RETURN_CONDITION,
                 return_remarks   = :P330_RETURN_REMARKS
           where emp_id = :P330_EMP_ID
             and sim_id = :P330_CURRENT_SIM_ID
             and return_dt is null;
      
          if sql%rowcount = 0 then
