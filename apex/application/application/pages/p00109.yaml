    pl/sql-code: |
      declare
        l_project_id number;
      begin
      
      IF :P109_ASG_ID IS NOT NULL THEN 
        select project_id
          into l_project_id
          from hr_assignments
         where asg_id = :P109_ASG_ID;
      
        if nvl(sec_pkg.is_project_allowed(l_project_id),0) <> 1 then
           raise_application_error(-20001, 'You do not have access to this project.');
        end if;
      
        END IF;
