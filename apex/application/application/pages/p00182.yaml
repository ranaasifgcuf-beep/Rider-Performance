regions: 
- # ====== Region: Summary =====================================
  id: 38206551339256234
  identification: 
    name: Summary
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_total          number := 0;
          l_valid          number := 0;
          l_in_process     number := 0;
          l_risky          number := 0;
          l_inside_wps     number := 0;
          l_outside_wps    number := 0;
          l_html           clob;
      begin
          select count(*),
                 sum(case when legal_status = 'VALID' then 1 else 0 end),
                 sum(case when legal_status = 'IN_PROCESS' then 1 else 0 end),
                 sum(case when legal_status in ('ABSCONDING','EMPLOYEE_COMPLAINT','CANCELLED_MOHRE','CANCELLED_ICP','CANCELLED','EXPIRED') then 1 else 0 end),
                 sum(case when default_wps_clearing_mode = 'INTERNAL_WPS' then 1 else 0 end),
                 sum(case when default_wps_clearing_mode = 'OUTSIDE_CLEARING' then 1 else 0 end)
            into l_total,
                 l_valid,
                 l_in_process,
                 l_risky,
                 l_inside_wps,
                 l_outside_wps
            from hr_emp_legal_profile_v;
      
          l_html :=
          '<div class="legal-kpi-grid">' ||
      
          '<div class="legal-kpi-card">' ||
          '<div class="legal-kpi-label">Total Profiles</div>' ||
          '<div class="legal-kpi-value">' || nvl(l_total,0) || '</div>' ||
          '<div class="legal-kpi-sub">Employees with profile</div>' ||
          '</div>' ||
      
          '<div class="legal-kpi-card success">' ||
          '<div class="legal-kpi-label">Valid Legal Status</div>' ||
          '<div class="legal-kpi-value">' || nvl(l_valid,0) || '</div>' ||
          '<div class="legal-kpi-sub">Ready legally</div>' ||
          '</div>' ||
      
          '<div class="legal-kpi-card warning">' ||
          '<div class="legal-kpi-label">In Process</div>' ||
          '<div class="legal-kpi-value">' || nvl(l_in_process,0) || '</div>' ||
          '<div class="legal-kpi-sub">Visa/legal process</div>' ||
          '</div>' ||
      
          '<div class="legal-kpi-card danger">' ||
          '<div class="legal-kpi-label">Risk / Exception</div>' ||
          '<div class="legal-kpi-value">' || nvl(l_risky,0) || '</div>' ||
          '<div class="legal-kpi-sub">Absconding/cancelled/expired</div>' ||
          '</div>' ||
      
          '<div class="legal-kpi-card success">' ||
          '<div class="legal-kpi-label">Inside WPS</div>' ||
          '<div class="legal-kpi-value">' || nvl(l_inside_wps,0) || '</div>' ||
          '<div class="legal-kpi-sub">Default internal WPS</div>' ||
          '</div>' ||
      
          '<div class="legal-kpi-card warning">' ||
          '<div class="legal-kpi-label">Outside WPS</div>' ||
          '<div class="legal-kpi-value">' || nvl(l_outside_wps,0) || '</div>' ||
          '<div class="legal-kpi-sub">Default outside clearing</div>' ||
          '</div>' ||
      
          '</div>';
      
          return l_html;
      end;

