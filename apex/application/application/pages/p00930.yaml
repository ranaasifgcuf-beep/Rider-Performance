- # ====== Dynamic Action: DA_ROLE_CHANGE ======================
  id: 9837895349147114
  identification: 
    name: DA_ROLE_CHANGE

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P930_ROLE_ID

  actions: 
  - # ====== Action: Execute Server-side Code ====================
    id: 9837969481147115
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        declare
          l_list varchar2(32767);
        begin
          select listagg(rp.perm_id, ':') within group (order by rp.perm_id)
            into l_list
            from sec_role_perms rp
           where rp.role_id = :P930_ROLE_ID;
        
          :P930_PERM_IDS := l_list;
        end;
        
      items-to-submit: 
      - P930_ROLE_ID
      items-to-return: 
      - P930_PERM_IDS
      suppress-change-event: false

    execution: 
