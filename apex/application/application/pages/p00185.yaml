validations: 
- # ====== Validation: Validate Status Code Format =============
  id: 39252093166729116
  identification: 
    name: Validate Status Code Format

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :STATUS_CODE <> upper(:STATUS_CODE) then
              return 'Status Code must be uppercase.';
          end if;
      
          if instr(:STATUS_CODE, ' ') > 0 then
              return 'Status Code cannot contain spaces. Use underscore instead.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

