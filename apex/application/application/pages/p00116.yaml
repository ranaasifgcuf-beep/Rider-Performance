  id: 16546431229131748
  identification: 
    name: Set Status

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P116_CANCEL_DT

  client-side-condition: 
    type: Item != Value
    item: P116_STATUS_CODE
    value: CANCELLED

