- # ====== Region: Expiring Soon ===============================
  id: 37592760326478635
  identification: 
    name: Expiring Soon
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select emp_code,
             employee_name,
             doc_type_name document,
             doc_no document_number,
             to_char(issue_dt, 'DD-MON-YYYY') issue_date,
             to_char(expiry_dt, 'DD-MON-YYYY') expiry_date,
             expiry_in_days,
             case
                 when expiry_in_days <= 7 then
                     '<span class="t-Badge t-Badge--danger">Critical</span>'
                 else
                     '<span class="t-Badge t-Badge--warning">Near Expiry</span>'
             end expiry_status,
             case
                 when file_name is not null or file_ref is not null then
                     '<span class="t-Badge t-Badge--success">Attached</span>'
                 else
                     '<span class="t-Badge t-Badge--warning">No File</span>'
             end file_status,
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 105,
                 p_items       => 'P105_EMP_ID',
                 p_values      => emp_id,
                 p_clear_cache => '105'
             ) ||
             '" title="Open Employee Documents"><span class="fa fa-folder-open"></span></a>' open_docs
      from hr_emp_docs_v
      where is_current_record = 'Y'
        and expiry_dt is not null
        and trunc(expiry_dt) >= trunc(cast(systimestamp at time zone 'Asia/Dubai' as date))
        and trunc(expiry_dt) <= trunc(cast(systimestamp at time zone 'Asia/Dubai' as date)) + nvl(to_number(:P181_DAYS),30)
        and (:P181_DOC_GROUP is null or doc_group = :P181_DOC_GROUP)
        and (:P181_DOC_TYPE is null or doc_type = :P181_DOC_TYPE)
      order by expiry_dt
    page-items-to-submit: 
    - P181_DAYS
    - P181_DOC_GROUP
    - P181_DOC_TYPE

