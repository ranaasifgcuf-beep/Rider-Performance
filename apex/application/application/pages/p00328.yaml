  list-of-values: 
    type: SQL Query
    sql-query: |
      select d, r
      from (
          select 'New Onboarding'              d, 'NEW_ONBOARDING'              r, 10 seq_no from dual union all
          select 'Additional SIM'              d, 'ADDITIONAL_SIM'              r, 20 seq_no from dual union all
          select 'Replacement - Lost'          d, 'REPLACEMENT_LOST'            r, 30 seq_no from dual union all
          select 'Replacement - Damaged'       d, 'REPLACEMENT_DAMAGED'         r, 40 seq_no from dual union all
          select 'Replacement - Blocked'       d, 'REPLACEMENT_BLOCKED'         r, 50 seq_no from dual union all
          select 'Replacement - Project Change'd, 'REPLACEMENT_PROJECT_CHANGE'  r, 60 seq_no from dual union all
          select 'Temporary Replacement'       d, 'TEMPORARY_REPLACEMENT'       r, 70 seq_no from dual union all
          select 'Return Request'              d, 'RETURN_REQUEST'              r, 80 seq_no from dual union all
          select 'Other'                       d, 'OTHER'                       r, 99 seq_no from dual
      )
      order by seq_no;
    display-extra-values: true
    display-null-value: true

