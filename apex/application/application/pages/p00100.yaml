    id: 16925952966220647
    identification: 
      name: EMP_ID

    layout: 
      sequence: 10

    source: 
      type: Database Column
      database-column: EMP_ID
      data-type: NUMBER
      primary-key: true

    appearance: 
      group: false

  - # ====== Column: PHOTO_BLOB ==================================
    id: 17210285877776222
    identification: 
      name: PHOTO_BLOB

    layout: 
      sequence: 260

    source: 
      type: Database Column
      database-column: PHOTO_BLOB
      data-type: BLOB

  - # ====== Column: PHOTO_FILENAME ==============================
    id: 17210379089776223
    identification: 
      name: PHOTO_FILENAME

    layout: 
      sequence: 270

    source: 
      type: Database Column
      database-column: PHOTO_FILENAME
      data-type: VARCHAR2
      primary-key: false

    appearance: 
      group: false

  - # ====== Column: PHOTO_MIME_TYPE =============================
    id: 17210432554776224
    identification: 
      name: PHOTO_MIME_TYPE

    layout: 
      sequence: 280

    source: 
      type: Database Column
      database-column: PHOTO_MIME_TYPE
      data-type: VARCHAR2
      primary-key: false

    appearance: 
      group: false

  - # ====== Column: PHOTO_CHARSET ===============================
    id: 17210588969776225
    identification: 
      name: PHOTO_CHARSET

    layout: 
      sequence: 290

    source: 
      type: Database Column
      database-column: PHOTO_CHARSET
      data-type: VARCHAR2
      primary-key: false

    appearance: 
      group: false

  - # ====== Column: PHOTO_LASTUPD ===============================
    id: 17210624728776226
    identification: 
      name: PHOTO_LASTUPD

    layout: 
      sequence: 300

    source: 
      type: Database Column
      database-column: PHOTO_LASTUPD
      data-type: TIMESTAMP
      primary-key: false

    appearance: 
      group: false

- # ====== Region: Employee Hero ===============================
  id: 17211270145776232
  identification: 
    name: Employee Hero
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          '<div class="emp-hero">'
       ||   '<div class="emp-hero__layout">'
      
       ||     '<div class="emp-hero__left">'
       ||       '<div class="emp-hero__name">' || apex_escape.html(full_name) || '</div>'
      
       ||       '<div class="emp-hero__chips">'
       ||         '<span class="emp-chip"><span class="emp-chip__label">Code</span><span class="emp-chip__value">' || apex_escape.html(nvl(emp_code,'-')) || '</span></span>'
       ||         '<span class="emp-chip"><span class="emp-chip__label">Nationality</span><span class="emp-chip__value">' || apex_escape.html(nvl(nationality_name,'-')) || '</span></span>'
       ||         '<span class="emp-chip"><span class="emp-chip__label">Type</span><span class="emp-chip__value">' || apex_escape.html(nvl(worker_type,'-')) || '</span></span>'
       ||         '<span class="emp-chip"><span class="emp-chip__label">Project</span><span class="emp-chip__value">' || apex_escape.html(nvl(agreed_project,'-')) || '</span></span>'
       ||         '<span class="emp-chip"><span class="emp-chip__label">City</span><span class="emp-chip__value">' || apex_escape.html(nvl(agreed_city,'-')) || '</span></span>'
       ||         status_chip
       ||         legal_status_chip
       ||       '</div>'
      
       ||       '<div class="emp-hero__info">'
       ||         '<div class="emp-info"><span class="emp-info__label">Mobile:</span><span class="emp-info__value">' || apex_escape.html(nvl(mobile,'-')) || '</span></div>'
       ||         '<div class="emp-info"><span class="emp-info__label">Email:</span><span class="emp-info__value">' || apex_escape.html(nvl(email,'-')) || '</span></div>'
       ||         '<div class="emp-info"><span class="emp-info__label">Join Date:</span><span class="emp-info__value">' || apex_escape.html(nvl(join_date,'-')) || '</span></div>'
       ||         '<div class="emp-info"><span class="emp-info__label">Pay Method:</span><span class="emp-info__value">' || apex_escape.html(nvl(pay_mode_name,'-')) || '</span></div>'
       ||       '</div>'
      
       ||       '<div class="emp-hero__docs">'
       ||         passport_badge || ' '
       ||         eid_badge || ' '
       ||         dl_badge || ' '
       ||         hins_badge || ' '
       ||         wcins_badge
       ||       '</div>'
       ||     '</div>'
      
       ||     '<div class="emp-hero__right">'
       ||       '<div class="emp-sidebox">'
       ||         '<div class="emp-sidebox__title">Current Snapshot</div>'
       ||         '<div class="emp-sidebox__row"><span>Project</span><span>' || apex_escape.html(nvl(display_current_project,'-')) || '</span></div>'
       ||         '<div class="emp-sidebox__row"><span>City</span><span>' || apex_escape.html(nvl(display_current_city,'-')) || '</span></div>'
       ||         '<div class="emp-sidebox__row"><span>Legal</span><span>' || apex_escape.html(nvl(current_legal_name,'Not Set')) || '</span></div>'
       ||         '<div class="emp-sidebox__row"><span>Custody</span><span>' || nvl(custody_badge,'-') || '</span></div>'
       ||       '</div>'
       ||     '</div>'
      
       ||   '</div>'
       || '</div>' as profile_html
      
      from (
          select e.emp_id,
                 e.emp_code,
                 trim(e.first_name || ' ' || nvl(e.last_name,'')) as full_name,
                 e.mobile,
                 e.email,
                 to_char(e.join_date,'DD-MON-YYYY') as join_date,
                 e.worker_type,
                 e.agreed_project,
                 e.agreed_city,
                 e.nationality as nationality_name,
                 e.current_status_code,
                 e.current_status_name,
                 e.current_legal_code,
                 e.current_legal_name,
                 e.display_current_project,
                 e.display_current_city,
                 e.pay_mode_name,
                 e.custody_badge,
      
                 case
                     when upper(nvl(e.current_status_code,'X')) = 'ACTIVE' then
                         '<span class="emp-chip emp-chip--success">' ||
                         '<span class="emp-chip__label">Status</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_status_name,'Active')) || '</span>' ||
                         '</span>'
      
                     when upper(nvl(e.current_status_code,'X')) in (
                         'PIPELINE',
                         'IN_PROCESS',
                         'ONBOARDING',
                         'VACATION',
                         'OFFBOARD_QUEUE'
                     ) then
                         '<span class="emp-chip emp-chip--warning">' ||
                         '<span class="emp-chip__label">Status</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_status_name,'-')) || '</span>' ||
                         '</span>'
      
                     when upper(nvl(e.current_status_code,'X')) in (
                         'ON_HOLD',
                         'ABSCONDER',
                         'TERMINATED'
                     ) then
                         '<span class="emp-chip emp-chip--danger">' ||
                         '<span class="emp-chip__label">Status</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_status_name,'-')) || '</span>' ||
                         '</span>'
      
                     else
                         '<span class="emp-chip">' ||
                         '<span class="emp-chip__label">Status</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_status_name,'-')) || '</span>' ||
                         '</span>'
                 end as status_chip,
      
                 case
                     when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') = 'VALID' then
                         '<span class="emp-chip emp-chip--success">' ||
                         '<span class="emp-chip__label">Legal</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_legal_name,'Valid')) || '</span>' ||
                         '</span>'
      
                     when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                         'IN_PROCESS',
                         'ON_HOLD',
                         'UNKNOWN'
                     ) then
                         '<span class="emp-chip emp-chip--warning">' ||
                         '<span class="emp-chip__label">Legal</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_legal_name,'Not Set')) || '</span>' ||
                         '</span>'
      
                     when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                         'EXPIRED',
                         'ABSCONDING',
                         'EMPLOYEE_COMPLAINT',
                         'CANCELLED_MOHRE',
                         'CANCELLED_ICP',
                         'CANCELLED'
                     ) then
                         '<span class="emp-chip emp-chip--danger">' ||
                         '<span class="emp-chip__label">Legal</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_legal_name,'Risk')) || '</span>' ||
                         '</span>'
      
                     when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') = 'EXITED' then
                         '<span class="emp-chip">' ||
                         '<span class="emp-chip__label">Legal</span>' ||
                         '<span class="emp-chip__value">' || apex_escape.html(nvl(e.current_legal_name,'Exited')) || '</span>' ||
                         '</span>'
      
                     else
                         '<span class="emp-chip emp-chip--warning">' ||
                         '<span class="emp-chip__label">Legal</span>' ||
                         '<span class="emp-chip__value">Not Set</span>' ||
                         '</span>'
                 end as legal_status_chip,
      
                 case
                     when exists (
                          select 1
                            from hr_emp_docs d
                           where d.emp_id = e.emp_id
                             and upper(d.doc_type) = 'PASSPORT'
                             and nvl(d.is_current_record,'Y') = 'Y'
                             and d.doc_no is not null
                     )
                     then '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> Passport</span>'
                     else '<span class="doc-ind no"><span class="fa fa-times-circle"></span> Passport</span>'
                 end as passport_badge,
      
                 case
                     when exists (
                          select 1
                            from hr_emp_docs d
                           where d.emp_id = e.emp_id
                             and upper(d.doc_type) = 'EMIRATES_ID'
                             and nvl(d.is_current_record,'Y') = 'Y'
                             and d.doc_no is not null
                     )
                     then '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> EID</span>'
                     else '<span class="doc-ind no"><span class="fa fa-times-circle"></span> EID</span>'
                 end as eid_badge,
      
                 case
                     when exists (
                          select 1
                            from hr_emp_docs d
                           where d.emp_id = e.emp_id
                             and upper(d.doc_type) in ('DL','DRIVING LICENSE','DRIVING_LICENSE')
                             and nvl(d.is_current_record,'Y') = 'Y'
                             and d.doc_no is not null
                     )
                     then '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> Driving License</span>'
                     else '<span class="doc-ind no"><span class="fa fa-times-circle"></span> Driving License</span>'
                 end as dl_badge,
      
                 case
                     when upper(nvl(e.insurrance_bucket_text,'PENDING')) not in ('EXPIRED','CANCELLED','PENDING') then
                         '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> Health Insurance</span>'
                     else
                         '<span class="doc-ind no"><span class="fa fa-times-circle"></span> Health Insurance</span>'
                 end as hins_badge,
      
                 case
                     when upper(nvl(e.wc_ins_bucket_text,'PENDING')) not in ('EXPIRED','CANCELLED','PENDING') then
                         '<span class="doc-ind ok"><span class="fa fa-check-circle"></span> WC Insurance</span>'
                     else
                         '<span class="doc-ind no"><span class="fa fa-times-circle"></span> WC Insurance</span>'
                 end as wcins_badge
      
            from vw_hr_employee_list e
           where e.emp_id = :P100_EMP_ID
      );

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: false
    column: Automatic
    new-column: true
    column-span: 10

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--removeHeader js-removeLandmark
    - t-Region--noBorder
    - t-Region--scrollBody
    - margin-top-none
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: emp-profile-region
    region-display-selector: false
    exclude-title-from-translation: false

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    layout: 
      number-of-rows-type: Static Value
      number-of-rows: 15

    appearance: 
      template-type: Theme
      template: Standard
      template-options: 
      - '#DEFAULT#'
      - t-Report--stretch
      - t-Report--altRowsDefault
      - t-Report--rowHighlight
      - t-Report--noBorders
      - t-Report--hideNoPagination

    pagination: 
      type: No Pagination (Show All Rows)
      partial-page-refresh: true

    performance: 
      lazy-loading: false

    break-formatting: 
      break-columns: No Break

    advanced: 
      strip-html: false
      sort-nulls: Last

    heading: 
      type: Custom Headings

    download: 
      csv-export-enabled: false

    printing: 
      enabled: false

  columns: 
  - # ====== Column: PROFILE_HTML ================================
    id: 17211667177776236
    identification: 
      column-name: PROFILE_HTML
      type: Plain Text

    heading: 
      alignment: start

    layout: 
      sequence: 10
      column-alignment: start

    accessibility: 
      value-identifies-row: false

    sorting: 
      sortable: true

    export-/-printing: 
      include-in-export-/-print: true

    advanced: 
      compute-sum: false

    ui-defaults-reference: 
      table-owner: Parsing Schema

    security: 
      escape-special-characters: false

