  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select SUPPLIER_ID,
             SUPPLIER_NAME,
             TRN_NO,
             CONTACT_PERSON,
             MOBILE,
             EMAIL,
             IS_ACTIVE,
             case
          when is_active = 'Y' then
            '<span class="t-Badge t-Badge--success">Active</span>'
          else
            '<span class="t-Badge t-Badge--danger">Inactive</span>'
        end as is_active_disp
        from FIN_SUPPLIERS

