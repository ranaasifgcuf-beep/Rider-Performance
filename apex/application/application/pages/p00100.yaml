- # ====== Region: Assignments =================================
  id: 17237394128626619
  identification: 
    name: Assignments
    title: Assignments
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select a.asg_id,
             p.project_name,
             c.city_name,
             a.start_dt,
             a.end_dt,
             a.status,
             a.remarks,
             a.created_by,
             a.created_dt
      from hr_assignments a
      left join hr_projects p
        on p.project_id = a.project_id
      left join ref_cities c
        on c.city_id = a.city_id
      where a.emp_id = :P100_EMP_ID
      order by a.start_dt desc, a.asg_id desc

  layout: 
    sequence: 60
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
