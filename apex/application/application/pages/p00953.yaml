- # ====== Region: Organizations ===============================
  id: 33206233117488608
  identification: 
    name: Organizations
    title: Organizations
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select o.org_id,
             g.group_name,
             o.org_code,
             o.org_name,
             o.org_type,
             p.org_code parent_org_code,
             p.org_name parent_org_name,
             o.trade_lic_no,
             o.trade_lic_expiry_dt,
             o.mol_code,
             o.trn_no,
             c.city_name,
             o.is_active,
             case 
               when o.is_active = 'Y' then
                 '<span class="t-Badge t-Badge--success">Active</span>'
               else
                 '<span class="t-Badge t-Badge--danger">Inactive</span>'
             end as active_badge,
             case
               when o.trade_lic_expiry_dt is null then
                 '<span class="t-Badge">No Expiry</span>'
               when o.trade_lic_expiry_dt < trunc(sysdate) then
                 '<span class="t-Badge t-Badge--danger">Expired</span>'
               when o.trade_lic_expiry_dt <= trunc(sysdate) + 30 then
                 '<span class="t-Badge t-Badge--warning">Expiring Soon</span>'
               else
                 '<span class="t-Badge t-Badge--success">Valid</span>'
             end as license_status,
      
             '<span class="fa fa-eye" title="Open Organization"></span>' as open_link
      from hr_orgs o
      left join hr_groups g
             on g.group_id = o.group_id
      left join hr_orgs p
             on p.org_id = o.parent_org_id
      left join ref_cities c
             on c.city_id = o.city_id
      where (:P953_GROUP_ID = 0 or o.group_id = :P953_GROUP_ID)
        and (:P953_ORG_TYPE = '%' or o.org_type = :P953_ORG_TYPE)
        and (:P953_IS_ACTIVE = '%' or o.is_active = :P953_IS_ACTIVE)
        and (
              :P953_SEARCH is null
              or (upper(o.org_code) like '%' || upper(:P953_SEARCH) || '%'
              or upper(o.org_name) like '%' || upper(:P953_SEARCH) || '%'
              or upper(o.trade_lic_no) like '%' || upper(:P953_SEARCH) || '%'
              or upper(o.mol_code) like '%' || upper(:P953_SEARCH) || '%'
              or upper(o.trn_no) like '%' || upper(:P953_SEARCH) || '%')
            )
      order by g.group_name, o.org_code
    page-items-to-submit: 
    - P953_GROUP_ID
    - P953_ORG_TYPE
    - P953_IS_ACTIVE
    - P953_SEARCH

