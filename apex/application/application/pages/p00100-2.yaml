css: 
  inline: |
    #emp_avatar .t-Avatar img {
        border-radius: 50%;         
        /*border: 3px solid #2c7be5;*/
        padding: 20px 20px;
        background: #fff;
    }
    
    .emp-hero{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:20px 24px;
      box-shadow:0 4px 14px rgba(0,0,0,.05);
    }
    
    .emp-hero__name{
      font-size:26px;
      font-weight:800;
      color:#0f172a;
      margin-bottom:12px;
    }
    
    .emp-hero__chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
    }
    
    .emp-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:999px;
      padding:6px 12px;
      font-size:12px;
    }
    
    .emp-chip__label{
      color:#6b7280;
      font-weight:600;
    }
    
    .emp-chip__value{
      color:#111827;
      font-weight:700;
    }
    
    /* STATUS COLORS */
    .emp-chip--success{
      background:#ecfdf5;
      border:1px solid #bbf7d0;
      color:#065f46;
    }
    
    .emp-chip--warning{
      background:#fffbeb;
      border:1px solid #fde68a;
      color:#92400e;
    }
    
    .emp-chip--danger{
      background:#fef2f2;
      border:1px solid #fecaca;
      color:#991b1b;
    }
    
    .emp-hero__info{
      display:flex;
      flex-wrap:wrap;
      gap:24px;
      margin-bottom:12px;
    }
    
    .emp-info{
      display:flex;
      gap:6px;
      font-size:14px;
    }
    
    .emp-info__label{
      color:#6b7280;
      font-weight:600;
    }
    
    .emp-info__value{
      color:#111827;
      font-weight:700;
    }
    
    .emp-hero__docs{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-top:6px;
    }
    
    /* DOCUMENT ICON COLORS */
    .doc-ind{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:14px;
      font-weight:600;
    }
    
    .doc-ind.ok{
      color:#15803d;
    }
    
    .doc-ind.no{
      color:#b91c1c;
    }
    
    .doc-ind .fa{
      font-size:16px;
    }
    
    /* parent row */
    .snap-row{
      margin-top:12px;
    }
    
    /* each card region column */
    .snap-col{
      padding-left:6px !important;
      padding-right:6px !important;
      margin-bottom:0 !important;
    }
    
    /* remove extra apex region padding/background */
    .snap-col.t-Region,
    .snap-col .t-Region{
      background:transparent !important;
      border:none !important;
      box-shadow:none !important;
    }
    
    .snap-col .t-Region-header{
      display:none !important;
    }
    
    .snap-col .t-Region-bodyWrap,
    .snap-col .t-Region-body{
      padding:0 !important;
    }
    
    /* main card */
    .snap-card{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:18px 18px;
      box-shadow:0 4px 14px rgba(0,0,0,.05);
      min-height:220px;
      height:100%;
      display:flex;
      flex-direction:column;
    }
    
    /* titles */
    .snap-card__title{
      font-size:12px;
      font-weight:700;
      color:#64748b;
      text-transform:uppercase;
      letter-spacing:.5px;
      margin-bottom:18px;
    }
    
    /* main text */
    .snap-card__main{
      font-size:20px;
      font-weight:800;
      color:#0f172a;
      margin-bottom:12px;
      line-height:1.2;
    }
    
    /* sub text */
    .snap-card__sub{
      font-size:13px;
      color:#334155;
      margin-bottom:10px;
      line-height:1.45;
    }
    
    /* footer pinned lower */
    .snap-card__foot{
      font-size:12px;
      color:#64748b;
      margin-top:auto;
      padding-top:10px;
    }
    
    /* spacing for badges inside sub lines */
    .snap-card__sub .t-Badge{
      margin-left:6px;
    }
    
    /* top colors per card */
    .snap-assignment .snap-card{
      border-top:4px solid #2563eb;
    }
    
    .snap-pay .snap-card{
      border-top:4px solid #16a34a;
    }
    
    .snap-insurance .snap-card{
      border-top:4px solid #f59e0b;
    }
    
    .snap-custody .snap-card{
      border-top:4px solid #dc2626;
    }
    
