    - # ====== Series: Fleet Statis ================================
      id: 30753536225815229
      identification: 
        name: Fleet Statis

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select
                 bike_status_name as label,
                 count(*)         as value
          from vw_fleet_bike_current
          where is_active = 'Y'
          group by bike_status_name,
                   bike_status_code
          order by case upper(bike_status_code)
                        when 'ASSIGNED'  then 1
                        when 'AVAILABLE' then 2
                        when 'IMPOUND'   then 3
                        when 'ACCIDENT'  then 4
                        when 'REPAIR'    then 5
                        else 99
                   end;

      order-by: 
        type: None

      column-mapping: 
        series-name: LABEL
        label: LABEL
        value: VALUE

      label: 
        show: true
        position: Center
        display-as: Label - Value

