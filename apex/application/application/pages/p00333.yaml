validations: 
- # ====== Validation: Supplier Required =======================
  id: 43013584103045449
  identification: 
    name: Supplier Required

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P333_OWNERSHIP_TYPE = 'SUPPLIER'
             and :P333_OWNER_SUPPLIER_ID is null then
              return 'Owner Supplier is required for supplier/aggregator SIM.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

- # ====== Validation: External Owner Required =================
  id: 43013638245045450
  identification: 
    name: External Owner Required

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P333_OWNERSHIP_TYPE in ('CLIENT','THIRD_PARTY','OTHER')
             and :P333_EXTERNAL_OWNER_NAME is null then
              return 'External owner name is required for this ownership type.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

- # ====== Validation: Mobile No Required ======================
  id: 43070120909428301
  identification: 
    name: Mobile No Required

  execution: 
    sequence: 30

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P333_MOBILE_NO is null then
              return 'Mobile number is required.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

- # ====== Validation: Validate No =============================
  id: 43071440442428314
  identification: 
    name: Validate No

  execution: 
    sequence: 40

  validation: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: |
      REGEXP_LIKE(
          REGEXP_REPLACE(:P333_MOBILE_NO, '[^0-9]', ''),
          '^05[0-9]{8}$'
      )
    always-execute: false

  error: 
    error-message: Enter a valid UAE mobile number in the format 0501234567.
    display-location: Inline with Field and in Notification
    associated-item: P333_MOBILE_NO # 43045989196367503

