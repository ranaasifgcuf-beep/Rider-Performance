- # ====== Region: Document Snapshot ===========================
  id: 38207106206256240
  identification: 
    name: Document Snapshot
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select 'Passport' document,
             passport_no document_number,
             to_char(passport_issue_dt, 'DD-MON-YYYY') issue_date,
             to_char(passport_expiry_dt, 'DD-MON-YYYY') expiry_date,
             passport_expiry_days expiry_days
      from hr_emp_legal_profile_v
      where legal_profile_id = :P183_LEGAL_PROFILE_ID
      
      union all
      
      select 'Emirates ID',
             emirates_id_no,
             to_char(emirates_id_issue_dt, 'DD-MON-YYYY'),
             to_char(emirates_id_expiry_dt, 'DD-MON-YYYY'),
             eid_expiry_days
      from hr_emp_legal_profile_v
      where legal_profile_id = :P183_LEGAL_PROFILE_ID
      
      union all
      
      select 'Visa',
             visa_no,
             to_char(visa_issue_dt, 'DD-MON-YYYY'),
             to_char(visa_expiry_dt, 'DD-MON-YYYY'),
             visa_expiry_days
      from hr_emp_legal_profile_v
      where legal_profile_id = :P183_LEGAL_PROFILE_ID
      
      union all
      
      select 'Labour Card',
             labour_card_no,
             to_char(labour_card_issue_dt, 'DD-MON-YYYY'),
             to_char(labour_card_expiry_dt, 'DD-MON-YYYY'),
             labour_card_expiry_days
      from hr_emp_legal_profile_v
      where legal_profile_id = :P183_LEGAL_PROFILE_ID;

