- # ====== Region: Action Log ==================================
  id: 37244762508914227
  identification: 
    name: Action Log
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select l.log_id,
             r.approval_id,
             case r.module_code
                 when 'LOAN_MASTER' then 'Loan Creation'
                 when 'LOAN_TXN' then 'Loan Transaction'
                 else r.module_code
             end approval_type,
             r.approval_subject,
             l.action_code,
             l.action_by,
             to_char(l.action_dt, 'DD-MON-YYYY HH24:MI') action_dt,
             l.comments
      from hr_approval_action_log l
      join hr_approval_requests r
        on r.approval_id = l.approval_id
      where (
              :P175_LOAN_TXN_ID is null
              and r.module_code = 'LOAN_MASTER'
              and r.record_pk = :P175_LOAN_ID
            )
         or (
              r.module_code = 'LOAN_TXN'
              and exists (
                  select 1
                    from hr_emp_loan_txns t
                   where t.loan_txn_id = r.record_pk
                     and t.loan_id = :P175_LOAN_ID
                     and (
                          :P175_LOAN_TXN_ID is null
                          or t.loan_txn_id = :P175_LOAN_TXN_ID
                     )
              )
            )
      order by l.action_dt desc, l.log_id desc;

