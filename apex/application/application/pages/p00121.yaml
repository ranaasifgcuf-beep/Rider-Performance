validations: 
- # ====== Validation: Check Required Columns ==================
  id: 16252719269426842
  identification: 
    name: Check Required Columns

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      declare
          l_issued_to  varchar2(240);
          l_purpose varchar2(240);
          l_TXN_TYPE varchar2(240);
      begin
          l_issued_to  := :P121_ISSUED_TO;
          l_purpose := :P121_PURPOSE;
          l_TXN_TYPE := :P121_TXN_TYPE;
      
      IF l_TXN_TYPE = 'ISSUE_TO_EMPLOYEE' THEN 
          if  l_issued_to is NULL  then
              return 'Issued to is required.';
          end if;
      
           if  l_purpose is NULL  then
              return 'Purpose to is required.';
              end if;
       elsif l_TXN_TYPE  = 'INTERNAL_TRANSFER' then 
       if  l_purpose is NULL  then
              return 'Purpose to is required.';
          end if;
      
         END IF;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

