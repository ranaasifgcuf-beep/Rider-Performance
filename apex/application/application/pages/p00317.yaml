- # ====== Region: Expiry Alerts ===============================
  id: 30944144673657111
  identification: 
    name: Expiry Alerts
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          b.bike_code,
          b.plate_no,
      
          d.mulkiya_expiry_dt,
          case
            when d.mulkiya_expiry_dt < trunc(sysdate) then
              '<span class="t-Badge t-Badge--danger">MULKIYA EXPIRED</span>'
            when d.mulkiya_expiry_dt <= trunc(sysdate) + 30 then
              '<span class="t-Badge t-Badge--warning">MULKIYA NEAR EXPIRY</span>'
          end as mulkiya_badge,
      
          d.insurance_expiry_dt,
          case
            when d.insurance_expiry_dt < trunc(sysdate) then
              '<span class="t-Badge t-Badge--danger">INSURANCE EXPIRED</span>'
            when d.insurance_expiry_dt <= trunc(sysdate) + 30 then
              '<span class="t-Badge t-Badge--warning">INSURANCE NEAR EXPIRY</span>'
          end as insurance_badge
      
      from fleet_bikes b
      left join VW_FLEET_BIKE_CURRENT d
        on d.bike_id = b.bike_id
      where b.is_active = 'Y'
        and (
             d.mulkiya_expiry_dt <= trunc(sysdate) + 30
          or d.insurance_expiry_dt <= trunc(sysdate) + 30
        )
      order by least(
          nvl(d.mulkiya_expiry_dt, date '2999-12-31'),
          nvl(d.insurance_expiry_dt, date '2999-12-31')
      )

