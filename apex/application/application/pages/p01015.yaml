  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select STATUS_CODE,
             STATUS_NAME,
             STATUS_NATURE,
             decode(IS_ACTIVE,'Y','Yes','No') as is_active,
             SEQ_NO,
             REMARKS,
             STATUS_TYPE,
             decode(USER_CHANGEABLE,'Y','Yes','No') as USER_CHANGEABLE
        from HR_STATUS_MASTER
      order by seq_no asc

