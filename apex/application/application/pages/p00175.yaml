- # ====== Region: History Context =============================
  id: 37242521520914205
  identification: 
    name: History Context
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_html clob;
      
          function esc(p_text varchar2) return varchar2 is
          begin
              return apex_escape.html(nvl(p_text, '-'));
          end;
      
          function money(p_amount number) return varchar2 is
          begin
              return 'AED ' || trim(to_char(nvl(p_amount,0), '999G999G999G990D00'));
          end;
      begin
          if :P175_LOAN_TXN_ID is null then
      
              for r in (
                  select loan_no,
                         emp_code,
                         employee_name,
                         balance_amount,
                         approval_status,
                         status
                    from hr_emp_loan_v
                   where loan_id = :P175_LOAN_ID
              )
              loop
                  l_html :=
                      '<div class="hist-context">' ||
                      '  <div>' ||
                      '    <div class="hist-title">Loan History</div>' ||
                      '    <div class="hist-sub">' || esc(r.loan_no) || ' | ' ||
                             esc(r.emp_code || ' - ' || r.employee_name) || '</div>' ||
                      '  </div>' ||
                      '  <div class="hist-balance">' || money(r.balance_amount) || '</div>' ||
                      '</div>';
              end loop;
      
          else
      
              for r in (
                  select v.loan_no,
                         v.emp_code,
                         v.employee_name,
                         t.txn_type,
                         t.amount,
                         t.approval_status,
                         t.remarks
                    from hr_emp_loan_txns t
                    join hr_emp_loan_v v
                      on v.loan_id = t.loan_id
                   where t.loan_txn_id = :P175_LOAN_TXN_ID
                     and t.loan_id = :P175_LOAN_ID
              )
              loop
                  l_html :=
                      '<div class="hist-context">' ||
                      '  <div>' ||
                      '    <div class="hist-title">Transaction History</div>' ||
                      '    <div class="hist-sub">' || esc(r.loan_no) || ' | ' ||
                             esc(r.emp_code || ' - ' || r.employee_name) || '</div>' ||
                      '    <div class="hist-sub">Transaction: ' || esc(r.txn_type) ||
                             ' | ' || money(r.amount) || '</div>' ||
                      '  </div>' ||
                      '  <div class="hist-balance">' || esc(r.approval_status) || '</div>' ||
                      '</div>';
              end loop;
      
          end if;
      
          htp.p(nvl(l_html, '<div class="hist-context">No history context found.</div>'));
      end;

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
