  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select emp_id,
             emp_code,
             employee_name,
             txn_dt as last_movement_dt,
             holder_type,
             holder_user,
             holder_dept,
             purpose,
             expected_return_dt,
             handled_by,
             remarks,
             '<span style="display:inline-block; background:#27AE60; color:#fff; padding:6px 10px; border-radius:6px; font-size:13px;">
        <span class="fa fa-paper-plane"></span> Issue
      </span>' AS ISSUE_LINK,
      '<span class="fa fa-exchange"></span>' as IT_link
