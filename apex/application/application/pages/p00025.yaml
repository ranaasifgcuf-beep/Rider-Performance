- # ====== Region: Approval Path ===============================
  id: 34967426879792804
  identification: 
    name: Approval Path
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select s.step_seq,
             s.step_name,
             s.approver_users,
             case s.step_status
                 when 'APPROVED' then
                     '<span class="t-Badge t-Badge--success">Approved</span>'
                 when 'REJECTED' then
                     '<span class="t-Badge t-Badge--danger">Rejected</span>'
                 when 'TASK_CREATED' then
                     '<span class="t-Badge t-Badge--warning">Current / Pending</span>'
                 when 'PENDING' then
                     '<span class="t-Badge t-Badge--info">Waiting</span>'
                 when 'CANCELLED' then
                     '<span class="t-Badge">Cancelled</span>'
                 else
                     '<span class="t-Badge">' || s.step_status || '</span>'
             end as status_badge,
             s.action_by,
             to_char(s.action_dt, 'DD-MON-YYYY HH24:MI') as action_dt,
             s.comments
      from hr_approval_request_steps s
      where s.approval_id = :P25_APPROVAL_ID
      order by s.step_seq

  order-by: 
    type: None

