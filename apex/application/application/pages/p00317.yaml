- # ====== Region: Critical Action Summary =====================
  id: 30753253021815226
  identification: 
    name: Critical Action Summary
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_impound_overdue number := 0;
          l_open_accidents  number := 0;
          l_repair_pending  number := 0;
          l_idle_ready      number := 0;
      begin
          select count(*)
            into l_impound_overdue
            from fleet_bike_impounds
           where status_code = 'ACTIVE'
             and release_ts is null
             and expected_release_ts is not null
             and expected_release_ts < systimestamp;
      
          select count(*)
            into l_open_accidents
            from fleet_bike_accidents
           where status_code = 'OPEN';
      
          select count(*)
            into l_repair_pending
            from fleet_bike_accidents
           where status_code = 'UNDER_REPAIR';
      
          select count(*)
            into l_idle_ready
            from vw_fleet_bike_current
           where is_active = 'Y'
             and bike_status_code = 'AVAILABLE';
      
          htp.p('<div class="fleet-alert-wrap">');
      
          htp.p('<div class="fleet-alert-card alert-red">
                   <div class="fleet-mini-title">Impound Overdue</div>
                   <div class="fleet-mini-value">'||nvl(l_impound_overdue,0)||'</div>
                 </div>');
      
          htp.p('<div class="fleet-alert-card alert-red">
                   <div class="fleet-mini-title">Open Accidents</div>
                   <div class="fleet-mini-value">'||nvl(l_open_accidents,0)||'</div>
                 </div>');
      
          htp.p('<div class="fleet-alert-card alert-yellow">
                   <div class="fleet-mini-title">Repair Pending</div>
                   <div class="fleet-mini-value">'||nvl(l_repair_pending,0)||'</div>
                 </div>');
      
          htp.p('<div class="fleet-alert-card alert-blue">
                   <div class="fleet-mini-title">Available / Idle Ready > 3days </div>
                   <div class="fleet-mini-value">'||nvl(l_idle_ready,0)||'</div>
                 </div>');
      
          htp.p('</div>');
      end;

  layout: 
    sequence: 40
    parent-region: Overview # 30943973421657109
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

