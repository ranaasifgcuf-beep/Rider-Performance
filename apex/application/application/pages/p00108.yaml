- # ====== Region: Pending Active ==============================
  id: 40310527682675229
  identification: 
    name: Pending Active
    title: Pending Active <span class="t-Badge t-Badge--success t-Badge--large">&P108_PENDING_ACTIVE_CNT.</span>
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select e.emp_id,
             e.emp_code,
             e.first_name || ' ' || e.last_name as full_name,
      
             e.worker_type,
             e.supplier_name,
      
             e.status_city_name    as planned_city_name,
             e.status_project_name as planned_project_name,
      
             e.last_project,
             e.last_city,
      
             e.current_status_code as current_status,
             e.current_status_name,
             e.status_badge_text,
      
             e.current_legal_code,
             e.current_legal_name,
      
             case
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') = 'VALID' then
                     '<span class="t-Badge t-Badge--success">Valid</span>'
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in ('IN_PROCESS','ON_HOLD','UNKNOWN') then
                     '<span class="t-Badge t-Badge--warning">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Not Set')) ||
                     '</span>'
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                     'ABSCONDING',
                     'ABSCONDER',
                     'EXPIRED',
                     'EMPLOYEE_COMPLAINT',
                     'CANCELLED_MOHRE',
                     'CANCELLED_ICP',
                     'CANCELLED'
                 ) then
                     '<span class="t-Badge t-Badge--danger">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Risk')) ||
                     '</span>'
                 else
                     '<span class="t-Badge t-Badge--warning">Not Set</span>'
             end as legal_status_badge,
      
             null as assign_link,
             null as active_link,
          e.job_id,
             e.job_name,
      
             e.status_project_id,
             e.status_city_id,
             ac.current_bike_badge as current_bike,
             ac.CURRENT_BIKE_ID
      
      from vw_hr_employee_list e
      join vw_hr_emp_asset_control ac
        on ac.emp_id = e.emp_id
      
      where upper(nvl(e.current_status_code,'PIPELINE')) = 'PENDING_ACTIVE'
      
        and replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') not in (
              'ABSCONDING',
              'ABSCONDER'
            )
      
      order by e.emp_code;

