- # ====== Region: Project Assignment History ==================
  id: 15872647061356799
  identification: 
    name: Project Assignment History
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select a.asg_id,
             a.emp_id,
             p.project_name,
             c.city_name,
             a.supervisor_emp_id,
             E.EMP_CODE,
             E.FULL_EMPLOYEE_NAME,
             a.start_dt,
             a.end_dt,
             a.status,
             case
               when a.end_dt is null then 'Current'
               else 'Closed'
             end as assignment_flag
      from hr_assignments a
      join hr_projects p on p.project_id = a.project_id
      join ref_cities c   on c.city_id = a.city_id
      left join VW_HR_EMPLOYEE_LIST
       E on E.emp_id = a.emp_id
      where a.emp_id = :P103_EMP_ID
      order by a.start_dt desc

