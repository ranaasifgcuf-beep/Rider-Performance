processes: 
- # ====== Process: Set Count ==================================
  id: 17487218217097929
  identification: 
    name: Set Count
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select count(*)
            into :P108_ACTIVE_CNT
            from vw_hr_employee_list e
           where upper(nvl(e.current_status_code, 'NO_STATUS')) = 'ACTIVE'
             and exists (
                     select 1
                       from hr_assignments a
                      where a.emp_id = e.emp_id
                        and a.end_dt is null
                 );
      
          select count(*)
            into :P108_PENDING_ACTIVE_CNT
            from vw_hr_employee_list e
           where upper(nvl(e.current_status_code, 'PIPELINE')) = 'PENDING_ACTIVE'
             and replace(upper(nvl(e.current_legal_code, 'NOT_SET')), 'LEGAL_', '') not in (
                     'ABSCONDING',
                     'ABSCONDER'
                 );
      
          select count(*)
            into :P108_READY_CNT
            from vw_hr_employee_list e
           where not exists (
                     select 1
                       from hr_assignments a
                      where a.emp_id = e.emp_id
                        and a.end_dt is null
                 )
             and upper(nvl(e.current_status_code, 'PIPELINE')) in (
                     'READY_TO_ONBOARD',
                     'ONBOARDING'
                 );
      
          select count(*)
            into :P108_PIPELINE_CNT
            from vw_hr_employee_list e
           where not exists (
                     select 1
                       from hr_assignments a
                      where a.emp_id = e.emp_id
                        and a.end_dt is null
                 )
             and upper(nvl(e.current_status_code, 'PIPELINE')) = 'PIPELINE'
             and replace(upper(nvl(e.current_legal_code, 'NOT_SET')), 'LEGAL_', '') not in (
                     'ABSCONDING',
                     'ABSCONDER'
                 );
      
          select count(*)
            into :P108_OFFBOARD_CNT
            from vw_hr_employee_list e
           where not exists (
                     select 1
                       from hr_assignments a
                      where a.emp_id = e.emp_id
                        and a.end_dt is null
                 )
             and upper(nvl(e.current_status_code, 'PIPELINE')) in (
                     'OFFBOARD',
                     'OFFBOARD_QUEUE'
                 )
             and replace(upper(nvl(e.current_legal_code, 'NOT_SET')), 'LEGAL_', '') not in (
                     'ABSCONDING',
                     'ABSCONDER'
                 );
      
          select count(*)
            into :P108_VACATION_CNT
            from vw_hr_employee_list e
           where not exists (
                     select 1
                       from hr_assignments a
                      where a.emp_id = e.emp_id
                        and a.end_dt is null
                 )
             and upper(nvl(e.current_status_code, 'PIPELINE')) = 'VACATION'
             and replace(upper(nvl(e.current_legal_code, 'NOT_SET')), 'LEGAL_', '') not in (
                     'ABSCONDING',
                     'ABSCONDER'
                 );
      
          select count(*)
            into :P108_ACCIDENT_CNT
            from vw_hr_employee_list e
           where not exists (
                     select 1
                       from hr_assignments a
                      where a.emp_id = e.emp_id
                        and a.end_dt is null
                 )
             and upper(nvl(e.current_status_code, 'PIPELINE')) = 'ACCIDENT'
             and replace(upper(nvl(e.current_legal_code, 'NOT_SET')), 'LEGAL_', '') not in (
                     'ABSCONDING',
                     'ABSCONDER'
                 );
      
          select count(*)
            into :P108_ABSCONDER_CNT
            from vw_hr_employee_list e
           where replace(upper(nvl(e.current_legal_code, 'NOT_SET')), 'LEGAL_', '') in (
                     'ABSCONDING',
                     'ABSCONDER'
                 )
             and upper(nvl(e.current_status_code,'PIPELINE')) in ('PIPELINE','OFFBOARD')
           and  not exists (
              select 1
                from hr_assignments a
               where a.emp_id = e.emp_id
                 and a.end_dt is null
            );
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: MARK_PENDING_ACTIVE ========================
  id: 40310418779675228
  identification: 
    name: MARK_PENDING_ACTIVE
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_emp_id          number := :P108_SELECTED_EMP_ID;
          l_now             date;
          l_current_status  varchar2(50);
          l_legal_status    varchar2(50);
          l_project_id      number;
          l_city_id         number;
      begin
          if l_emp_id is null then
              raise_application_error(-20001, 'Employee is not selected.');
          end if;
      
          l_now := cast(systimestamp at time zone 'Asia/Dubai' as date);
      
          select upper(nvl(current_status_code, 'PIPELINE')),
                 replace(upper(nvl(current_legal_code, 'NOT_SET')), 'LEGAL_', '')
            into l_current_status,
                 l_legal_status
            from vw_hr_employee_list
           where emp_id = l_emp_id;
      
          if l_current_status not in ('READY_TO_ONBOARD', 'ONBOARDING') then
              raise_application_error(
                  -20001,
                  'Only Ready To Onboard employees can be moved to Pending Active.'
              );
          end if;
      
          if l_legal_status in ('ABSCONDING', 'ABSCONDER') then
              raise_application_error(
                  -20001,
                  'This employee has legal absconding status. Please handle from Exception Queue.'
              );
          end if;
      
          select project_id,
                 city_id
            into l_project_id,
                 l_city_id
            from (
                  select project_id,
                         city_id
                    from hr_emp_status_hist
                   where emp_id = l_emp_id
                     and effective_to is null
                   order by effective_from desc, status_id desc
                 )
           where rownum = 1;
      
          update hr_emp_status_hist
             set effective_to = l_now
           where emp_id = l_emp_id
             and effective_to is null;
      
          insert into hr_emp_status_hist (
              emp_id,
              status_code,
              project_id,
              city_id,
              effective_from,
              effective_to,
              remarks
          )
          values (
              l_emp_id,
              'PENDING_ACTIVE',
              l_project_id,
              l_city_id,
              l_now,
              null,
              'Marked as Pending Active from Ready To Onboard'
          );
      
          apex_application.g_print_success_message :=
              'Employee marked as Pending Active successfully.';
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Request = Value
    value: MARK_PENDING_ACTIVE

- # ====== Process: Back To Pipeline ===========================
  id: 40937085788733945
  identification: 
    name: Back To Pipeline
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_emp_id          number := :P108_SELECTED_EMP_ID;
          l_current_status  varchar2(50);
          l_bike_count      number;
          l_req_count       number;
          l_assign_count    number;
          l_project_id      number;
          l_city_id         number;
      begin
          if l_emp_id is null then
              raise_application_error(-20001, 'Employee is not selected.');
          end if;
      
          ------------------------------------------------------------------
          -- Current status check
          ------------------------------------------------------------------
          select upper(nvl(current_status_code, 'X'))
            into l_current_status
            from vw_hr_employee_list
           where emp_id = l_emp_id;
      
          if l_current_status not in ('READY_TO_ONBOARD', 'ONBOARDING') then
              raise_application_error(
                  -20001,
                  'Only Ready To Onboard employees can be moved back to Pipeline.'
              );
          end if;
      
          ------------------------------------------------------------------
          -- Bike check
          ------------------------------------------------------------------
          select count(*)
            into l_bike_count
            from vw_hr_emp_current_bike
           where emp_id = l_emp_id;
      
          if l_bike_count > 0 then
              raise_application_error(
                  -20001,
                  'Employee has an assigned bike. Return bike before moving back to Pipeline.'
              );
          end if;
      
          ------------------------------------------------------------------
          -- Open bike request check
          ------------------------------------------------------------------
          select count(*)
            into l_req_count
            from hr_bike_requests
           where emp_id = l_emp_id
             and request_status in ('OPEN', 'IN_PROGRESS');
      
          if l_req_count > 0 then
              raise_application_error(
                  -20001,
                  'Employee has an open bike request. Cancel request before moving back to Pipeline.'
              );
          end if;
      
          ------------------------------------------------------------------
          -- Active project assignment check
          ------------------------------------------------------------------
          select count(*)
            into l_assign_count
            from hr_assignments
           where emp_id = l_emp_id
             and end_dt is null;
      
          if l_assign_count > 0 then
              raise_application_error(
                  -20001,
                  'Employee has active project assignment. Cannot move back to Pipeline.'
              );
          end if;
      
          ------------------------------------------------------------------
          -- Preserve latest planned project/city from current status history
          ------------------------------------------------------------------
          begin
              select project_id,
                     city_id
                into l_project_id,
                     l_city_id
                from (
                      select project_id,
                             city_id
                        from hr_emp_status_hist
                       where emp_id = l_emp_id
                         and effective_to is null
                       order by effective_from desc, status_id desc
                     )
               where rownum = 1;
          exception
              when no_data_found then
                  l_project_id := null;
                  l_city_id    := null;
          end;
      
          ------------------------------------------------------------------
          -- Move back to Pipeline
          ------------------------------------------------------------------
          hr_status_pkg.set_status(
              p_emp_id      => l_emp_id,
              p_status_code => 'PIPELINE',
              p_project_id  => l_project_id,
              p_city_id     => l_city_id,
              p_remarks     => 'Moved back to Pipeline due to correction from Ready To Onboard'
          );
      
          apex_application.g_print_success_message :=
              'Employee moved back to Pipeline successfully.';
      end;

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Request = Value
    value: BACK_TO_PIPELINE

