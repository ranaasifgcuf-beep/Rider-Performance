validations: 
- # ====== Validation: Passwords match =========================
  id: 8624887975815346
  identification: 
    name: Passwords match

  execution: 
    sequence: 10

  validation: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: 'nvl(trim(:P913_NEW_PASSWORD),1) = nvl(trim(:P913_CONFIRM_PASSWORD),0)'
    always-execute: false

  error: 
    error-message: Passwords do not match.
    display-location: Inline with Field and in Notification
    associated-item: P913_CONFIRM_PASSWORD # 8624673310815344

  server-side-condition: 
    when-button-pressed: BTN_RESET # 8624984233815347

- # ====== Validation: Password policy =========================
  id: 8625169841815349
  identification: 
    name: Password policy

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      return length(trim(:P913_NEW_PASSWORD)) >= 8
         and regexp_like(:P913_NEW_PASSWORD, '[A-Z]')
         and regexp_like(:P913_NEW_PASSWORD, '[a-z]')
         and regexp_like(:P913_NEW_PASSWORD, '[0-9]')
         and regexp_like(:P913_NEW_PASSWORD, '[^A-Za-z0-9]');
    always-execute: false

  error: 
    error-message: Password must be 8+ chars with upper, lower, number, and special character.
    display-location: Inline with Field and in Notification
    associated-item: P913_NEW_PASSWORD # 8624568983815343

  server-side-condition: 
    when-button-pressed: BTN_RESET # 8624984233815347

processes: 
- # ====== Process: Reset Password =============================
  id: 8625261369815350
  identification: 
    name: Reset Password
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
        -- basic match check (keep validation also)
        if trim(:P913_NEW_PASSWORD) <> trim(:P913_CONFIRM_PASSWORD) then
          raise_application_error(-20011, 'Passwords do not match.');
        end if;
      
        sec_auth_pkg.set_password(
          p_username    => :P913_USERNAME,
          p_password    => :P913_NEW_PASSWORD,
          p_must_change => :P913_FORCE_CHANGE
        );
      end;
      

  execution: 
    sequence: 10
    point: After Submit
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

