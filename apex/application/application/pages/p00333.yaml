dynamic-actions: 
- # ====== Dynamic Action: Show Hide Owner Fields ==============
  id: 43013317612045447
  identification: 
    name: Show Hide Owner Fields

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P333_OWNERSHIP_TYPE

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 43013447068045448
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var ownerType = apex.item("P333_OWNERSHIP_TYPE").getValue();
        
        var supplierItems = [
            "P333_OWNER_SUPPLIER_ID"
        ];
        
        var externalItems = [
            "P333_EXTERNAL_OWNER_NAME",
            "P333_EXTERNAL_OWNER_MOBILE",
            "P333_EXTERNAL_OWNER_REF"
        ];
        
        supplierItems.forEach(function(i){
            if (ownerType === "SUPPLIER") {
                apex.item(i).show();
            } else {
                apex.item(i).setValue("");
                apex.item(i).hide();
            }
        });
        
        externalItems.forEach(function(i){
            if (["CLIENT", "THIRD_PARTY", "OTHER"].indexOf(ownerType) >= 0) {
                apex.item(i).show();
            } else {
                apex.item(i).setValue("");
                apex.item(i).hide();
            }
        });

    execution: 
      sequence: 10
      event: Show Hide Owner Fields # 43013317612045447
      fire-when-event-result-is: True
      fire-on-initialization: true

- # ====== Dynamic Action: Cancel Dialog =======================
