dynamic-actions: 
- # ====== Dynamic Action: Show Assign Return Sections =========
  id: 43010053958045414
  identification: 
    name: Show Assign Return Sections

  execution: 
    sequence: 10
    event-scope: Static

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 43010194590045415
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var reqType = apex.item("P330_REQUEST_TYPE").getValue();
        var isReturn = reqType === "RETURN_REQUEST";
        
        var assignItems = [
            "P330_SIM_ID",
            "P330_ASSIGN_DT",
            "P330_ASSIGN_REASON",
            "P330_ASSIGN_REMARKS"
        ];
        
        var returnItems = [
            "P330_RETURN_DT",
            "P330_RETURN_REASON",
            "P330_RETURN_CONDITION",
            "P330_RETURN_REMARKS"
        ];
        
        assignItems.forEach(function(i){
            if (isReturn) {
                apex.item(i).hide();
            } else {
                apex.item(i).show();
            }
        });
        
        returnItems.forEach(function(i){
            if (isReturn) {
                apex.item(i).show();
            } else {
                apex.item(i).hide();
            }
        });

    execution: 
      sequence: 10
      event: Show Assign Return Sections # 43010053958045414
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Cancel ==============================
  id: 43010503617045419
  identification: 
    name: Cancel

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: CANCEL # 43010494367045418

  actions: 
  - # ====== Action: Close Dialog ================================
    id: 43010635023045420
