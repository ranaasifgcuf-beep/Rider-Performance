- # ====== Region: Bike Documents - &P307_PLATE_NO. ============
  id: 16324651963664109
  identification: 
    name: Bike Documents - &P307_PLATE_NO.
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |2
          select
              d.bike_doc_id,
      
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 308,
                  p_items  => 'P308_BIKE_DOC_ID,P308_BIKE_ID',
                  p_values => d.bike_doc_id || ',' || d.bike_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-edit" title="Edit Document"></span></a>' as edit_link,
      
              d.doc_type,
              d.doc_no,
              d.issue_dt,
              d.expiry_dt,
      
              case
                when d.expiry_dt is null then
                  '<span class="t-Badge t-Badge--default">NO DATE</span>'
                when d.expiry_dt < trunc(sysdate) then
                  '<span class="t-Badge t-Badge--danger">EXPIRED</span>'
                when d.expiry_dt <= trunc(sysdate) + 30 then
                  '<span class="t-Badge t-Badge--warning">DUE SOON</span>'
                else
                  '<span class="t-Badge t-Badge--success">VALID</span>'
              end as expiry_badge,
      
              d.issuer_name,
            case when  nvl(d.is_current,'N') = 'Y'
            then '<span class="fa fa-check-circle u-success-text" title="Current"></span>'--'<span class="t-Badge t-Badge--success">CURRENT</span>'
            ELSE 
            NULL
            END AS is_current
            ,
              DBMS_LOB.GETLENGTH(d.file_blob) as file_blob,
              d.remarks,
              d.created_by,
              d.created_dt
          from fleet_bike_docs d
          where d.bike_id = :P307_BIKE_ID
          order by case when nvl(d.is_current,'N') = 'Y' then 1 else 2 end,
          d.doc_type,
                   d.expiry_dt desc,
                   d.bike_doc_id desc
    page-items-to-submit: 
    - P307_BIKE_ID

