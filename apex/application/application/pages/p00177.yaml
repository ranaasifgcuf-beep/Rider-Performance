- # ====== Region: Pending Approvals ===========================
  id: 37295534110639612
  identification: 
    name: Pending Approvals
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select 'Loan Creation' request_type,
             v.loan_no,
             v.emp_code,
             v.employee_name,
             'AED ' || trim(to_char(nvl(v.loan_amount,0), '999G999G999G990D00')) amount,
             case approval_status
          when 'SUBMITTED' then '<span class="t-Badge t-Badge--warning">Submitted</span>'
          when 'APPROVED' then '<span class="t-Badge t-Badge--success">Approved</span>'
          when 'REJECTED' then '<span class="t-Badge t-Badge--danger">Rejected</span>'
          else '<span class="t-Badge">' || apex_escape.html(approval_status) || '</span>'
      end approval_status,
             to_char(v.issue_dt, 'DD-MON-YYYY') request_date,
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 175,
                 p_items       => 'P175_LOAN_ID',
                 p_values      => v.loan_id,
                 p_clear_cache => '175'
             ) ||
             '" title="View History"><span class="fa fa-history"></span></a>' history_link
      from hr_emp_loan_v v
      where v.approval_status = 'SUBMITTED'
      
      union all
      
      select case t.txn_type
                 when 'MANUAL_PAYMENT' then 'Payment'
                 when 'WAIVER' then 'Waiver'
                 when 'ADJUSTMENT' then 'Adjustment'
                 when 'REVERSAL' then 'Reversal'
                 when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                 else t.txn_type
             end request_type,
             v.loan_no,
             v.emp_code,
             v.employee_name,
             'AED ' || trim(to_char(nvl(t.amount,0), '999G999G999G990D00')) amount,
             t.approval_status,
             to_char(t.txn_date, 'DD-MON-YYYY') request_date,
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 175,
                 p_items       => 'P175_LOAN_ID,P175_LOAN_TXN_ID',
                 p_values      => t.loan_id || ',' || t.loan_txn_id,
                 p_clear_cache => '175'
             ) ||
             '" title="View History"><span class="fa fa-history"></span></a>' history_link
      from hr_emp_loan_txns t
      join hr_emp_loan_v v
        on v.loan_id = t.loan_id
      where t.approval_status = 'SUBMITTED'
      order by request_date desc;

  order-by: 
    type: None

