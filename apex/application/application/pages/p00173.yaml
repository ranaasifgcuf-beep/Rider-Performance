- # ====== Process: Load Manual Loan ===========================
  id: 35846586759830050
  identification: 
    name: Load Manual Loan
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select emp_id,
                 loan_amount,
                 emi_amount,
                 issue_dt,
                 start_month,
                 remarks,
                 approval_status,
                 status,
                 AGREED_ADVANCE_AMOUNT
            into :P173_EMP_ID,
                 :P173_LOAN_AMOUNT,
                 :P173_EMI_AMOUNT,
                 :P173_ISSUE_DT,
                 :P173_START_MONTH,
                 :P173_REMARKS,
                 :P173_APPROVAL_STATUS,
                 :P173_STATUS,
                 :P173_AGREED_ADVANCE_AMOUNT
            from hr_emp_loans
           where loan_id = :P173_LOAN_ID;
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

  server-side-condition: 
    type: Item is NOT NULL
    item: P173_LOAN_ID

