- # ====== Process: FETCH_P321_CHARGE_INFO =====================
  id: 30109829238516025
  identification: 
    name: FETCH_P321_CHARGE_INFO
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      select emp_id,
             charge_type,
             amount,
             hr_charges_pkg.get_charge_balance(:P321_EMP_CHARGE_ID)
        into :P321_EMP_ID,
             :P321_CHARGE_TYPE,
             :P321_TOTAL_AMOUNT,
             :P321_BALANCE
        from hr_emp_charges
