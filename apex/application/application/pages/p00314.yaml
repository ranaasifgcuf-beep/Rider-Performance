processes: 
- # ====== Process: FETCH_BIKE_INFO ============================
  id: 30542532172223630
  identification: 
    name: FETCH_BIKE_INFO
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          select 
                 plate_no,
                 bike_status_name,
                 custody_type_name,
                 current_emp_id
            into 
                 :P314_PLATE_NO,
                 :P314_CURRENT_STATUS,
                 :P314_CURRENT_CUSTODY,
                 :P314_EMP_ID
            from vw_fleet_bike_current
           where bike_id = :P314_BIKE_ID;
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: OPEN_ACCIDENT ==============================
  id: 30543863422223643
  identification: 
    name: OPEN_ACCIDENT
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_accident_id number;
      begin
          fleet_pkg.open_bike_accident(
              p_bike_id                 => :P314_BIKE_ID,
              p_emp_id                  => :P314_EMP_ID,
              p_accident_dt             => :P314_ACCIDENT_DT,
              p_accident_location       => :P314_ACCIDENT_LOCATION,
              p_police_report_no        => :P314_POLICE_REPORT_NO,
              p_fault_type              => :P314_FAULT_TYPE,
              p_accident_severity       => :P314_ACCIDENT_SEVERITY,
              p_accident_custody_code   => :P314_ACCIDENT_CUSTODY_CODE,
              p_accident_location_id    => :P314_ACCIDENT_LOCATION_ID,
              p_estimated_cost          => :P314_ESTIMATED_COST,
              p_charge_to_employee_yn   => :P314_CHARGE_TO_EMPLOYEE_YN,
              p_excluded_from_charge_yn => :P314_EXCLUDED_FROM_CHARGE_YN,
              p_create_charge_yn        => :P314_CREATE_CHARGE_YN,
              p_charge_due_dt           => :P314_CHARGE_DUE_DT,
              p_remarks                 => :P314_REMARKS,
              p_accident_id             => l_accident_id
          );
      
          :P314_ACCIDENT_ID := l_accident_id;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: BTN_SAVE # 30543633880223641

