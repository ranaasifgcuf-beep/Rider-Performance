- # ====== Process: Check Active Status ========================
  id: 17329041626959447
  identification: 
    name: Check Active Status
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          if :P111_IS_CURRENT_RECORD = 'Y' then
              update hr_emp_docs
                 set is_current_record = 'N',
                     updated_by = nvl(v('APP_USER'), user),
                     updated_dt = cast(systimestamp at time zone 'Asia/Dubai' as timestamp)
               where emp_id = :P111_EMP_ID
                 and doc_type = :P111_DOC_TYPE
                 and doc_id <> nvl(:P111_DOC_ID, -1)
                 and is_current_record = 'Y';
          end if;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

