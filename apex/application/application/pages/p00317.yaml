- # ====== Region: Bike Snapshot KPI ===========================
  id: 30679499463699323
  identification: 
    name: Bike Snapshot KPI
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_total        number := 0;
          l_assigned     number := 0;
          l_available    number := 0;
          l_impound      number := 0;
          l_repair       number := 0;
          l_inactive     number := 0;
          l_util_pct     number := 0;
      begin
          select count(*),
                 sum(case when bike_status_code = 'ASSIGNED' then 1 else 0 end),
                 sum(case when bike_status_code = 'AVAILABLE' then 1 else 0 end),
                 sum(case when bike_status_code = 'IMPOUND' then 1 else 0 end),
                 sum(case when bike_status_code in ('ACCIDENT','MAINTENANCE') then 1 else 0 end),
                 sum(case when bike_status_code in ('INACTIVE','RETURNED_TO_VENDOR','SOLD') then 1 else 0 end)
            into l_total,
                 l_assigned,
                 l_available,
                 l_impound,
                 l_repair,
                 l_inactive
            from vw_fleet_bike_current
           where is_active = 'Y'
             and (:P317_LOCATION is null or custody_location_name = :P317_LOCATION)
             and (:P317_STATUS is null or bike_status_code = :P317_STATUS);
      
          l_util_pct := round(nvl(l_assigned,0) / nullif(l_total,0) * 100, 2);
      
          htp.p('<div class="fleet-kpi-wrap">');
      
          htp.p('<div class="fleet-kpi-card kpi-blue">
                   <div class="fleet-kpi-title">Total Active Bikes</div>
                   <div class="fleet-kpi-value">'||nvl(l_total,0)||'</div>
                   <div class="fleet-kpi-sub">Active fleet count</div>
                 </div>');
      
          htp.p('<div class="fleet-kpi-card kpi-green">
                   <div class="fleet-kpi-title">Assigned</div>
                   <div class="fleet-kpi-value">'||nvl(l_assigned,0)||'</div>
                   <div class="fleet-kpi-sub">Currently with riders</div>
                 </div>');
      
          htp.p('<div class="fleet-kpi-card kpi-yellow">
                   <div class="fleet-kpi-title">Available</div>
                   <div class="fleet-kpi-value">'||nvl(l_available,0)||'</div>
                   <div class="fleet-kpi-sub">Ready but idle</div>
                 </div>');
      
          htp.p('<div class="fleet-kpi-card kpi-red">
                   <div class="fleet-kpi-title">Impound</div>
                   <div class="fleet-kpi-value">'||nvl(l_impound,0)||'</div>
                   <div class="fleet-kpi-sub">Legal blockage</div>
                 </div>');
      
          htp.p('<div class="fleet-kpi-card kpi-purple">
                   <div class="fleet-kpi-title">Accident / Repair</div>
                   <div class="fleet-kpi-value">'||nvl(l_repair,0)||'</div>
                   <div class="fleet-kpi-sub">Non-productive bikes</div>
                 </div>');
      
          htp.p('<div class="fleet-kpi-card kpi-gray">
                   <div class="fleet-kpi-title">Utilization</div>
                   <div class="fleet-kpi-value">'||nvl(l_util_pct,0)||'%</div>
                   <div class="fleet-kpi-sub">Assigned / total active</div>
                 </div>');
      
          htp.p('</div>');
      end;

  layout: 
    sequence: 30
    parent-region: Overview # 30943973421657109
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
