validations: 
- # ====== Validation: Validate Date Overlap ===================
  id: 16638010250652207
  identification: 
    name: Validate Date Overlap

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      declare
          l_cnt number;
      begin
          select count(*)
            into l_cnt
            from hr_emp_insurance x
           where x.emp_id = :P115_EMP_ID
             and x.insurance_type = :P115_INSURANCE_TYPE
             and nvl(x.status_code,'ACTIVE') <> 'CANCELLED'
             and x.insurance_id <> nvl(:P151_INSURANCE_ID, -1)
             and :P115_START_DT <= nvl(x.expiry_dt, date '4712-12-31')
             and nvl(:P151_EXPIRY_DT, date '4712-12-31') >= x.start_dt;
      
          if l_cnt > 0 then
              return 'Insurance period overlaps with an existing record.';
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

