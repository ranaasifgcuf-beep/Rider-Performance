  resizable: true

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

css: 
  inline: |
    /* SIM form labels */
    #sim_form .t-Form-label {
        font-weight: 600;
        color: #344054;
    }
    
    /* Inputs */
    #sim_form .apex-item-text,
    #sim_form .apex-item-select,
    #sim_form .apex-item-textarea,
    #sim_form .apex-item-datepicker {
        border-radius: 7px;
        border-color: #d0d5dd;
        background-color: #ffffff;
        min-height: 42px;
    }
    
    /* Input focus */
    #sim_form .apex-item-text:focus,
    #sim_form .apex-item-select:focus,
    #sim_form .apex-item-textarea:focus {
        border-color: #2684ff;
        box-shadow: 0 0 0 2px rgba(38, 132, 255, 0.12);
    }
    
    /* Reduce excessive vertical spacing */
    #sim_form .t-Form-fieldContainer {
        margin-bottom: 8px;
    }
    
    /* Subregion headings */
    #sim_form .t-Region-title {
        font-size: 15px;
        font-weight: 600;
        color: #1d2939;
    }
    
    /* Text areas */
    #sim_form textarea.apex-item-textarea {
        min-height: 85px;
        resize: vertical;
    }

security: 
  authentication: Page Requires Authentication
  deep-linking: Application Default
  page-access-protection: Arguments Must Have Checksum
  form-auto-complete: Off
  browser-cache: Application Default

session-management: 
  rejoin-sessions: Application Default

advanced: 
  enable-duplicate-page-submissions: Yes - Enable page to be re-posted
  reload-on-submit: Only for Success

server-cache: 
