  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select emp_id,
             emp_code,
             employee_name,
             provider_name,
             policy_no,
             member_card_no,
             plan_name,
             class_name,
             start_dt,
             expiry_dt,
             abs(days_left) as expired_days,
             '<span class="fa fa-refresh"></span>' as renew_icon,
              STATUS_BADGE_TEXT,
