      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    
    .appr-grid4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    
    .appr-cell {
      padding: 8px 10px;
      border-right: 1px solid #eef2f7;
      border-bottom: 1px solid #eef2f7;
      background: #ffffff;
      min-height: 52px;
    }
    
    .appr-cell:nth-child(4n) {
      border-right: none;
    }
    
    .appr-cell.amount {
      background: #fff7ed;
    }
    
    .appr-cell-wide {
      grid-column: span 4;
      background: #f8fafc;
    }
    
    .appr-cell-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #64748b;
      font-weight: 800;
      margin-bottom: 4px;
    }
    
    .appr-cell-value {
      font-size: 12.5px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
      word-break: break-word;
    }
    
    .appr-cell.amount .appr-cell-value {
      color: #9a3412;
      font-weight: 800;
    }
    
    .appr-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }
    
    .appr-pill.yes {
      background: #dcfce7;
      color: #166534;
    }
    
    .appr-pill.no {
      background: #fee2e2;
      color: #991b1b;
    }
    
    @media (max-width: 900px) {
      .appr-grid4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    
      .appr-cell:nth-child(4n) {
        border-right: 1px solid #eef2f7;
      }
    
      .appr-cell:nth-child(2n) {
        border-right: none;
      }
    
      .appr-cell-wide {
        grid-column: span 2;
      }
    }
    
    @media (max-width: 520px) {
      .appr-grid4 {
        grid-template-columns: 1fr;
      }
    
      .appr-cell {
        border-right: none !important;
      }
    
      .appr-cell-wide {
        grid-column: span 1;
      }
    }
