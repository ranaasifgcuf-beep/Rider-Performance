processes: 
- # ====== Process: Calculate Counts ===========================
  id: 16687334663671489
  identification: 
    name: Calculate Counts
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
      select count(*) into :P117_VALID_CNT
      from vw_hr_emp_insurance_status
      where insurance_type = :P117_INS_TYPE
        and insurance_bucket = 'VALID';
      
      select count(*) into :P117_NEAR_EXPIRY_CNT
      from vw_hr_emp_insurance_status
      where insurance_type = :P117_INS_TYPE
        and insurance_bucket = 'NEAR_EXPIRY';
      
      select count(*) into :P117_EXPIRED_CNT
      from vw_hr_emp_insurance_status
      where insurance_type = :P117_INS_TYPE
        and insurance_bucket = 'EXPIRED';
      
      select count(*) into :P117_PENDING_CNT
      from vw_hr_emp_insurance_status
      where insurance_type = :P117_INS_TYPE
        and insurance_bucket = 'PENDING';
      
      select count(*) into :P117_CANCELLED_CNT
      from vw_hr_emp_insurance_status
      where insurance_type = :P117_INS_TYPE
        and insurance_bucket = 'CANCELLED';
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

