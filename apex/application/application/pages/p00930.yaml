processes: 
- # ====== Process: Save Roles Permission ======================
  id: 9837621483147112
  identification: 
    name: Save Roles Permission
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
        delete from sec_role_perms where role_id = :P930_ROLE_ID;
      
        if :P930_PERM_IDS is not null then
          for r in (
            select to_number(column_value) perm_id
            from table(apex_string.split(:P930_PERM_IDS, ':'))
          ) loop
            insert into sec_role_perms(role_id, perm_id)
            values(:P930_ROLE_ID, r.perm_id);
          end loop;
        end if;
      end;

  execution: 
    sequence: 10
    point: After Submit
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

