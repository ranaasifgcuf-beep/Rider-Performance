css: 
  inline: |
    .legal-kpi-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
    }
    
    .legal-kpi-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-left: 4px solid #2563eb;
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        min-height: 82px;
    }
    
    .legal-kpi-card.success {
        border-left-color: #15803d;
    }
    
    .legal-kpi-card.warning {
        border-left-color: #d97706;
    }
    
    .legal-kpi-card.danger {
        border-left-color: #dc2626;
    }
    
    .legal-kpi-label {
        font-size: 10px;
        text-transform: uppercase;
        color: #334155;
        font-weight: 800;
        letter-spacing: .03em;
    }
    
    .legal-kpi-value {
        font-size: 25px;
        font-weight: 900;
        color: #0f172a;
        margin-top: 5px;
        line-height: 1;
    }
    
    .legal-kpi-card.success .legal-kpi-value {
        color: #15803d;
    }
    
    .legal-kpi-card.warning .legal-kpi-value {
        color: #d97706;
    }
    
    .legal-kpi-card.danger .legal-kpi-value {
        color: #dc2626;
    }
    
    .legal-kpi-sub {
        font-size: 10px;
        color: #64748b;
        margin-top: 6px;
    }
    
    @media (max-width: 1200px) {
        .legal-kpi-grid {
            grid-template-columns: repeat(3, minmax(140px, 1fr));
        }
    }

