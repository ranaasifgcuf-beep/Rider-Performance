- # ====== Region: Average Completion Time =====================
  id: 34849266903345550
  identification: 
    name: Average Completion Time
    type: Chart

  source: 
    location: None

  layout: 
    sequence: 10
    parent-region: Performance # 34848839500345550
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
