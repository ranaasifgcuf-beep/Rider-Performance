- # ====== Validation: Validate Mobile Number ==================
  id: 39252490924729120
  identification: 
    name: Validate Mobile Number

  execution: 
    sequence: 330

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if :P102_MOBILE is null then
              return null;
          end if;
      
          for r in (
              select emp_code,
                     trim(first_name || ' ' || last_name) employee_name
              from hr_employees
              where emp_id <> nvl(:P102_EMP_ID, -1)
                and hr_normalize_mobile(mobile) =
                    hr_normalize_mobile(:P102_MOBILE)
              fetch first 1 row only
          )
          loop
              return 'This mobile number is already assigned to employee '
                     || r.emp_code || ' - ' || r.employee_name || '.';
          end loop;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

- # ====== Validation: Validate Duplicate Email ================
  id: 39252594119729121
  identification: 
    name: Validate Duplicate Email

  execution: 
    sequence: 340

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      begin
          if trim(:P102_EMAIL) is null then
              return null;
          end if;
      
          for r in (
              select emp_code,
                     trim(first_name || ' ' || last_name) employee_name
              from hr_employees
              where emp_id <> nvl(:P102_EMP_ID, -1)
                and lower(trim(email)) = lower(trim(:P102_EMAIL))
              fetch first 1 row only
          )
          loop
              return 'This email address is already assigned to employee '
                     || r.emp_code || ' - ' || r.employee_name || '.';
          end loop;
      
          return null;
      end;
    always-execute: false

  error: 
