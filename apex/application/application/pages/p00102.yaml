- # ====== Page Item: P102_CURRENT_STATUS ======================
  id: 15894453877110442
  identification: 
    name: P102_CURRENT_STATUS
    type: Display Only

  label: 
    label: Current Status
    alignment: Left

  settings: 
    format: Plain Text
    based-on: Item Value
