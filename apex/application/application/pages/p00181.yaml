- # ====== Region: Missing Mandatory ===========================
  id: 37593938215478647
  identification: 
    name: Missing Mandatory
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select e.emp_code,
             trim(e.first_name || ' ' || e.last_name) employee_name,
             t.doc_type_name missing_document,
             t.doc_group,
             '<span class="t-Badge t-Badge--danger">Missing</span>' status,
             '<a href="' ||
             apex_page.get_url(
                 p_page        => 105,
                 p_items       => 'P105_EMP_ID',
                 p_values      => e.emp_id,
                 p_clear_cache => '105'
             ) ||
             '" title="Open Employee Documents"><span class="fa fa-folder-open"></span></a>' open_docs
      from hr_employees e
      join hr_doc_type_master t
        on t.is_active = 'Y'
       and t.is_mandatory = 'Y'
      where 1=1--nvl(e.is_active,'Y') = 'Y'
        and (:P181_DOC_GROUP is null or t.doc_group = :P181_DOC_GROUP)
        and (:P181_DOC_TYPE is null or t.doc_type_code = :P181_DOC_TYPE)
        and not exists (
              select 1
                from hr_emp_docs d
               where d.emp_id = e.emp_id
                 and d.doc_type = t.doc_type_code
                 and d.is_current_record = 'Y'
            )
      order by e.emp_code, t.seq_no
    page-items-to-submit: 
    - P181_DAYS
    - P181_DOC_GROUP
    - P181_DOC_TYPE

