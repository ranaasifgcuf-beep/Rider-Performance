computations: 
- # ====== Computation: P25_CAN_UPDATE_PARAMS ==================
  id: 34860623588621633
  identification: 
    item-name: P25_CAN_UPDATE_PARAMS

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: |
      case 
          when apex_human_task.is_allowed (
                  p_task_id   => :P25_TASK_ID,
                  p_operation => apex_human_task.c_task_op_set_params )
          then 'Y'
          else 'N'
      end

