             to_char(effective_from_dt, 'DD-MON-YYYY HH24:MI') effective_from,
             to_char(effective_to_dt, 'DD-MON-YYYY HH24:MI') effective_to,
             case is_current_record
                 when 'Y' then '<span class="t-Badge t-Badge--success">Current</span>'
                 else '<span class="t-Badge">Closed</span>'
             end current_status,
             legal_status_reason,
             legal_case_ref,
