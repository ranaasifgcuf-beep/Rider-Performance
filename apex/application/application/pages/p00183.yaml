- # ====== Region: Employee Detail =============================
  id: 38207040909256239
  identification: 
    name: Employee Detail
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_html          clob;
          l_worker_text   varchar2(4000);
          l_status_text   varchar2(4000);
          l_wps_text      varchar2(4000);
          l_status_class  varchar2(100);
          l_wps_class     varchar2(100);
      
          function fmt_text(p_value varchar2) return varchar2 is
          begin
              return replace(initcap(replace(nvl(p_value, 'Not Set'), '_', ' ')), 'Wps', 'WPS');
          end;
      begin
          for r in (
              select emp_code,
                     employee_name,
                     legal_worker_type,
                     legal_party_name,
                     legal_status,
                     wps_clearing_display
                from hr_emp_legal_profile_v
               where legal_profile_id = :P183_LEGAL_PROFILE_ID
          ) loop
      
              l_worker_text := fmt_text(r.legal_worker_type);
      
              if r.legal_party_name is not null then
                  l_worker_text := l_worker_text || ' | ' || r.legal_party_name;
              end if;
      
              l_status_text := fmt_text(r.legal_status);
              l_wps_text    := nvl(r.wps_clearing_display, 'Not Set');
      
              l_status_class :=
                  case
                      when upper(r.legal_status) in ('ACTIVE', 'APPROVED', 'COMPLETED', 'VALID') then
                          'legal-badge legal-badge-success'
                      when upper(r.legal_status) in ('IN_PROCESS', 'PENDING', 'UNDER_PROCESS') then
                          'legal-badge legal-badge-warning'
                      when upper(r.legal_status) in ('EXPIRED', 'CANCELLED', 'BLOCKED', 'REJECTED') then
                          'legal-badge legal-badge-danger'
                      else
                          'legal-badge'
                  end;
      
              l_wps_class :=
                  case
                      when upper(r.wps_clearing_display) like '%INSIDE%' then
                          'legal-badge legal-badge-success'
                      when upper(r.wps_clearing_display) like '%OUTSIDE%' then
                          'legal-badge legal-badge-warning'
                      when r.wps_clearing_display is null then
                          'legal-badge legal-badge-danger'
                      else
                          'legal-badge'
                  end;
      
              l_html :=
                  '<div class="legal-header-card">' ||
      
                      '<div class="legal-header-left">' ||
                          '<div class="legal-title">' ||
                              apex_escape.html(r.emp_code || ' - ' || r.employee_name) ||
                          '</div>' ||
      
                          '<div class="legal-sub">' ||
                              apex_escape.html(l_worker_text) ||
                          '</div>' ||
                      '</div>' ||
      
                      '<div class="legal-header-right">' ||
      
                          '<div class="legal-status-box">' ||
                              '<div class="legal-mini-label">Legal Status</div>' ||
                              '<div class="' || l_status_class || '">' ||
                                  apex_escape.html(l_status_text) ||
                              '</div>' ||
                          '</div>' ||
      
                          '<div class="legal-status-box">' ||
                              '<div class="legal-mini-label">WPS</div>' ||
                              '<div class="' || l_wps_class || '">' ||
                                  apex_escape.html(l_wps_text) ||
                              '</div>' ||
                          '</div>' ||
      
                      '</div>' ||
      
                  '</div>';
          end loop;
      
          return nvl(
              l_html,
              '<div class="legal-header-card"><div class="legal-title">Profile not found.</div></div>'
          );
      end;

  layout: 
    sequence: 10
    parent-region: No Parent
