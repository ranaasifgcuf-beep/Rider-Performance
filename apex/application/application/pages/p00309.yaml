  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          v.bike_id,
      
         /*case
        when v.bike_status_code = 'AVAILABLE'
         and v.current_bike_assign_id is null
        then
          '<a href="' ||
          apex_page.get_url(
              p_page   => 303,
              p_items  => 'P303_BIKE_ID,P303_BIKE_READ_ONLY',
              p_values => v.bike_id||',Y'
          ) || '" class="js-dialog-link">' ||
         '<span class="fa fa-key" style="color:#28a745; font-size:16px;" title="Assign Bike"></span></a>'
       when v.current_bike_assign_id is not null
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 304,
                  p_items  => 'P304_BIKE_ASSIGN_ID',
                  p_values => v.current_bike_assign_id 
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-undo" style="color:#dc3545; font-size:16px;" title="Return Bike"></span></a>'
          else '<span class="fa fa-key" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
      end as assign_link,*/
      case
          when v.current_bike_assign_id is not null then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 304,
                  p_items  => 'P304_BIKE_ASSIGN_ID',
                  p_values => v.current_bike_assign_id
              ) ||
              '" class="js-dialog-link">' ||
              '<span class="fa fa-undo"
                     style="color:#dc3545; font-size:16px;"
                     title="Return Bike"></span>' ||
              '</a>'
      
          else
              '<span class="fa fa-undo"
                     style="color:#cfcfcf; font-size:16px; opacity:.55; cursor:not-allowed;"
                     title="Bike Not Assigned"></span>'
      end as assign_link,
      /*
          case
            when v.current_bike_assign_id is not null
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 304,
                  p_items  => 'P304_BIKE_ASSIGN_ID',
                  p_values => v.current_bike_assign_id 
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-undo" style="color:#dc3545; font-size:16px;" title="Return Bike"></span></a>'
            else '<span class="fa fa-undo" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
          end as return_link,*/
      
       case
            when v.current_bike_assign_id is  null  and  v.bike_status_code not in ('IMPOUND','ACCIDENT')
            then
          '<a href="' ||
          apex_page.get_url(
              p_page   => 305,
              p_items  => 'P305_BIKE_ID',
              p_values => v.bike_id
          ) || '" class="js-dialog-link">' ||
          '<span class="fa fa-exchange" title="Change Status"></span></a>' 
          else '<span class="fa fa-exchange" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
          end as status_link,
      
         case
            when v.current_bike_assign_id is  null
            then
          '<a href="' ||
          apex_page.get_url(
              p_page   => 306,
              p_items  => 'P306_BIKE_ID',
              p_values => v.bike_id
          ) || '" class="js-dialog-link">' ||
          '<span class="fa fa-map-marker" title="Change Custody"></span></a>' 
          else '<span class="fa fa-map-marker" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
          end
          as custody_link,
      oi.impound_id,
          case
            when v.bike_status_code = 'IMPOUND'
             and oi.impound_id is not null
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 312,
                  p_items  => 'P312_IMPOUND_ID',
                  p_values => oi.impound_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-unlock" title="Release Impound"></span></a>'
      
            when v.bike_status_code NOT IN  ('IMPOUND','ACCIDENT')
            then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 311,
                  p_items  => 'P311_BIKE_ID',
                  p_values => v.bike_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-ban" title="Open Impound"></span></a>'
              ELSE '<span class="fa fa-ban" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
          end as impound_link,
         /* case
        when v.bike_status_code not in ('IMPOUND','ACCIDENT')
        then
          '<a href="' ||
          apex_page.get_url(
              p_page   => 314,
              p_items  => 'P314_BIKE_ID',
              p_values => v.bike_id
          ) || '" class="js-dialog-link">' ||
          '<span class="fa fa-exclamation-diamond" title="Open Accident"></span></a>'
          ELSE
          '<span class="fa fa-exclamation-diamond" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
      end as accident_link,*/
      case
        when v.bike_status_code = 'ACCIDENT'
         and oa.accident_status = 'OPEN'
        then
          '<a href="' ||
          apex_page.get_url(
              p_page   => 315,
              p_items  => 'P315_ACCIDENT_ID',
              p_values => oa.accident_id
          ) || '" class="js-dialog-link">' ||
          '<span class="fa fa-wrench" title="Start Repair"></span></a>'
      
        when v.bike_status_code = 'MAINTENANCE'
         and oa.accident_status = 'UNDER_REPAIR'
        then
          '<a href="' ||
          apex_page.get_url(
              p_page   => 316,
              p_items  => 'P316_ACCIDENT_ID',
              p_values => oa.accident_id
          ) || '" class="js-dialog-link">' ||
          '<span class="fa fa-check" title="Close Accident"></span></a>'
      
        when v.bike_status_code not in ('IMPOUND','ACCIDENT','MAINTENANCE')
        then
          '<a href="' ||
          apex_page.get_url(
              p_page   => 314,
              p_items  => 'P314_BIKE_ID',
              p_values => v.bike_id
          ) || '" class="js-dialog-link">' ||
          '<span class="fa fa-car" title="Open Accident"></span></a>'
          else '<span class="fa fa-car" style="color:#cfcfcf; opacity:.55;" title="Not Available"></span>'
      end as accident_link,
      
      case
        when v.current_bike_assign_id is not null
        then
          '<a href="' ||
          apex_page.get_url(
              p_page    => :APP_PAGE_ID,
              p_request => 'PRINT_HANDOVER',
              p_items   => 'P309_BIKE_ASSIGN_ID',
              p_values  => v.current_bike_assign_id
          ) || '" target="_blank">' ||
          '<span class="fa fa-print" style="color:#2563eb; font-size:16px;" title="Print Handover Form"></span></a>'
        else
          '<span class="fa fa-print" style="color:#cfcfcf; opacity:.55;" title="Bike not assigned"></span>'
      end as print_handover_link,
      
          v.bike_code,
          v.plate_no,
      
          case
            when v.bike_status_code = 'AVAILABLE' then
              '<span class="t-Badge t-Badge--success">AVAILABLE</span>'
            when v.bike_status_code = 'ASSIGNED' then
              '<span class="t-Badge t-Badge--info">ASSIGNED</span>'
            when v.bike_status_code in ('ACCIDENT','MAINTENANCE') then
              '<span class="t-Badge t-Badge--warning">' || v.bike_status_name || '</span>'
            when v.bike_status_code in ('IMPOUND','POLICE_CUSTODY') then
              '<span class="t-Badge t-Badge--danger">' || v.bike_status_name || '</span>'
            else
              '<span class="t-Badge t-Badge--default">' || nvl(v.bike_status_name,'N/A') || '</span>'
          end as bike_status_badge,
      
          v.custody_type_name,
          v.custody_location_name,
          v.current_emp_id,
          v.current_assign_dt,
      
          case
            when v.utilization_bucket = 'PRODUCTIVE' then
              '<span class="t-Badge t-Badge--info">PRODUCTIVE</span>'
            when v.utilization_bucket = 'IDLE_READY' then
              '<span class="t-Badge t-Badge--success">IDLE READY</span>'
            when v.utilization_bucket = 'IDLE_REPAIR' then
              '<span class="t-Badge t-Badge--warning">IDLE REPAIR</span>'
            when v.utilization_bucket = 'IDLE_LEGAL' then
              '<span class="t-Badge t-Badge--danger">IDLE LEGAL</span>'
            else
              '<span class="t-Badge t-Badge--default">' || nvl(v.utilization_bucket,'OTHER') || '</span>'
          end as utilization_badge,
      
          v.current_bike_assign_id,
      
          v.employee_name,
          v.emp_code,
          v.current_project,
          v.nationality
      from vw_fleet_bike_current v
      left join (
          select bike_id,
                 max(impound_id) impound_id
            from fleet_bike_impounds
           where status_code = 'ACTIVE'
             and release_ts is null
           group by bike_id
      ) oi
      on oi.bike_id = v.bike_id
      left join (
          select bike_id,
                 max(accident_id) accident_id,
                 max(status_code) keep (dense_rank last order by accident_id) accident_status
            from fleet_bike_accidents
           where status_code in ('OPEN','UNDER_REPAIR')
           group by bike_id
      ) oa
      on oa.bike_id = v.bike_id
      where NVL(v.CURRENT_emp_id,0) = nvl(:P309_EMP_ID,NVL(V.CURRENT_EMP_ID,0))
      order by current_assign_dt nulls first, v.bike_code

