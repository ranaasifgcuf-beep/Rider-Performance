- # ====== Region: Pay Method ==================================
  id: 17239315016626639
  identification: 
    name: Pay Method
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select a.pay_rec_id,
             a.pay_mode_code,
             pm.pay_mode_name,
             a.effective_from,
             a.effective_to,
            decode(a.is_primary,'Y','Yes','No') as is_primary,
             decode(a.is_active,'Y','Yes','No') as is_active,
             a.bank_name,
             a.iban_no,
             a.account_name,
             a.c3_card_no,
             a.remarks,
             a.created_by,
             a.created_dt
      from hr_emp_pay_modes a
      left join hr_pay_mode_master pm
        on pm.pay_mode_code = a.pay_mode_code
      where a.emp_id = :P100_EMP_ID
      order by a.effective_from desc, a.pay_rec_id desc

