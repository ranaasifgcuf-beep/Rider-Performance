- # ====== Region: Employee List ===============================
  id: 65799937283242682
  identification: 
    name: Employee List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select v.*
      from vw_hr_employee_list v
      where (:P151_CITY is null
             or current_city_id = :P151_CITY)
        and (:P151_PROJECT is null
             or current_project_id = :P151_PROJECT)
        and (:P151_STATUS is null
             or CURRENT_STATUS_CODE = :P151_STATUS)
        and (:P151_WORKER_TYPE is null
             or worker_type = :P151_WORKER_TYPE)
         and (:P151_EMPLOYEE IS NULL OR 
         EMP_ID = :P151_EMPLOYEE)
      order by emp_id desc
    page-items-to-submit: 
    - P151_EMPLOYEE
    - P151_CITY
    - P151_PROJECT
    - P151_STATUS
    - P151_WORKER_TYPE

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

