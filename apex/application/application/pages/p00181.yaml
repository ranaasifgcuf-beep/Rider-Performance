css: 
  inline: |
    /* ------------------------------
       Filter bar
    --------------------------------*/
    #doc_filters .t-Region-body {
        padding: 12px 14px !important;
    }
    
    #doc_filters .t-Form-fieldContainer {
        margin-bottom: 0 !important;
    }
    
    #doc_filters .t-Form-label {
        font-size: 11px;
        font-weight: 700;
        color: #475569;
    }
    
    #doc_filters select,
    #doc_filters input {
        min-height: 36px;
    }
    
    /* ------------------------------
       KPI Cards
    --------------------------------*/
    .doc-kpi-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr));
        gap: 12px;
    }
    
    .doc-kpi-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-left: 4px solid #2563eb;
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        min-height: 82px;
    }
    
    .doc-kpi-card.success {
        border-left-color: #15803d;
    }
    
    .doc-kpi-card.warning {
        border-left-color: #d97706;
    }
    
    .doc-kpi-card.danger {
        border-left-color: #dc2626;
    }
    
    .doc-kpi-label {
        font-size: 10px;
        text-transform: uppercase;
        color: #334155;
        font-weight: 800;
        letter-spacing: .03em;
    }
    
    .doc-kpi-value {
        font-size: 25px;
        font-weight: 900;
        color: #0f172a;
        margin-top: 5px;
        line-height: 1;
    }
    
    .doc-kpi-card.success .doc-kpi-value {
        color: #15803d;
    }
    
    .doc-kpi-card.warning .doc-kpi-value {
        color: #d97706;
    }
    
    .doc-kpi-card.danger .doc-kpi-value {
        color: #dc2626;
    }
    
    .doc-kpi-sub {
        font-size: 10px;
        color: #64748b;
        margin-top: 6px;
    }
    
    /* ------------------------------
       Tabs
    --------------------------------*/
    #doc_monitor_tabs {
        margin-top: 14px;
    }
    
    #doc_monitor_tabs .t-Tabs-link {
        font-weight: 700;
    }
    
    /* ------------------------------
       Reports
    --------------------------------*/
    #doc_expired_docs th,
    #doc_expiring_docs th,
    #doc_missing_docs th,
    #doc_all_monitor th {
        background: #f8fafc !important;
        color: #334155 !important;
        font-weight: 800 !important;
        font-size: 12px;
    }
    
    #doc_expired_docs td,
    #doc_expiring_docs td,
    #doc_missing_docs td,
    #doc_all_monitor td {
        padding: 9px 10px !important;
        vertical-align: middle;
    }
    
    #doc_expired_docs .fa-folder-open,
    #doc_expiring_docs .fa-folder-open,
    #doc_missing_docs .fa-folder-open,
    #doc_all_monitor .fa-folder-open {
        font-size: 15px;
    }
    
    /* Responsive */
    @media (max-width: 1200px) {
        .doc-kpi-grid {
            grid-template-columns: repeat(3, minmax(140px, 1fr));
        }
    }
    
    @media (max-width: 700px) {
        .doc-kpi-grid {
            grid-template-columns: repeat(1, minmax(140px, 1fr));
        }
    }
    
    #btn_reset_filters {
        margin-top: 15px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    
    #doc_filters .t-Form-fieldContainer {
        margin-bottom: 0 !important;
    }
    
    #doc_filters .t-ButtonRegion {
        margin-top: 0 !important;
    }

