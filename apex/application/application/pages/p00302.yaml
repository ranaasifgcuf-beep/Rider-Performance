processes: 
- # ====== Process: Fetch Record ===============================
  id: 17729096683086142
  identification: 
    name: Fetch Record
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      IF :P302_BIKE_ID IS NOT NULL THEN
      select bike_code,
             plate_no,
             plate_emirate,
             chassis_no,
             engine_no,
             model_id,
             model_year,
             color_id,
             ownership_type,
             vendor_id,
             purchase_dt,
             purchase_amount,
             current_monthly_rent,
             contract_start_dt,
             contract_end_dt,
             remarks,
             is_active
        into :P302_BIKE_CODE,
             :P302_PLATE_NO,
             :P302_PLATE_EMIRATE,
             :P302_CHASSIS_NO,
             :P302_ENGINE_NO,
             :P302_MODEL_ID,
             :P302_MODEL_YEAR,
             :P302_COLOR_ID,
             :P302_OWNERSHIP_TYPE,
             :P302_VENDOR_ID,
             :P302_PURCHASE_DT,
             :P302_PURCHASE_AMOUNT,
             :P302_CURRENT_MONTHLY_RENT,
             :P302_CONTRACT_START_DT,
             :P302_CONTRACT_END_DT,
             :P302_REMARKS,
             :P302_IS_ACTIVE
        from fleet_bikes
       where bike_id = :P302_BIKE_ID;
       END IF;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Create Bike ================================
  id: 17729437611086146
  identification: 
    name: Create Bike
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_bike_id   number;
          l_bike_code varchar2(30);
      begin
          fleet_pkg.create_bike(
              p_plate_no             => :P302_PLATE_NO,
              p_plate_emirate        => :P302_PLATE_EMIRATE,
              p_chassis_no           => :P302_CHASSIS_NO,
              p_engine_no            => :P302_ENGINE_NO,
              p_model_id             => :P302_MODEL_ID,
              p_model_year           => :P302_MODEL_YEAR,
              p_color_id             => :P302_COLOR_ID,
              p_ownership_type       => :P302_OWNERSHIP_TYPE,
              p_vendor_id            => :P302_VENDOR_ID,
              p_purchase_dt          => :P302_PURCHASE_DT,
              p_purchase_amount      => :P302_PURCHASE_AMOUNT,
              p_current_monthly_rent => :P302_CURRENT_MONTHLY_RENT,
              p_contract_start_dt    => :P302_CONTRACT_START_DT,
              p_contract_end_dt      => :P302_CONTRACT_END_DT,
              p_remarks              => :P302_REMARKS,
              p_initial_status       => :P302_INITIAL_STATUS,
              p_initial_custody      => :P302_INITIAL_CUSTODY,
              p_initial_location_id  => :P302_INITIAL_LOCATION_ID,
              p_effective_ts         => systimestamp,
              p_bike_id              => l_bike_id,
              p_bike_code            => l_bike_code
          );
      
          :P302_BIKE_ID   := l_bike_id;
          :P302_BIKE_CODE := l_bike_code;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Record successfuly creted

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: PB_CREATE # 17729108661086143

- # ====== Process: Update Bike ================================
  id: 17729606581086148
  identification: 
    name: Update Bike
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          fleet_pkg.validate_bike_master(
              p_bike_id              => :P302_BIKE_ID,
              p_plate_no             => :P302_PLATE_NO,
              p_ownership_type       => :P302_OWNERSHIP_TYPE,
              p_vendor_id            => :P302_VENDOR_ID,
              p_purchase_amount      => :P302_PURCHASE_AMOUNT,
              p_current_monthly_rent => :P302_CURRENT_MONTHLY_RENT,
              p_contract_start_dt    => :P302_CONTRACT_START_DT,
              p_contract_end_dt      => :P302_CONTRACT_END_DT
          );
      
      ---- Update----
      
      update fleet_bikes
         set plate_no             = :P302_PLATE_NO,
             plate_emirate        = :P302_PLATE_EMIRATE,
             chassis_no           = :P302_CHASSIS_NO,
             engine_no            = :P302_ENGINE_NO,
             model_id             = :P302_MODEL_ID,
             model_year           = :P302_MODEL_YEAR,
             color_id             = :P302_COLOR_ID,
             ownership_type       = :P302_OWNERSHIP_TYPE,
             vendor_id            = :P302_VENDOR_ID,
             purchase_dt          = :P302_PURCHASE_DT,
             purchase_amount      = :P302_PURCHASE_AMOUNT,
             current_monthly_rent = :P302_CURRENT_MONTHLY_RENT,
             contract_start_dt    = :P302_CONTRACT_START_DT,
             contract_end_dt      = :P302_CONTRACT_END_DT,
             remarks              = :P302_REMARKS,
             is_active            = :P302_IS_ACTIVE
       where bike_id = :P302_BIKE_ID;
      
      
      end;

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

