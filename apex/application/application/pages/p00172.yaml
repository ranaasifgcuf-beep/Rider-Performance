- # ====== Page Item: P172_REVERSAL_OF_TXN_ID ==================
  id: 35771233351306909
  identification: 
    name: P172_REVERSAL_OF_TXN_ID
    type: Select List

  label: 
    label: Reversal Reference
    alignment: Left

  settings: 
    page-action-on-selection: None

  multiple-values: 
    type: No

  layout: 
    sequence: 90
    region: Transaction Request # 35771574482306912
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      select case t.txn_type
                 when 'PAYROLL_DEDUCTION' then 'Payroll Deduction'
                 when 'MANUAL_PAYMENT' then 'Manual Payment'
                 when 'WAIVER' then 'Waiver'
                 when 'ADJUSTMENT' then 'Adjustment'
                 when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                 when 'REVERSAL' then 'Reversal'
                 else t.txn_type
             end
             || ' | AED ' || to_char(t.amount, '999G999G990D00')
             || ' | ' || to_char(t.txn_date, 'DD-MON-YYYY') d,
             t.loan_txn_id r
      from hr_emp_loan_txns t
      where t.loan_id = :P172_LOAN_ID
        and t.approval_status = 'APPROVED'
        and t.txn_type <> 'REVERSAL'
        and not exists (
              select 1
              from hr_emp_loan_txns r
              where r.reversal_of_txn_id = t.loan_txn_id
                and r.approval_status in ('SUBMITTED','APPROVED')
        )
      order by t.txn_date desc, t.loan_txn_id desc;
    display-extra-values: false
    display-null-value: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Null
    used: Only when current value in session state is null

  session-state: 
    storage: Per Session (Persistent)

  quick-picks: 
    show-quick-picks: false

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

