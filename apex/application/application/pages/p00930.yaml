- # ====== Page Item: P930_PERM_IDS ============================
  id: 9837471519147110
  identification: 
    name: P930_PERM_IDS
    type: Shuttle

  label: 
    label: Perm Ids
    alignment: Left

  settings: 
    show-controls: All

  multiple-values: 
    type: Delimited List
    separator: ':'

  layout: 
    sequence: 20
    region: Roles -> Permissions # 9837243399147108
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 5

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      select m.module_code||' - '||perm_name d, perm_id r
      from sec_perms p,
      sec_modules m
      where p.is_active='Y'
      and p.module_id = m.module_id
      order by m.module_id, perm_name
    display-extra-values: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      declare
        l_list varchar2(32767);
      begin
        select listagg(rp.perm_id, ':') within group (order by rp.perm_id)
          into l_list
          from sec_role_perms rp
         where rp.role_id = :P930_ROLE_ID;
      
        return l_list;
      end;
    used: Only when current value in session state is null

  session-state: 
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

