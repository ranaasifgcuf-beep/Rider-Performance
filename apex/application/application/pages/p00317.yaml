- # ====== Region: Action Required / Critical Fleet Cases ======
  id: 30755265588815246
  identification: 
    name: Action Required / Critical Fleet Cases
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select *
      from (
          select
              b.bike_code,
              b.plate_no,
              'IMPOUND OVERDUE' issue_type,
              trunc(sysdate) - trunc(cast(i.expected_release_ts as date)) days_pending,
              i.emp_id,
              v.employee_name,
              v.emp_code,
              v.current_project,
              hr_charges_pkg.get_charge_balance(i.emp_charge_id) pending_amount,
              '<span class="t-Badge t-Badge--danger">IMPOUND OVERDUE</span>' issue_badge,
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 312,
                  p_items  => 'P312_IMPOUND_ID',
                  p_values => i.impound_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-unlock" title="Release Impound"></span></a>' action_link
          from fleet_bike_impounds i
          join fleet_bikes b on b.bike_id = i.bike_id
          left join vw_fleet_bike_current v on v.bike_id = i.bike_id
          where i.status_code = 'ACTIVE'
            and i.release_ts is null
            and i.expected_release_ts is not null
            and i.expected_release_ts < systimestamp
      
          union all
      
          select
              b.bike_code,
              b.plate_no,
              'ACCIDENT OPEN' issue_type,
              trunc(sysdate) - a.accident_dt days_pending,
              a.emp_id,
              EMP.FULL_employee_name,
              EMP.emp_code,
              EMP.current_project,
              hr_charges_pkg.get_charge_balance(a.emp_charge_id) pending_amount,
              '<span class="t-Badge t-Badge--danger">ACCIDENT OPEN</span>' issue_badge,
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 315,
                  p_items  => 'P315_ACCIDENT_ID',
                  p_values => a.accident_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-wrench" title="Start Repair"></span></a>' action_link
          from fleet_bike_accidents a
          join fleet_bikes b on b.bike_id = a.bike_id
          left join vw_fleet_bike_current v on v.bike_id = a.bike_id
          LEFT JOIN VW_HR_EMPLOYEE_LIST EMP
          ON EMP.EMP_ID = A.EMP_ID
          where a.status_code = 'OPEN'
            and (trunc(sysdate) - a.accident_dt >= 3 Or trunc(sysdate) - a.accident_dt <0)
      
          union all
      
          select
              b.bike_code,
              b.plate_no,
              'REPAIR PENDING' issue_type,
              trunc(sysdate) - a.repair_start_dt days_pending,
              a.emp_id,
              v.employee_name,
              v.emp_code,
              v.current_project,
              hr_charges_pkg.get_charge_balance(a.emp_charge_id) pending_amount,
              '<span class="t-Badge t-Badge--warning">REPAIR PENDING</span>' issue_badge,
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 316,
                  p_items  => 'P316_ACCIDENT_ID',
                  p_values => a.accident_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-check" title="Close Accident"></span></a>' action_link
          from fleet_bike_accidents a
          join fleet_bikes b on b.bike_id = a.bike_id
          left join vw_fleet_bike_current v on v.bike_id = a.bike_id
          where a.status_code = 'UNDER_REPAIR'
            and a.repair_start_dt is not null
            and trunc(sysdate) - a.repair_start_dt >= 3
      
          union all
      
          select
              v.bike_code,
              v.plate_no,
              'AVAILABLE IDLE' issue_type,
              nvl(trunc(sysdate) - trunc(cast(v.status_from_dt as date)),0) days_pending,
              null emp_id,
              null employee_name,
              null emp_code,
              v.current_project,
              null pending_amount,
              '<span class="t-Badge t-Badge--warning">IDLE READY</span>' issue_badge,
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 303,
                  p_items  => 'P303_BIKE_ID',
                  p_values => v.bike_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-key" title="Assign Bike"></span></a>' action_link
          from vw_fleet_bike_current v
          where v.is_active = 'Y'
            and v.bike_status_code = 'AVAILABLE'
            and (nvl(trunc(sysdate) - trunc(cast(v.status_from_dt as date)),0) >= 3 or
            nvl(trunc(sysdate) - trunc(cast(v.status_from_dt as date)),0) < 0)
      )
      order by days_pending desc
      fetch first 20 rows only

