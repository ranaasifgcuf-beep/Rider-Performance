validations: 
- # ====== Validation: Check Current and New Pay Method ========
  id: 16147217707477411
  identification: 
    name: Check Current and New Pay Method

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      declare
        l_cnt number;
      begin
        select count(*)
        into l_cnt
        from hr_emp_pay_modes
        where emp_id = :P112_EMP_ID
          and is_active = 'Y'
          and pay_mode_code = :P112_NEW;
      
        if l_cnt > 0 then
          return 'This pay mode is already active for the employee.';
        end if;
      
        return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

processes: 
- # ====== Process: Change Method API ==========================
  id: 16142086303555863
  identification: 
    name: Change Method API
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
        hr_pay_mode_pkg.add_pay_mode(
          p_emp_id         => :P112_EMP_ID,
          p_pay_mode_code  => :P112_NEW,
          p_effective_from => sysdate,
          p_is_primary     => 'Y',
          p_bank_name      => :P112_BANK,
          p_iban_no        => :P112_IBAN,
          p_account_name   => :P112_ACCOUNT,
          p_c3_card_no     => :P112_CARD,
          p_remarks        => :P112_REMARKS
        );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Employee status updated successfully.

  error: 
    display-location: Inline in Notification

