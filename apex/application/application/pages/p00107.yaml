- # ====== Validation: Block Vacation If Bike Assigned =========
  id: 40937100824733946
  identification: 
    name: Block Vacation If Bike Assigned

  execution: 
    sequence: 70

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      declare
          l_bike_count number;
      begin
          if :P107_NEW_STATUS = 'VACATION' then
      
              select count(*)
                into l_bike_count
                from vw_hr_emp_current_bike
               where emp_id = :P107_EMP_ID;
      
              if l_bike_count > 0 then
                  return 'Bike is currently assigned to this employee. Please return bike before marking Vacation.';
              end if;
      
          end if;
      
          return null;
      end;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

