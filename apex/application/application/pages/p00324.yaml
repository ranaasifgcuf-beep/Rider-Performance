processes: 
- # ====== Process: CREATE_REQUEST =============================
  id: 40337566881681339
  identification: 
    name: CREATE_REQUEST
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      declare
          l_request_id number;
      begin
          l_request_id := hr_bike_req_pkg.create_request(
              p_emp_id               => :P324_EMP_ID,
              p_request_type         => :P324_REQUEST_TYPE,
              p_priority             => :P324_PRIORITY,
              p_required_by_dt       => :P324_REQUIRED_BY_DT,
              p_requested_project_id => :P324_REQUESTED_PROJECT_ID,
              p_requested_city_id    => :P324_REQUESTED_CITY_ID,
              p_reason_code          => :P324_REASON_CODE,
              p_remarks              => :P324_REQUEST_REMARKS
          );
      
          apex_application.g_print_success_message :=
              'Bike request created successfully. Request ID: ' || l_request_id;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

