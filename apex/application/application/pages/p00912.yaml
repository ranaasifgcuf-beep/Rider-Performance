processes: 
- # ====== Process: Populate User Details ======================
  id: 9839093500147126
  identification: 
    name: Populate User Details
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |2
        select username, full_name, email,  case when is_active = 'Y' then
         'Active'
          else
            'Inactive'
        end as is_active_disp
        into :P912_USERNAME, :P912_FULL_NAME, :P912_EMAIL, :P912_IS_ACTIVE
        from sec_users
       where user_id = :P912_USER_ID;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Save =======================================
  id: 9840974563147145
  identification: 
    name: Save
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
        -- ROLES
        delete from sec_user_roles where user_id = :P912_USER_ID;
      
        if :P912_ROLE_IDS is not null then
          for r in (
            select to_number(column_value) v
            from table(apex_string.split(:P912_ROLE_IDS, ':'))
          ) loop
            insert into sec_user_roles(user_id, role_id)
            values (:P912_USER_ID, r.v);
          end loop;
        end if;
      
        -- ORGS
        delete from sec_user_orgs where user_id = :P912_USER_ID;
      
        if :P912_ORG_IDS is not null then
          for o in (
            select to_number(column_value) v
            from table(apex_string.split(:P912_ORG_IDS, ':'))
          ) loop
            insert into sec_user_orgs(user_id, org_id)
            values (:P912_USER_ID, o.v);
          end loop;
        end if;
      
        -- PROJECTS
        delete from sec_user_projects where user_id = :P912_USER_ID;
      
        if :P912_PROJECT_IDS is not null then
          for p in (
            select to_number(column_value) v
            from table(apex_string.split(:P912_PROJECT_IDS, ':'))
          ) loop
            insert into sec_user_projects(user_id, project_id)
            values (:P912_USER_ID, p.v);
          end loop;
        end if;
      end;
      

  execution: 
    sequence: 10
    point: After Submit
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: BTN_SAVE # 9840839641147144

