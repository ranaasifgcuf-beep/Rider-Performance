- # ====== Region: Users Management ============================
  id: 9753744628484286
  identification: 
    name: Users Management
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select USER_ID,
             USERNAME,
       FULL_NAME,
             EMAIL,
             IS_ACTIVE,
             case
          when is_active = 'Y' then
            '<span class="t-Badge t-Badge--success">Active</span>'
          else
            '<span class="t-Badge t-Badge--danger">Inactive</span>'
        end as is_active_disp,
             LAST_LOGIN_ON,
             null as Actions,
             apex_page.get_url(
          p_page  => 911,
          p_items => 'P911_USER_ID',
          p_values=> user_id
        ) as edit_url,
      
        apex_page.get_url(
          p_page  => 913,
          p_items => 'P913_USERNAME',
          p_values=> username
        ) as reset_url,
      
          apex_page.get_url(
          p_page  => 912,
          p_items => 'P912_USER_ID',
          p_values=> user_id
        )  as access_url
        from SEC_USERS

  layout: 
