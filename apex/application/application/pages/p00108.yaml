- # ====== Region: Active Fleet ================================
  id: 15332503252284943
  identification: 
    name: Active Fleet
    title: Active Fleet <span class="t-Badge t-Badge--success t-Badge--large">&P108_ACTIVE_CNT.</span>
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select a.asg_id,
             e.emp_id,
             e.emp_code,
             e.full_employee_name as employee_name,
             p.project_name,
             c.city_name,
             a.start_dt,
             a.end_dt,
             a.status assignment_status,
      
             sup.emp_code || ' - ' || sup.first_name || ' ' || sup.last_name as supervisor_name,
      
             e.current_status_code as current_status,
             e.current_status_name,
             e.status_badge_text,
      
             e.current_legal_code,
             e.current_legal_name,
      
             case
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') = 'VALID' then
                     '<span class="t-Badge t-Badge--success">Valid</span>'
      
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                     'IN_PROCESS',
                     'ON_HOLD',
                     'UNKNOWN'
                 ) then
                     '<span class="t-Badge t-Badge--warning">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Not Set')) ||
                     '</span>'
      
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                     'ABSCONDING',
                     'ABSCONDER',
                     'EXPIRED',
                     'EMPLOYEE_COMPLAINT',
                     'CANCELLED_MOHRE',
                     'CANCELLED_ICP',
                     'CANCELLED'
                 ) then
                     '<span class="t-Badge t-Badge--danger">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Risk')) ||
                     '</span>'
      
                 else
                     '<span class="t-Badge t-Badge--warning">Not Set</span>'
             end as legal_status_badge,
      
             null as unassign_link,
             a.agg_rider_id as project_rider_id,
             jb.job_name,
      ac.current_bike_badge as current_bike,
        e.worker_type,
             e.supplier_name
      from hr_assignments a
      
      join ref_jobs jb
        on jb.job_id = a.job_id
      
      join vw_hr_employee_list e
        on e.emp_id = a.emp_id
      join vw_hr_emp_asset_control ac
        on ac.emp_id = e.emp_id
      
      join hr_projects p
        on p.project_id = a.project_id
      
      join ref_cities c
        on c.city_id = a.city_id
      
      left join hr_employees sup
        on sup.emp_id = a.supervisor_emp_id
      
      where a.end_dt is null
      
        -- Active Fleet means employee is operationally working
        and upper(nvl(e.current_status_code, 'NO_STATUS')) = 'ACTIVE'
      
      order by a.asg_id desc;

