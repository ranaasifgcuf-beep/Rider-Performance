- # ====== Region: Vacations Queue =============================
  id: 17469063736113818
  identification: 
    name: Vacations Queue
    title: Vacations Queue <span class="t-Badge t-Badge--success t-Badge--large">&P108_VACATION_CNT.</span>
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select e.emp_id,
             e.emp_code,
             e.first_name || ' ' || e.last_name as full_name,
             e.agreed_project,
             e.agreed_city,
      
             e.current_status_code as current_status,
             e.current_status_name,
             e.status_badge_text,
      
             e.current_legal_code,
             e.current_legal_name,
      
             case
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') = 'VALID' then
                     '<span class="t-Badge t-Badge--success">Valid</span>'
      
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                     'IN_PROCESS',
                     'ON_HOLD',
                     'UNKNOWN'
                 ) then
                     '<span class="t-Badge t-Badge--warning">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Not Set')) ||
                     '</span>'
      
                 when replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') in (
                     'ABSCONDING',
                     'ABSCONDER',
                     'EXPIRED',
                     'EMPLOYEE_COMPLAINT',
                     'CANCELLED_MOHRE',
                     'CANCELLED_ICP',
                     'CANCELLED'
                 ) then
                     '<span class="t-Badge t-Badge--danger">' ||
                     apex_escape.html(nvl(e.current_legal_name,'Risk')) ||
                     '</span>'
      
                 else
                     '<span class="t-Badge t-Badge--warning">Not Set</span>'
             end as legal_status_badge,
      
             e.worker_type,
             e.supplier_name,
             e.last_project,
             e.last_city,
      
             null as assign_link,
      
             '<span class="fa fa-check-circle text-success" aria-hidden="true"></span>' as ready_link,
             '<span class="fa fa-exclamation-triangle" aria-hidden="true"></span>' as accident_link,
      
             e.job_name,
      
             hs.leave_start_date,
             hs.leave_end_date,
             hs.leave_reason,
               case
                 when hs.leave_end_date < trunc(sysdate) then
                     '<span class="t-Badge t-Badge--danger">Overdue</span>'
                 when hs.leave_end_date <= trunc(sysdate) + 3 then
                     '<span class="t-Badge t-Badge--warning">Returning Soon</span>'
                 else
                     '<span class="t-Badge t-Badge--success">On Vacation</span>'
             end as vacation_status_badge,
      
             case
                 when hs.leave_start_date is not null then
                     round(trunc(sysdate) - trunc(hs.leave_start_date))
             end as leave_days,
               ac.current_bike_badge as current_bike,
             ac.asset_risk_badge   as asset_risk
      
      from vw_hr_employee_list e
      join vw_hr_emp_asset_control ac
        on ac.emp_id = e.emp_id
      
      left join hr_emp_status_hist hs
             on hs.emp_id = e.emp_id
            and hs.effective_to is null
      
      where not exists (
              select 1
                from hr_assignments a
               where a.emp_id = e.emp_id
                 and a.end_dt is null
            )
      
        and upper(nvl(e.current_status_code,'PIPELINE')) = 'VACATION'
      
        and replace(upper(nvl(e.current_legal_code,'NOT_SET')), 'LEGAL_', '') not in (
              'ABSCONDING',
              'ABSCONDER'
            )
      
      order by e.emp_code;

