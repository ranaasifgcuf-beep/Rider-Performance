- # ====== Region: SIM Request History =========================
  id: 43121072477325634
  identification: 
    name: SIM Request History
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select sr.request_id,
             sr.emp_id,
      
             e.emp_code,
             e.full_employee_name as employee_name,
             e.job_name,
             e.worker_type,
             e.supplier_name,
      
             sr.request_type,
             sr.request_status,
      
             case sr.request_status
                 when 'ASSIGNED' then
                     '<span class="t-Badge t-Badge--success">Assigned</span>'
                 when 'REJECTED' then
                     '<span class="t-Badge t-Badge--danger">Rejected</span>'
                 when 'CANCELLED' then
                     '<span class="t-Badge t-Badge--normal">Cancelled</span>'
                 when 'CLOSED' then
                     '<span class="t-Badge t-Badge--success">Closed</span>'
                 else
                     '<span class="t-Badge t-Badge--warning">' || sr.request_status || '</span>'
             end as status_badge,
      
             sr.priority,
      
             p.project_name as requested_project,
             c.city_name    as requested_city,
      
             sr.requested_by,
             to_char(sr.requested_dt, 'DD-MON-YYYY HH24:MI') as requested_dt,
             to_char(sr.required_by_dt, 'DD-MON-YYYY') as required_by_dt,
      
             fs1.mobile_no as current_sim_no,
             fs2.mobile_no as assigned_sim_no,
      
             sr.reason_code,
             sr.request_remarks,
             sr.rejection_reason,
             sr.cancellation_reason,
      
             sr.closed_by,
             to_char(sr.closed_dt, 'DD-MON-YYYY HH24:MI') as closed_dt,
      
             sr.sim_assign_id,
      
             '<a href="' ||
             apex_util.prepare_url(
                 'f?p=' || :APP_ID || ':335:' || :APP_SESSION ||
                 '::NO::P335_REQUEST_ID:' || sr.request_id
             ) ||
             '" class="sim-action-btn" title="View Request Log">' ||
             '<span class="fa fa-history" aria-hidden="true"></span>' ||
             '</a>' as history_action
      
      from hr_sim_requests sr
      
      join vw_hr_employee_list e
        on e.emp_id = sr.emp_id
      
      left join hr_projects p
        on p.project_id = sr.requested_project_id
      
      left join ref_cities c
        on c.city_id = sr.requested_city_id
      
      left join fleet_sims fs1
        on fs1.sim_id = sr.current_sim_id
      
      left join fleet_sims fs2
        on fs2.sim_id = sr.assigned_sim_id
      
      where sr.request_status not in ('OPEN','IN_PROGRESS')
      
        and (
              :P334_STATUS is null
           or :P334_STATUS = 'CLOSED_ONLY'
              and sr.request_status in ('ASSIGNED','REJECTED','CANCELLED','CLOSED')
           or :P334_STATUS = 'ASSIGNED'
              and sr.request_status = 'ASSIGNED'
           or :P334_STATUS = 'REJECTED'
              and sr.request_status = 'REJECTED'
           or :P334_STATUS = 'CANCELLED'
              and sr.request_status = 'CANCELLED'
           or :P334_STATUS = 'ALL_HISTORY'
            )
      
      and (
            v('P334_FROM_DT') is null
            or sr.closed_dt >= to_date(v('P334_FROM_DT'), 'DD-MON-YYYY')
          )
      
      and (
            v('P334_TO_DT') is null
            or sr.closed_dt < to_date(v('P334_TO_DT'), 'DD-MON-YYYY') + 1
          )
      
        and (
              :P334_EMP_ID is null
              or sr.emp_id = :P334_EMP_ID
            )
      
      order by sr.closed_dt desc nulls last,
               sr.request_id desc;
    page-items-to-submit: 
    - P334_STATUS
    - P334_FROM_DT
    - P334_TO_DT
    - P334_EMP_ID

