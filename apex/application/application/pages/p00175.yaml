- # ====== Region: Approval Step History =======================
  id: 37243660944914216
  identification: 
    name: Approval Step History
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select r.approval_id,
             case r.module_code
                 when 'LOAN_MASTER' then 'Loan Creation'
                 when 'LOAN_TXN' then 'Loan Transaction'
                 else r.module_code
             end approval_type,
             r.approval_subject,
             s.step_seq,
             s.step_name,
             s.approver_users,
             case s.step_status
          when 'APPROVED' then '<span class="t-Badge t-Badge--success">Approved</span>'
          when 'TASK_CREATED' then '<span class="t-Badge t-Badge--warning">Pending</span>'
          when 'PENDING' then '<span class="t-Badge">Waiting</span>'
          when 'REJECTED' then '<span class="t-Badge t-Badge--danger">Rejected</span>'
          when 'CANCELLED' then '<span class="t-Badge">Cancelled</span>'
          else '<span class="t-Badge">' || apex_escape.html(s.step_status) || '</span>'
      end step_status,
             s.action_by,
             to_char(s.action_dt, 'DD-MON-YYYY HH24:MI') action_dt,
             s.comments
      from hr_approval_request_steps s
      join hr_approval_requests r
        on r.approval_id = s.approval_id
      where (
              :P175_LOAN_TXN_ID is null
              and r.module_code = 'LOAN_MASTER'
              and r.record_pk = :P175_LOAN_ID
            )
         or (
              r.module_code = 'LOAN_TXN'
              and exists (
                  select 1
                    from hr_emp_loan_txns t
                   where t.loan_txn_id = r.record_pk
                     and t.loan_id = :P175_LOAN_ID
                     and (
                          :P175_LOAN_TXN_ID is null
                          or t.loan_txn_id = :P175_LOAN_TXN_ID
                     )
              )
            )
      order by r.approval_id desc, s.step_seq;

  order-by: 
