- # ====== Page Item: P320_APPROVAL_STATUS_DISP ================
  id: 19943622720968043
  identification: 
    name: P320_APPROVAL_STATUS_DISP
    type: Hidden

  settings: 
    value-protected: true

  layout: 
    sequence: 70
    region: Charge Details # 19943287376968039
    slot: BODY

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: SQL Query (return single value)
    sql-query: |
      select case :P320_APPROVAL_STATUS
               when 'APPROVED' then '<span class="t-Badge t-Badge--success">APPROVED</span>'
               when 'DRAFT' then '<span class="t-Badge t-Badge--warning">DRAFT</span>'
               when 'CANCELLED' then '<span class="t-Badge t-Badge--danger">CANCELLED</span>'
               when 'CLOSED' then '<span class="t-Badge t-Badge--info">CLOSED</span>'
               when 'BAD_DEBT' then '<span class="t-Badge t-Badge--danger">BAD DEBT</span>'
               else '<span class="t-Badge">N/A</span>'
             end
      from dual
    used: Only when current value in session state is null

  default: 
    type: Static
    static-value: APPROVED

  session-state: 
    data-type: VARCHAR2
    storage: Per Request (Memory Only)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

