- # ====== Process: Fetch Bike Details =========================
  id: 16326517888664128
  identification: 
    name: Fetch Bike Details
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      select 
             plate_no
        into 
             :P307_PLATE_NO
        from fleet_bikes
       where bike_id = :P307_BIKE_ID;

  execution: 
