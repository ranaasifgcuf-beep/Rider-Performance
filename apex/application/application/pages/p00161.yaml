    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Region

  advanced: 
    static-id: performance-chart
    region-display-selector: false
    exclude-title-from-translation: false

  security: 
    escape-special-characters: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 34850546275345551
    chart: 
      type: Bar

    appearance: 
      orientation: Horizontal
      stack: false

    data-cursor: 
      cursor: Automatic
      behavior: Automatic
      dim-on-hover: true

    multi-series-chart-data: 
      fill-gaps-in-chart-data: true
      sort-order: Label - Ascending
      render-gap-as-zero: true

    settings: 
      time-axis-type: Automatic
      zoom-and-scroll: No

    animation: 
      on-display: Automatic
      on-data-change: Automatic

    tooltip: 
      show: true
      show-series-name: false
      show-group-name: true
      show-value: true

    legend: 
      show: false

    messages: 
      when-no-data-found: No Completed or Terminated Workflows found

    series: 
    - # ====== Series: Average Completion Time =====================
      id: 34851045705345551
      identification: 
        name: Average Completion Time

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select
            workflow_def_name,
            avg( duration_seconds ) / 
            case :P161_TIME_UNIT
                  when 'SEC' then 1
                  when 'MIN' then 60
                  when 'HOUR' then 3600
                  when 'DAY' then ( 3600 * 24 )
             end  as avg_time
           from table ( apex_workflow.get_workflows (
                             p_context => 'ADMIN_WORKFLOWS'
                             --, p_application_id => :APP_ID
                             ) )    
          where state_code in ('COMPLETED','TERMINATED')        
          group by workflow_def_name
        page-items-to-submit: 
        - P161_TIME_UNIT

      order-by: 
        type: None

      column-mapping: 
        label: WORKFLOW_DEF_NAME
        value: AVG_TIME

      appearance: 
        assigned-to-y2-axis: false

      label: 
        show: false

      performance: 
        maximum-rows-to-process: 50

    axes: 
    - # ====== Axis: x =============================================
      id: 34851620079345552
      identification: 
        name: x
        show-axis: true
        title: Workflows

      value: 
        format-scaling: Automatic
        baseline-scaling: Zero
        scale: Linear

      major-ticks: 
        show: Automatic

      minor-ticks: 
        show: false

      tick-label: 
        show: true
        rotation: true
        position: Outside

    - # ====== Axis: y =============================================
      id: 34852225398345552
      identification: 
        name: y
        show-axis: true
        title: Average Completion Time

      value: 
        format-scaling: Automatic
        baseline-scaling: Zero
        scale: Linear

      appearance: 
        position: Automatic

      major-ticks: 
        show: Automatic

      minor-ticks: 
        show: false

      tick-label: 
        show: true

