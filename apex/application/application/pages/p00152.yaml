- # ====== Region: Employees Current Documents Record ==========
  id: 17674897285544549
  identification: 
    name: Employees Current Documents Record
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with doc_latest as (
          select d.emp_id,
                 upper(d.doc_type) as doc_type,
                 d.doc_no,
                 d.issue_dt,
                 d.expiry_dt,
                 row_number() over (
                     partition by d.emp_id, upper(d.doc_type)
                     order by nvl(d.is_current_record,'N') desc,
                              nvl(d.expiry_dt, date '1900-01-01') desc
                 ) as rn
            from hr_emp_docs d
           where upper(d.doc_type) in (
                    'PASSPORT',
                    'EID',
                    'DL',
                    'VISA',
                    'LABOUR CARD'
                 )
      )
      select e.emp_id,
             e.emp_code,
             e.first_name || ' ' || e.last_name as full_name,
             e.current_project as working_project,
             e.current_city as working_city,
             e.current_status_name,
      
             max(case when dl.doc_type = 'PASSPORT' then dl.doc_no end) as passport_no,
             max(case when dl.doc_type = 'PASSPORT' then dl.expiry_dt end) as passport_expiry,
             max(case when dl.doc_type = 'PASSPORT' then
                  case
                      when dl.expiry_dt is null then
                          '<span class="u-warning-text">No Expiry</span>'
                      when trunc(dl.expiry_dt) < trunc(sysdate) then
                          '<span class="u-danger-text u-bold">'
                          || abs(trunc(dl.expiry_dt) - trunc(sysdate)) || ' days ago</span>'
                      when trunc(dl.expiry_dt) <= trunc(sysdate) + 30 then
                          '<span class="u-warning-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                      else
                          '<span class="u-success-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                  end
             end) as passport_days_left,
      
             max(case when dl.doc_type = 'EID' then dl.doc_no end) as eid_no,
             max(case when dl.doc_type = 'EID' then dl.expiry_dt end) as eid_expiry,
             max(case when dl.doc_type = 'EID' then
                  case
                      when dl.expiry_dt is null then
                          '<span class="u-warning-text">No Expiry</span>'
                      when trunc(dl.expiry_dt) < trunc(sysdate) then
                          '<span class="u-danger-text u-bold">'
                          || abs(trunc(dl.expiry_dt) - trunc(sysdate)) || ' days ago</span>'
                      when trunc(dl.expiry_dt) <= trunc(sysdate) + 30 then
                          '<span class="u-warning-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                      else
                          '<span class="u-success-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                  end
             end) as eid_days_left,
      
             max(case when dl.doc_type = 'DL' then dl.doc_no end) as dl_no,
             max(case when dl.doc_type = 'DL' then dl.expiry_dt end) as dl_expiry,
             max(case when dl.doc_type = 'DL' then
                  case
                      when dl.expiry_dt is null then
                          '<span class="u-warning-text">No Expiry</span>'
                      when trunc(dl.expiry_dt) < trunc(sysdate) then
                          '<span class="u-danger-text u-bold">'
                          || abs(trunc(dl.expiry_dt) - trunc(sysdate)) || ' days ago</span>'
                      when trunc(dl.expiry_dt) <= trunc(sysdate) + 30 then
                          '<span class="u-warning-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                      else
                          '<span class="u-success-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                  end
             end) as dl_days_left,
      
             max(case when dl.doc_type = 'VISA' then dl.doc_no end) as visa_no,
             max(case when dl.doc_type = 'VISA' then dl.expiry_dt end) as visa_expiry,
             max(case when dl.doc_type = 'VISA' then
                  case
                      when dl.expiry_dt is null then
                          '<span class="u-warning-text">No Expiry</span>'
                      when trunc(dl.expiry_dt) < trunc(sysdate) then
                          '<span class="u-danger-text u-bold">'
                          || abs(trunc(dl.expiry_dt) - trunc(sysdate)) || ' days ago</span>'
                      when trunc(dl.expiry_dt) <= trunc(sysdate) + 30 then
                          '<span class="u-warning-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                      else
                          '<span class="u-success-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                  end
             end) as visa_days_left,
      
             max(case when dl.doc_type = 'LABOUR CARD' then dl.doc_no end) as labour_card_no,
             max(case when dl.doc_type = 'LABOUR CARD' then dl.expiry_dt end) as labour_card_expiry,
             max(case when dl.doc_type = 'LABOUR CARD' then
                  case
                      when dl.expiry_dt is null then
                          '<span class="u-warning-text">No Expiry</span>'
                      when trunc(dl.expiry_dt) < trunc(sysdate) then
                          '<span class="u-danger-text u-bold">'
                          || abs(trunc(dl.expiry_dt) - trunc(sysdate)) || ' days ago</span>'
                      when trunc(dl.expiry_dt) <= trunc(sysdate) + 30 then
                          '<span class="u-warning-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                      else
                          '<span class="u-success-text u-bold">'
                          || (trunc(dl.expiry_dt) - trunc(sysdate)) || ' days</span>'
                  end
             end) as labour_card_days_left
      
      from vw_hr_employee_list e
      left join doc_latest dl
             on dl.emp_id = e.emp_id
            and dl.rn = 1
      group by e.emp_id,
               e.emp_code,
               e.first_name || ' ' || e.last_name,
               e.current_project,
               e.current_city,
               e.current_status_name
      order by e.emp_code desc;

