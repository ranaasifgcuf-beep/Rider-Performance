- # ====== Region: Subject =====================================
  id: 34861037552621634
  identification: 
    name: Subject
    type: Content Row

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select task_id,
             task_type,
             task_def_name,
             details_app_name,
             details_link_target,
             subject,
             initiator,
             actual_owner,
             priority,
             due_on,
             due_in,
             due_in_hours,
             due_code,
             state_code,
             is_completed,
             outcome,
             created_on,
             created_ago,
             created_ago_hours,
             last_updated_on,
             badge_text,
             badge_state
        from table ( apex_human_task.get_tasks (
                         p_context => 'SINGLE_TASK',
                         p_task_id => :P25_TASK_ID ) );

  order-by: 
    type: None

  layout: 
    sequence: 70
    parent-region: No Parent
