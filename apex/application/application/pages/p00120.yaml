processes: 
- # ====== Process: Compute Count ==============================
  id: 16249154971426806
  identification: 
    name: Compute Count
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
        select count(*)
          into :P120_RIDER
          from vw_hr_doc_custody_current
         where current_status = 'WITH_EMPLOYEE';
      
        select count(*)
          into :P120_COMPANY
          from vw_hr_doc_custody_current
         where current_status = 'WITH_COMPANY';
      
        select count(*)
          into :P120_PENDING
          from vw_hr_doc_custody_current
         where current_status = 'PENDING';
      
      end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

