processes: 
- # ====== Process: FETCH_P323_INSTALLMENT_INFO ================
  id: 30151267699037222
  identification: 
    name: FETCH_P323_INSTALLMENT_INFO
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      select installment_no,
             due_dt,
             amount,
             status_code,
             hold_from_dt,
             hold_to_dt,
             payroll_run_ref,
             remarks
        into :P323_INSTALLMENT_NO,
             :P323_DUE_DT,
             :P323_AMOUNT,
             :P323_CURRENT_STATUS,
             :P323_HOLD_FROM_DT,
             :P323_HOLD_TO_DT,
             :P323_PAYROLL_RUN_REF,
             :P323_REMARKS
        from hr_emp_charge_installments
       where installment_id = :P323_INSTALLMENT_ID;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: PROCESS INSTALLMENT ========================
  id: 30151948492037229
  identification: 
    name: PROCESS INSTALLMENT
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          hr_charges_pkg.mark_installment_processed(
              p_installment_id  => :P323_INSTALLMENT_ID,
              p_payroll_run_ref => :P323_PAYROLL_RUN_REF,
              p_remarks         => :P323_REMARKS
          );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: PROCESS_BTN # 30151375575037223

- # ====== Process: HOLD_INSTALLMENT ===========================
  id: 30152022305037230
  identification: 
    name: HOLD_INSTALLMENT
