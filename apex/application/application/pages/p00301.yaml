    name: Fleet Bikes List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          v.bike_id,
      
          '<a href="' ||
          apex_page.get_url(
              p_page   => 302,
              p_items  => 'P302_BIKE_ID',
              p_values => v.bike_id
          ) || '">' ||
          '<span class="fa fa-edit" title="Edit Bike"></span></a>' as edit_link,
      
          '<a href="' ||
          apex_page.get_url(
              p_page   => 307,
              p_items  => 'P307_BIKE_ID',
              p_values => v.bike_id
          ) || '">' ||
          '<span class="fa fa-file" title="Bike Documents"></span></a>' as docs_link,
      
          v.bike_code,
          v.plate_no,
          v.plate_emirate,
          v.model_name,
          v.model_year_label,
          v.color_name,
          v.ownership_type,
          v.vendor_name,
          v.current_monthly_rent,
      
          case
            when v.bike_status_code = 'AVAILABLE' then
              '<span class="t-Badge t-Badge--success">AVAILABLE</span>'
            when v.bike_status_code = 'ASSIGNED' then
              '<span class="t-Badge t-Badge--info">ASSIGNED</span>'
            when v.bike_status_code in ('ACCIDENT','MAINTENANCE') then
              '<span class="t-Badge t-Badge--warning">' || v.bike_status_name || '</span>'
            when v.bike_status_code in ('IMPOUND','POLICE_CUSTODY') then
              '<span class="t-Badge t-Badge--danger">' || v.bike_status_name || '</span>'
            else
              '<span class="t-Badge t-Badge--default">' || nvl(v.bike_status_name,'N/A') || '</span>'
          end as bike_status_badge,
      
          v.custody_type_name,
          v.custody_location_name,
      
          v.mulkiya_expiry_dt,
          case
            when v.mulkiya_bucket = 'NO_DATE' then
              '<span class="t-Badge t-Badge--default">NO DATE</span>'
            when v.mulkiya_bucket = 'EXPIRED' then
              '<span class="t-Badge t-Badge--danger">EXPIRED</span>'
            when v.mulkiya_bucket = 'DUE_SOON' then
              '<span class="t-Badge t-Badge--warning">DUE SOON</span>'
            else
              '<span class="t-Badge t-Badge--success">VALID</span>'
          end as mulkiya_badge,
      
          v.insurance_expiry_dt,
          case
            when v.insurance_bucket = 'NO_DATE' then
              '<span class="t-Badge t-Badge--default">NO DATE</span>'
            when v.insurance_bucket = 'EXPIRED' then
              '<span class="t-Badge t-Badge--danger">EXPIRED</span>'
            when v.insurance_bucket = 'DUE_SOON' then
              '<span class="t-Badge t-Badge--warning">DUE SOON</span>'
            else
              '<span class="t-Badge t-Badge--success">VALID</span>'
          end as insurance_badge,
      
          case
            when v.is_active = 'Y' then
              '<span class="t-Badge t-Badge--success">Active</span>'
            else
              '<span class="t-Badge t-Badge--danger">In Active</span>'
          end as active_badge,
          v.bike_status_code,
          v.mulkiya_bucket,
          v.insurance_bucket,
          v.is_active,
          v.remarks
      from vw_fleet_bike_current v
      order by v.bike_id desc;

