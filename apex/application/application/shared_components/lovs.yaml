- # ====== List of Values: SECURE_PROEJECTS_LOV ================
  id: 15884985584248416
  identification: 
    name: SECURE_PROEJECTS_LOV

  subscription: 
    version-number: 39903795563677

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select p.project_name PROJECT_NAME,
             p.project_id   PROJECT_ID
        from hr_projects p
       where p.is_active = 'Y'
         and exists (
              select 1
                from sec_user_projects up
               where up.user_id    = sec_ctx.user_id
                 and up.project_id = p.project_id
         )
       order by p.project_name

  column-mapping: 
    return: PROJECT_ID
    display: PROJECT_NAME
    default-sort: Use Order By from Query

