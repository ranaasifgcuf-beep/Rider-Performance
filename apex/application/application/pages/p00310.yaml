- # ====== Region: Bike Impound List ===========================
  id: 29709471842591781
  identification: 
    name: Bike Impound List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          i.impound_id,
      
          case
            when i.status_code = 'ACTIVE' then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 312,
                  p_items  => 'P312_IMPOUND_ID',
                  p_values => i.impound_id
              ) || '" class="js-dialog-link">' ||
              '<span class="fa fa-unlock" title="Release Impound"></span></a>'
          end as release_link,
      
          case
            when i.emp_charge_id is not null then
              '<a href="' ||
              apex_page.get_url(
                  p_page   => 320,
                  p_items  => 'P320_EMP_CHARGE_ID',
                  p_values => i.emp_charge_id
              ) || '">' ||
              '<span class="fa fa-money" title="View Charge"></span></a>'
          end as charge_link,
      
          i.bike_id,
          b.bike_code,
          b.plate_no,
          i.emp_id,
          i.impound_start_ts,
          i.expected_release_ts,
          i.release_ts as actual_release_ts,
      
          case
            when i.status_code = 'ACTIVE'
             and i.expected_release_ts is not null
             and i.expected_release_ts < systimestamp then
              '<span class="t-Badge t-Badge--danger">OVERDUE</span>'
            when i.status_code = 'ACTIVE'
             and i.expected_release_ts is not null
             and i.expected_release_ts <= systimestamp + interval '3' day then
              '<span class="t-Badge t-Badge--warning">DUE SOON</span>'
            when i.status_code = 'ACTIVE'
             and i.expected_release_ts is not null then
              '<span class="t-Badge t-Badge--info">PLANNED</span>'
            when i.status_code = 'ACTIVE' then
              '<span class="t-Badge t-Badge--default">NO PLAN</span>'
            else
              '<span class="t-Badge t-Badge--success">CLOSED</span>'
          end as release_plan_badge,
      
          ct.custody_type_name,
          cl.location_name as impound_location_name,
          i.impound_location_text,
          i.impound_reason,
          i.impound_cost,
      
          case
            when i.emp_charge_id is null then
              '<span class="t-Badge t-Badge--default">NO CHARGE</span>'
            when hr_charges_pkg.get_charge_balance(i.emp_charge_id) = 0 then
              '<span class="t-Badge t-Badge--success">RECOVERED/CLOSED</span>'
            else
              '<span class="t-Badge t-Badge--warning">RECOVERY PENDING</span>'
          end as recovery_badge,
      
          case i.status_code
            when 'ACTIVE' then '<span class="t-Badge t-Badge--danger">ACTIVE</span>'
            when 'RELEASED' then '<span class="t-Badge t-Badge--success">RELEASED</span>'
            when 'CANCELLED' then '<span class="t-Badge t-Badge--default">CANCELLED</span>'
          end as status_badge,
      
          i.remarks,
          i.created_by,
          i.created_dt
      from fleet_bike_impounds i
      join fleet_bikes b
        on b.bike_id = i.bike_id
      left join fleet_ref_custody_types ct
        on ct.custody_type_code = i.impound_custody_code
      left join fleet_ref_custody_locations cl
        on cl.location_id = i.impound_location_id
      order by i.impound_start_ts desc, i.impound_id desc

