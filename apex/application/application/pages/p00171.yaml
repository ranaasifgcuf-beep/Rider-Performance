- # ====== Region: Approved Recovery Ledger ====================
  id: 35716807344737509
  identification: 
    name: Approved Recovery Ledger
    title: Approved Recovery Ledger
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select t.loan_txn_id,
             to_char(t.txn_date, 'DD-MON-YYYY') as txn_date,
             to_char(t.payroll_month, 'MON-YYYY') as payroll_month,
      
             case t.txn_type
                 when 'PAYROLL_DEDUCTION' then 'Payroll Deduction'
                 when 'MANUAL_PAYMENT' then 'Manual Payment'
                 when 'WAIVER' then 'Waiver'
                 when 'ADJUSTMENT' then 'Adjustment'
                 when 'REVERSAL' then 'Reversal'
                 when 'BAD_DEBT_WRITE_OFF' then 'Bad Debt Write-off'
                 else t.txn_type
             end as txn_type,
      
             t.amount,
             t.pay_mode,
             t.reference_no,
             t.remarks,
             t.approved_by,
             to_char(t.approved_dt, 'DD-MON-YYYY HH24:MI') as approved_dt,
             t.created_by,
             to_char(t.created_dt, 'DD-MON-YYYY HH24:MI') as created_dt,
             '<a href="' ||
      apex_page.get_url(
          p_page        => 175,
          p_items       => 'P175_LOAN_ID,P175_LOAN_TXN_ID',
          p_values      => t.loan_id || ',' || t.loan_txn_id,
          p_clear_cache => '175'
      ) ||
      '" title="Transaction History">' ||
      '<span class="fa fa-history"></span></a>' history_link
      from hr_emp_loan_txns t
      where t.loan_id = :P171_LOAN_ID
        and t.approval_status = 'APPROVED'
      order by t.txn_date desc, t.loan_txn_id desc;
    page-items-to-submit: 
    - P171_LOAN_ID

  layout: 
    sequence: 60
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

