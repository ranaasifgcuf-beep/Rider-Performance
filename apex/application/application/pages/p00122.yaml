- # ====== Page Item: P122_NEW_STATUS ==========================
  id: 33541339374837563
  identification: 
    name: P122_NEW_STATUS
    type: Select List

  label: 
    label: New Status
    alignment: Left

  settings: 
    page-action-on-selection: None

  multiple-values: 
    type: No

  layout: 
    sequence: 40
    region: Change Status # 33539580672837567
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Required - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: true

  list-of-values: 
    type: SQL Query
    sql-query: |
      select distinct sm.status_name d,
             sm.status_code r
      from hr_status_master sm
      join hr_status_acl acl
        on acl.status_code = sm.status_code
      where sm.is_active = 'Y'
        and acl.can_set = 'Y'
        and acl.is_active = 'Y'
        and sec_pkg.has_role(acl.role_code) = 1
    display-extra-values: true
    display-null-value: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Null
    used: Only when current value in session state is null

  session-state: 
    storage: Per Request (Memory Only)

