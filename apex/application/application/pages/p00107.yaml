    - '#DEFAULT#'

  list-of-values: 
    type: SQL Query
    sql-query: |
      select distinct sm.status_name d,
             sm.status_code r
      from hr_status_master sm
      join hr_status_acl acl
        on acl.status_code = sm.status_code
