- # ====== Region: Risk Summary ================================
  id: 41406337221853013
  identification: 
    name: Risk Summary
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      declare
          l_total_risk       number;
          l_high_risk        number;
          l_pending_active   number;
          l_accident_recover number;
      begin
          select count(*)
            into l_total_risk
            from vw_hr_emp_asset_control
           where has_bike_yn = 'Y'
             and actually_working_yn = 'N';
      
          select count(*)
            into l_high_risk
            from vw_hr_emp_asset_control
           where has_bike_yn = 'Y'
             and actually_working_yn = 'N'
             and asset_risk_code in (
                  'BIKE_RECOVERY_PENDING',
                  'BIKE_RECOVERY_REQUIRED',
                  'BIKE_CLEARANCE_PENDING',
                  'BIKE_RETURN_REQUIRED'
             );
      
          select count(*)
            into l_pending_active
            from vw_hr_emp_asset_control
           where has_bike_yn = 'Y'
             and actually_working_yn = 'N'
             and asset_risk_code = 'BIKE_WITH_PENDING_ACTIVE';
      
          select count(*)
            into l_accident_recover
            from vw_hr_emp_asset_control
           where has_bike_yn = 'Y'
             and actually_working_yn = 'N'
             and asset_risk_code in (
                  'BIKE_RECOVERY_PENDING',
                  'BIKE_RECOVERY_REQUIRED'
             );
      
          htp.p('<div class="fleet-risk-kpi-grid">');
      
          htp.p('<div class="fleet-risk-kpi-card total">');
          htp.p('  <div class="fleet-risk-kpi-icon"><span class="fa fa-exclamation-triangle"></span></div>');
          htp.p('  <div class="fleet-risk-kpi-content">');
          htp.p('    <div class="fleet-risk-kpi-value">' || l_total_risk || '</div>');
          htp.p('    <div class="fleet-risk-kpi-label">Total Asset Risk</div>');
          htp.p('  </div>');
          htp.p('</div>');
      
          htp.p('<div class="fleet-risk-kpi-card high">');
          htp.p('  <div class="fleet-risk-kpi-icon"><span class="fa fa-warning"></span></div>');
          htp.p('  <div class="fleet-risk-kpi-content">');
          htp.p('    <div class="fleet-risk-kpi-value">' || l_high_risk || '</div>');
          htp.p('    <div class="fleet-risk-kpi-label">High Risk</div>');
          htp.p('  </div>');
          htp.p('</div>');
      
          htp.p('<div class="fleet-risk-kpi-card pending">');
          htp.p('  <div class="fleet-risk-kpi-icon"><span class="fa fa-hourglass-half"></span></div>');
          htp.p('  <div class="fleet-risk-kpi-content">');
          htp.p('    <div class="fleet-risk-kpi-value">' || l_pending_active || '</div>');
          htp.p('    <div class="fleet-risk-kpi-label">Pending Active With Bike</div>');
          htp.p('  </div>');
          htp.p('</div>');
      
          htp.p('<div class="fleet-risk-kpi-card recovery">');
          htp.p('  <div class="fleet-risk-kpi-icon"><span class="fa fa-ambulance"></span></div>');
          htp.p('  <div class="fleet-risk-kpi-content">');
          htp.p('    <div class="fleet-risk-kpi-value">' || l_accident_recover || '</div>');
          htp.p('    <div class="fleet-risk-kpi-label">Accident / Recovery</div>');
          htp.p('  </div>');
          htp.p('</div>');
      
          htp.p('</div>');
      end;

